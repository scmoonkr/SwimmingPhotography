// ── 기간 배정: 하루 수량을 정해 여러 날에 한 번에 (임시 배정으로 쌓이고 [저장]으로 확정) ──
// 한도 반영: 이미 배정된 일정과 하루 한도를 고려해 날짜별로 채운다. 주말은 제외(주말 포함을 켜면 포함).
function planDays({ start, total, target, weekend, useCap, load, cap }) {
  const rows = []
  let left = total
  let d = new Date(`${start}T12:00:00`)
  for (let i = 0; i < 120 && left > 0; i++, d = addDays(d, 1)) {
    const k = ymd(d)
    const wk = d.getDay() === 0 || d.getDay() === 6
    const c = cap[k]
    if (wk && !weekend && c == null) continue
    if (c === 0) continue
    const avail = useCap && c != null ? Math.max(0, c - (load[k] || 0)) : Infinity
    const take = Math.min(left, target, avail)
    if (take <= 0) continue
    rows.push({ date: k, qty: take, load: (load[k] || 0) + take, cap: c })
    left -= take
  }
  return { rows, left }
}

// entry 를 주면(작업관리 드로어에서) 그 배정 하나의 수량을 여러 날로 나눈다 — 공정(로고·이니셜)은 그대로 두고
// 원래 배정은 대신 빠지고(임시), 나눈 배정들이 새로 생긴다. 로고·이니셜을 나눈 뒤에도 공정별로 기간 배정을 할 수 있다.
async function openPlan(orderId, entry) {
  const o = entry
    ? { _id: entry.orderId, orderNo: entry.orderNo, title: entry.order?.title || '', partnerName: entry.order?.partnerName, dueAt: entry.order?.dueAt, totalQty: entry.qty, status: entry.order?.status }
    : SCH.orders.find((x) => String(x._id) === String(orderId))
  if (!o) return
  let start = new Date(entry ? `${entry.date}T12:00:00` : Date.now())
  while (start.getDay() === 0 || start.getDay() === 6) start = addDays(start, 1)
  let daily = 60
  try { daily = (await api('/settings')).planDaily || 60 } catch (e) { /* 기본값 사용 */ }
  const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${o.orderNo}</b> ${esc(o.title)}${entry
    ? ` · <b>${esc(entry.task || '전체')}</b> 배정 ${won(entry.qty)}장(${esc(entry.date)})을 여러 날로 나눕니다. 이 배정은 아래 결과로 대체됩니다.`
    : (o.totalQty ? ` · 주문 수량 ${won(o.totalQty)}장` : ' · 수량을 직접 입력하세요')}</div>`
    + fieldHtml('시작일', `<input class="field-input" id="pl_start" type="date" value="${ymd(start)}">`)
    + fieldHtml('하루 배정 수량(장)', `<input class="field-input" id="pl_daily" type="number" min="1" value="${daily}">`)
    + fieldHtml('총 수량(장)', `<input class="field-input" id="pl_total" type="number" min="1" value="${o.totalQty || ''}" ${entry ? 'disabled' : ''}>`)
    + (entry
      ? fieldHtml('공정', `<select class="field-input" id="pl_task" disabled><option value="${esc(entry.task || '')}">${esc(entry.task || '전체(구분 없음)')}</option></select>`)
      : fieldHtml('공정', '<select class="field-input" id="pl_task"><option value="">전체(구분 없음)</option><option value="로고">로고</option><option value="이니셜">이니셜</option><option value="both">로고 + 이니셜 (각각 전체 수량)</option></select>'))
    + '<div class="field full"><label class="c-opt"><input type="checkbox" id="pl_cap" checked> 하루 한도를 넘지 않게(이미 배정된 일정 고려)</label>'
    + '<label class="c-opt"><input type="checkbox" id="pl_wk"> 주말 포함</label></div>'
    + '<div class="field full"><span class="field-label">미리보기</span><div id="pl_prev"></div></div>'
  const dlg = shell(`기간 배정 · #${o.orderNo}`, body, closeFoot(`<button type="button" class="btn btn-primary" id="pl_ok">${entry ? '나눠서 배정' : '배정 추가'}</button>`))
  let rows = [], left = 0, token = 0
  const calc = async () => {
    const my = ++token
    const st = $('#pl_start').value
    const total = Math.round(Number($('#pl_total').value)), target = Math.round(Number($('#pl_daily').value))
    const prev = $('#pl_prev')
    if (!st || !(total > 0) || !(target > 0)) { rows = []; prev.innerHTML = '<div class="field-hint">시작일, 하루 수량, 총 수량을 입력하세요.</div>'; return }
    const to = ymd(addDays(new Date(`${st}T12:00:00`), 95))
    let r
    try { r = await api(`/schedule?from=${st}&to=${to}`) } catch (e) { return setErr(e.message) }
    if (my !== token) return
    // 날짜별 이미 배정된 수량: 서버 배정(임시 삭제·수정 반영) + 임시 변경
    const loadMap = {}
    const bump = (e) => { if (e.date >= st && e.date <= to) loadMap[e.date] = (loadMap[e.date] || 0) + e.qty }
    const self = entry?._id
    r.entries.forEach((e) => { if (e._id !== self && !DRAFT.removes.has(e._id) && !DRAFT.edits.has(e._id) && !DRAFT.cancelAll.has(String(e.orderId))) bump(e) })
    DRAFT.edits.forEach((e) => { if (e._id !== self && !DRAFT.cancelAll.has(String(e.orderId))) bump(e) })
    DRAFT.adds.forEach((e) => { if (e._id !== self) bump(e) })
    const tasks = $('#pl_task').value === 'both' ? ['로고', '이니셜'] : [$('#pl_task').value]
    rows = []; left = 0
    for (const t of tasks) {
      const res = planDays({ start: st, total, target, weekend: $('#pl_wk').checked, useCap: $('#pl_cap').checked, load: loadMap, cap: r.capacity })
      res.rows.forEach((x) => { rows.push({ ...x, task: t }); loadMap[x.date] = x.load })
      left += res.left
    }
    prev.innerHTML = rows.length
      ? `<div class="table-scroll"><table class="data pl-table"><thead><tr><th>날짜</th><th>공정</th><th class="num">수량</th><th class="num">당일 합계 / 한도</th></tr></thead><tbody>${
        rows.map((x) => `<tr><td>${mdText(x.date)} (${DOW[new Date(`${x.date}T12:00`).getDay()]})</td><td>${esc(x.task || '전체')}</td><td class="num">${won(x.qty)}장</td>
          <td class="num ${x.cap != null && x.load > x.cap ? 'over' : ''}">${won(x.load)} / ${x.cap == null ? '–' : won(x.cap)}</td></tr>`).join('')}</tbody></table></div>
        <div class="field-hint" style="margin-top:6px">${rows.length}건 · 합계 ${won(rows.reduce((t, x) => t + x.qty, 0))}장${rows.length ? ` · ${mdText(rows[0].date)} ~ ${mdText(rows[rows.length - 1].date)}` : ''}</div>`
        + (left > 0 ? `<div class="drawer-note" style="color:var(--bad);margin-top:6px">⚠ ${won(left)}장을 배정하지 못했습니다(약 95일 안에 한도가 부족). 하루 수량이나 한도를 조정하세요.</div>` : '')
      : '<div class="drawer-note" style="color:var(--bad)">배정할 수 있는 날이 없습니다. 한도·시작일을 확인하세요.</div>'
  }
  ;['#pl_start', '#pl_daily', '#pl_total', '#pl_task', '#pl_cap', '#pl_wk'].forEach((id) => $(id).addEventListener('input', debounce(calc, 200)))
  $('#pl_task').addEventListener('change', calc)
  $('#pl_cap').addEventListener('change', calc)
  $('#pl_wk').addEventListener('change', calc)
  calc()
  $('#pl_ok').onclick = () => {
    if (!rows.length) return setErr('배정할 내용이 없습니다.')
    if (entry) {
      if (left > 0 && !confirm(`${won(left)}장을 배정하지 못했습니다. 그래도 이 배정을 나눠서 대체할까요? (배정하지 못한 수량은 사라집니다)`)) return
      if (!String(entry._id).startsWith('new-')) DRAFT.noMerge.add(entry._id)      // 대체하는 것이므로 서버가 다른 배정에 합치지 않게
      stageRemove(entry._id)
    }
    for (const x of rows) {
      DRAFT.adds.push({
        _id: `new-${++DRAFT.seq}`, orderId: o._id, orderNo: o.orderNo, date: x.date, qty: x.qty, task: x.task, status: '지시', note: '',
        order: { orderNo: o.orderNo, title: o.title, partnerName: o.partnerName, dueAt: o.dueAt, totalQty: o.totalQty, status: o.status },
      })
    }
    SCH.cur = new Date(`${rows[0].date}T12:00:00`)
    dlg.close()
    SCH.reload()
  }
}

// 배정 현황: "로고 32/32장 · 이니셜 24/32장\" — 공정별 배정 합계와 주문 수량
function taskNote(en) {
  const tt = taskTotals(en.orderId)
  const total = en.order?.totalQty || 0
  const parts = Object.keys(tt).filter((k) => tt[k] > 0).map((k) => {
    const warn = total && tt[k] !== total ? ' style="color:var(--orange-deep);font-weight:700"' : ''
    return `<span${warn}>${k || '전체'} ${won(tt[k])}${total ? `/${won(total)}` : ''}장</span>`
  })
  return parts.length ? `<div class="drawer-note" style="grid-column:1/-1">배정 현황(저장 전 변경 포함): ${parts.join(' · ')}</div>` : ''
}

// 작업지시 편집 — 여기서의 변경도 임시 변경이며 [저장]을 눌러야 반영된다.
function openEntry(en, canW, repaint, canWork) {
  if (!en) return
  const dis = canW ? '' : 'disabled'
  const body = taskNote(en)
    + fieldHtml('작업 일자', `<input class="field-input" id="e_date" type="date" value="${esc(en.date)}" ${dis}>`)
    + fieldHtml('수량(장)', `<input class="field-input" id="e_qty" type="number" min="1" value="${en.qty}" ${dis}><span class="field-hint">줄이면 남은 수량은 같은 날짜의 별도 배정(지시)으로 분리됩니다.</span>`)
    + fieldHtml('공정', `<select class="field-input" id="e_task" ${dis}>${[['', '전체(구분 없음)'], ['로고', '로고'], ['이니셜', '이니셜']].map(([v, l]) => `<option value="${v}" ${v === (en.task || '') ? 'selected' : ''}>${l}</option>`).join('')}</select>`)
    + `<div class="field"><span class="field-label">작업 상태${canWork && !en._draft && !String(en._id).startsWith('new-') ? ' <span style="font-weight:400;color:var(--ink-light)">· 누르면 바로 처리</span>' : ''}</span>${
      canWork && !en._draft && !String(en._id).startsWith('new-')
        ? `<div class="sch-statusbtn" id="wk_st">${statusButtons(en)}</div>`
        : `<div>${badge(en.status, en.status === '완료' ? 'b-good' : en.status === '진행' ? 'b-info' : 'b-warn')}</div>${
          canWork && (en._draft || String(en._id).startsWith('new-') || DRAFT.edits.has(en._id)) ? '<span class="field-hint">저장 전의 임시 배정입니다. 오른쪽 위 <b>저장</b>을 누르면 지시·진행·완료를 처리할 수 있습니다.</span>' : ''}`}</div>`
    + fieldHtml('작업 메모', `<textarea class="field-input" id="e_note" ${dis}>${esc(en.note || '')}</textarea>`, true)
    + '<div class="field full"><span class="field-label">개별 주문내역 (제작 명세)</span><div id="en_pieces"><span class="field-hint">불러오는 중…</span></div></div>'
    + (canW && en.status === '지시' && en.qty >= Math.max(1, (SCH.cfg.machines || 0) * (SCH.cfg.perMachine || 0)) ? `<div class="field full"><span class="field-label">기간 배정 — ${esc(en.task || '전체')} 공정 ${won(en.qty)}장을 하루 수량씩 여러 날에</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn btn-ghost" id="pl_open">기간 배정</button>
        <span class="field-hint">이 배정이 날짜별 배정으로 대체됩니다(저장 전까지 임시). 로고·이니셜도 공정별로 각각 할 수 있습니다.</span></div></div>` : '')
    + (canW && en.qty > 1 ? `<div class="field full"><span class="field-label">수량 나누기 — 일부를 다른 날짜에 작업</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="field-input" id="sp_qty" type="number" min="1" max="${en.qty - 1}" placeholder="나눌 수량" style="flex:1;min-width:110px">
        <input class="field-input" id="sp_date" type="date" style="flex:1;min-width:150px"><button type="button" class="btn btn-ghost" id="sp_btn">나누기</button></div>
        <span class="field-hint">날짜를 비워 두면 같은 날짜(${esc(en.date)})로 나눕니다.</span></div>` : '')
    + (canW ? `<div class="field full"><span class="field-label">공정 나누기 — 로고와 이니셜을 따로 작업</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="field-input" id="tk_date" type="date" value="${esc(en.date)}" style="flex:1;min-width:150px">
        <button type="button" class="btn btn-ghost" id="tk_btn">${(en.task || '') ? `'${en.task === '로고' ? '이니셜' : '로고'}' 공정 추가` : '로고 · 이니셜로 나누기'}</button></div>
        <span class="field-hint">같은 수량(${won(en.qty)}장)의 ${(en.task || '') ? (en.task === '로고' ? '이니셜' : '로고') : '이니셜'} 작업이 위 날짜에 추가됩니다. 공정별로 날짜를 따로 옮길 수 있습니다.</span></div>` : '')
    + '<div class="drawer-note" style="grid-column:1/-1">적용한 변경은 일정표의 <b>저장</b>을 눌러야 반영됩니다.<br>"배정 취소"하면 이 수량이 같은 주문·같은 공정의 남은 배정(가장 빠른 날짜)에 합쳐지고, 남은 배정이 없으면 주문이 접수로 돌아갑니다.<br>로고·이니셜로 나뉜 주문은 "주문 전체 배정 취소"로 모든 공정을 한 번에 접수로 되돌릴 수 있습니다.</div>'
  const dlg = shell(`작업지시 · #${en.orderNo} ${esc(en.order?.title || '')}`, body,
    `${canW ? `<button type="button" class="btn btn-danger" id="e_del">${multiTask(en.orderId) ? '이 배정만 취소' : '배정 취소'}</button>` : ''}${
      canW && multiTask(en.orderId) ? '<button type="button" class="btn btn-danger" id="e_delall">주문 전체 배정 취소</button>' : ''}<button type="button" class="btn btn-ghost" id="e_open">주문 열기</button>${
      ''}${
      closeFoot(canW ? '<button type="button" class="btn btn-primary" id="e_apply">적용</button>' : '')}`)
  // 개별 주문내역(제작 명세) — 주문 수정 화면의 표와 같은 내용을 읽기 전용으로 보여 준다
  api(`/orders/${en.orderId}`).then((o) => {
    const box = $('#en_pieces')
    if (!box) return
    const ps = o.pieces || []
    if (!ps.length) { box.innerHTML = `<span class="field-hint">입력된 제작 명세가 없습니다. (주문 수량 ${en.order?.totalQty ? en.order.totalQty + '장' : '미정'})</span>`; return }
    const g = new Map()
    ps.forEach((p) => { const k = `${p.color || '-'} ${p.size || '-'}`; g.set(k, (g.get(k) || 0) + 1) })
    box.innerHTML = `<div class="field-hint" style="margin-bottom:6px">총 ${ps.length}줄 · ${[...g].map(([k, n]) => `${esc(k)} ${n}`).join(' · ')}</div>
      <div class="table-scroll" style="max-height:340px;overflow:auto"><table class="data"><thead><tr><th class="num">#</th>${PC_COLS.map((c) => `<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${
        ps.map((p, i) => `<tr><td class="num">${p.no || i + 1}</td>${PC_COLS.map(([k]) => `<td>${esc(p[k] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  }).catch(() => { const box = $('#en_pieces'); if (box) box.innerHTML = '<span class="field-hint">제작 명세를 불러오지 못했습니다.</span>' })
  $('#e_open').onclick = () => { dlg.close(); openForm(ENT.orders, { _id: String(en.orderId) }, SCH.reload) }
  $('#wk_st')?.querySelectorAll('[data-wkst]').forEach((b) => b.addEventListener('click', () => { dlg.close(); setWorkStatus(en, b.dataset.wkst) }))
  $('#e_del')?.addEventListener('click', () => { cancelEntry(en._id); dlg.close(); repaint() })
  $('#e_delall')?.addEventListener('click', () => {
    if (!confirm(`#${en.orderNo} 의 로고·이니셜 배정을 모두 취소하고 접수 상태로 되돌릴까요?`)) return
    if (cancelOrderAll(en.orderId)) { dlg.close(); repaint() }
  })
  $('#sp_btn')?.addEventListener('click', () => {
    const n = Math.round(Number($('#sp_qty').value)), d = $('#sp_date').value || en.date      // 날짜를 비우면 같은 날짜로 나눈다
    if (!(n > 0 && n < en.qty)) return setErr(`나눌 수량은 1 ~ ${en.qty - 1} 사이여야 합니다.`)
    stageChange(en._id, { qty: en.qty - n })
    DRAFT.adds.push({ _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: d, qty: n, task: en.task || '', status: '지시', note: '', order: en.order })
    dlg.close(); repaint()
  })
  $('#pl_open')?.addEventListener('click', () => { dlg.close(); openPlan(en.orderId, en) })
  $('#tk_btn')?.addEventListener('click', () => {
    const d = $('#tk_date').value || en.date
    const cur = en.task || ''
    const other = cur === '로고' ? '이니셜' : cur === '이니셜' ? '로고' : '이니셜'
    if (!cur) stageChange(en._id, { task: '로고' })                    // 구분 없던 배정은 로고로 바꾸고 이니셜을 추가
    DRAFT.adds.push({ _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: d, qty: en.qty, task: other, status: '지시', note: '', order: en.order })
    dlg.close(); repaint()
  })
  $('#e_apply')?.addEventListener('click', () => {
    const qty = Math.round(Number($('#e_qty').value))
    if (!(qty > 0)) return setErr('수량은 1 이상이어야 합니다.')
    if (!$('#e_date').value) return setErr('작업 일자를 선택하세요.')
    const task = $('#e_task').value
    stageChange(en._id, { date: $('#e_date').value, qty, task, note: $('#e_note').value })
    // 수량을 줄이면 줄어든 수량이 사라지지 않도록, 원래 날짜에 별도 배정으로 남긴다 (일부만 완료한 경우의 나머지 등).
    // 필요 없는 수량이면 그 칸을 '배정 취소' 하면 된다.
    if (qty < en.qty) {
      DRAFT.adds.push({
        _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: en.date, qty: en.qty - qty, task,
        status: en.status === '진행' ? '진행' : '지시', note: '', order: en.order,
      })
    }
    dlg.close(); repaint()
  })
}

// ── 재고현황 (+ 입출고 · 이력) ────────────────────────────
async function viewStock() {
  const canW = me.can.includes('stock')
  pageShell({
    en: 'Stock', title: '재고현황', addLabel: canW ? '입출고 등록' : '',
    tools: `<select id="k" class="table-select"><option value="material">물품</option><option value="goods">상품</option></select>
      <select id="v" class="table-select"><option value="list">목록 보기</option><option value="matrix">색상×사이즈 보기</option></select>
      <input id="q" class="table-search" placeholder="이름·코드·색상 검색…" type="search">
      <label class="table-check"><input type="checkbox" id="low"> 안전재고 이하만</label>`,
  })
  let list = []
  const load = async () => {
    try {
      const p = new URLSearchParams({ kind: $('#k').value })
      if ($('#q').value) p.set('q', $('#q').value)
      if ($('#low').checked) p.set('low', '1')
      list = (await api(`/stock?${p}`)).items
      if ($('#v').value === 'matrix') paintMatrix(list, canW ? (r) => openMove(r, load) : null)
      else paintTable(list, [
        ['img', '', (r) => thumb(r.image)], ['code', '코드', (r) => `<span class="mono">${esc(r.code)}</span>`], ['name', '이름', (r) => `<b>${esc(r.name)}</b>`],
        ['cat', '분류', (r) => badge(r.category || '-', 'b-mute')], ['color', '색상', (r) => esc(r.color)], ['size', '사이즈', (r) => esc(r.size)],
        ['sup', '발주처', (r) => esc(r.supplier)],
        ['on', '현재고', (r) => `<span class="${r.low ? 'low' : ''}">${won(r.onHand)} ${esc(r.unit)}</span>`, 'r'],
        ['ss', '안전재고', (r) => won(r.safetyStock), 'r'], ['last', '최근 변동', (r) => day(r.lastMoveAt)],
      ], canW ? (r) => openMove(r, load) : null, '등록된 항목이 없습니다. 먼저 물품·상품을 등록하세요.')
      $('#ft').textContent = `${list.length}건`
    } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }
  $('#k').onchange = load
  $('#v').onchange = load
  $('#q').addEventListener('input', debounce(load))
  $('#low').onchange = load
  $('#add')?.addEventListener('click', () => (list.length ? openMove(list[0], load, list) : alert('먼저 물품·상품을 등록하세요.')))
  load()
}

// 이름별로 묶어 색상(행) × 사이즈(열) 표로 보여 준다 — 예: 수모 블랙 L 의 재고가 한눈에
function paintMatrix(list, onCell) {
  const t = $('#tbl')
  if (!list.length) { t.innerHTML = emptyTable('등록된 항목이 없습니다.'); return }
  const groups = new Map()
  for (const r of list) { if (!groups.has(r.name)) groups.set(r.name, []); groups.get(r.name).push(r) }
  const sizeRank = ['XS', 'S', 'M', 'L', 'XL', 'XXL']
  const bySize = (a, b) => (sizeRank.indexOf(a) + 1 || 99) - (sizeRank.indexOf(b) + 1 || 99) || a.localeCompare(b, 'ko')
  const cells = []
  t.innerHTML = [...groups].map(([name, items]) => {
    const sizes = [...new Set(items.map((r) => r.size))].sort(bySize)
    const colors = [...new Set(items.map((r) => r.color))].sort((a, b) => a.localeCompare(b, 'ko'))
    const find = (c, s) => items.find((r) => r.color === c && r.size === s)
    const total = items.reduce((s, r) => s + r.onHand, 0)
    return `<div style="padding:14px 18px 6px;font-weight:700">${esc(name)} <span class="hint" style="font-weight:400;color:var(--ink-light)">합계 ${won(total)} ${esc(items[0].unit)}</span></div>
      <table class="data"><thead><tr><th>색상 \\ 사이즈</th>${sizes.map((s) => `<th class="num">${esc(s || '-')}</th>`).join('')}</tr></thead><tbody>${
        colors.map((c) => `<tr><td class="strong">${esc(c || '-')}</td>${sizes.map((s) => {
          const r = find(c, s)
          if (!r) return '<td class="num muted">·</td>'
          cells.push(r)
          return `<td class="num ${onCell ? 'clickable' : ''} ${r.low ? 'low' : ''}" data-ci="${cells.length - 1}" style="${onCell ? 'cursor:pointer' : ''}">${won(r.onHand)}</td>`
        }).join('')}</tr>`).join('')}</tbody></table>`
  }).join('')
  if (onCell) t.querySelectorAll('[data-ci]').forEach((td) => { td.onclick = () => onCell(cells[td.dataset.ci]) })
}

async function openMove(row, done, all) {
  const choices = all || [row]
  const hist = (await api(`/stock/moves?kind=${row.kind}&code=${encodeURIComponent(row.code)}&limit=10`).catch(() => ({ items: [] }))).items
  const body = fieldHtml('품목', `<select class="field-input" id="m_code">${choices.map((r) => `<option value="${esc(r.code)}" ${r.code === row.code ? 'selected' : ''}>${esc(optName(r))} — 현재 ${won(r.onHand)}</option>`).join('')}</select>`, true)
    + fieldHtml('구분', '<select class="field-input" id="m_type"><option value="in">입고</option><option value="out">출고(사용)</option><option value="adjust">실사 보정</option></select>')
    + fieldHtml('수량', '<input class="field-input" id="m_qty" type="number" min="0" step="any">')
    + fieldHtml('사유', '<input class="field-input" id="m_reason" placeholder="예: 기타 입고, 자수 사용, 폐기">', true)
    + '<div class="drawer-note" id="m_h"></div>'
    + (hist.length ? `<div class="drawer-logs">${hist.map((m) => `${day(m.at)} · ${({ in: '입고', out: '출고', adjust: '보정' })[m.type]} ${m.delta > 0 ? '+' : ''}${won(m.delta)} → ${won(m.balance)} · ${esc(m.reason)} ${esc(m.note)}`).join('<br>')}</div>` : '')
  const dlg = shell('입출고 등록', body, closeFoot('<button type="button" class="btn btn-primary" id="save">등록</button>'))
  const hint = () => { $('#m_h').textContent = $('#m_type').value === 'adjust' ? '실사 보정은 "실제로 센 수량"을 입력하세요. 현재고와의 차이가 이력으로 남습니다. (여러 품목은 재고검수 메뉴 이용)' : '' }
  $('#m_type').onchange = hint; hint()
  $('#save').onclick = async () => {
    try {
      await api('/stock/moves', { method: 'POST', body: { kind: row.kind, code: $('#m_code').value, type: $('#m_type').value, qty: Number($('#m_qty').value), reason: $('#m_reason').value } })
      dlg.close(); done()
    } catch (e) { setErr(e.message) }
  }
}

async function openPO(rec, done) {
  const canW = me.can.includes('stock'), canD = me.can.includes('delete')
  const po = rec ? await api(`/purchase-orders/${rec._id}`) : null
  const mats = (await api('/materials/options?active=1')).items
  const received = po?.lines.some((l) => l.receivedQty > 0)
  const editable = canW && (!po || (!received && po.status !== '취소'))
  const canReceive = canW && po && po.status !== '취소' && po.status !== '입고완료'
  const linesText = (po?.lines || []).map((l) => [l.code, l.qty, l.unitPrice].join(', ')).join('\n')
  const dis = canW && po?.status !== '취소' ? '' : 'disabled'

  let body = fieldHtml('발주처', `<input class="field-input" id="p_sup" value="${esc(po?.supplier || '')}" list="p_sups" ${dis}><datalist id="p_sups">${[...new Set(mats.map((m) => m.supplier).filter(Boolean))].map((s) => `<option value="${esc(s)}">`).join('')}</datalist>`, true)
    + fieldHtml('발주일', `<input class="field-input" id="p_ord" type="date" value="${day(po?.orderedAt)}" ${dis}>`)
    + fieldHtml('입고 예정일', `<input class="field-input" id="p_exp" type="date" value="${day(po?.expectedAt)}" ${dis}>`)
  if (editable) {
    body += pickerHtml('pk_po', mats)
      + fieldHtml('발주 품목 (한 줄에 하나)', `<textarea class="field-input" id="p_lines">${esc(linesText)}</textarea><span class="field-hint">물품코드, 수량, 단가(비우면 구입가격)</span>`, true)
  }
  body += fieldHtml('메모', `<textarea class="field-input" id="p_memo" ${dis}>${esc(po?.memo || '')}</textarea>`, true)
  if (po) {
    body += `<div class="field full"><span class="field-label">품목 · 입고 (합계 ${won(po.total)}원)</span><table class="data"><thead><tr><th>물품</th><th class="num">발주</th><th class="num">기입고</th><th class="num">단가</th>${canReceive ? '<th class="num">이번 입고</th>' : ''}</tr></thead><tbody>${
      po.lines.map((l) => `<tr><td>${esc(optName(l))}</td><td class="num">${won(l.qty)}</td><td class="num">${won(l.receivedQty)}</td><td class="num">${won(l.unitPrice)}</td>${
        canReceive ? `<td class="num"><input class="field-input" style="width:90px;text-align:right" type="number" min="0" data-rc="${esc(l.code)}" value="${Math.max(0, l.qty - l.receivedQty)}"></td>` : ''}</tr>`).join('')}</tbody></table></div>`
  }
  const dlg = shell(po ? `발주 #${po.poNo} · ${esc(po.status)}` : '물품 발주', body,
    `${po && canD && !received ? '<button type="button" class="btn btn-danger" id="px">삭제</button>' : ''}${po && canW && !received && po.status === '발주' ? '<button type="button" class="btn btn-ghost" id="pc">발주 취소</button>' : ''}${
      closeFoot(canReceive ? '<button type="button" class="btn btn-ghost" id="prc">입고 처리</button>' : '', canW && po?.status !== '취소' ? '<button type="button" class="btn btn-primary" id="save">저장</button>' : '')}`)
  wirePicker('pk_po', '#p_lines')

  const run = async (fn) => { try { await fn(); dlg.close(); done() } catch (e) { setErr(e.message) } }
  $('#save')?.addEventListener('click', () => run(async () => {
    const body = { supplier: $('#p_sup').value, orderedAt: $('#p_ord').value || null, expectedAt: $('#p_exp').value || null, memo: $('#p_memo').value }
    if ($('#p_lines')) body.lines = rows($('#p_lines').value).map(([code, qty, unitPrice]) => ({ code, qty: Number(qty) || 0, unitPrice: unitPrice === '' || unitPrice == null ? null : Number(unitPrice) }))
    if (po) await api(`/purchase-orders/${po._id}`, { method: 'PATCH', body })
    else await api('/purchase-orders', { method: 'POST', body })
  }))
  $('#prc')?.addEventListener('click', () => run(async () => {
    const lines = [...document.querySelectorAll('[data-rc]')].map((i) => ({ code: i.dataset.rc, qty: Number(i.value) || 0 })).filter((l) => l.qty > 0)
    await api(`/purchase-orders/${po._id}/receive`, { method: 'POST', body: { lines } })
  }))
  $('#pc')?.addEventListener('click', () => { if (confirm('발주를 취소할까요?')) run(() => api(`/purchase-orders/${po._id}/cancel`, { method: 'POST' })) })
  $('#px')?.addEventListener('click', () => { if (confirm('삭제할까요?')) run(() => api(`/purchase-orders/${po._id}`, { method: 'DELETE' })) })
}

  const dlg = shell('출고 등록', body, closeFoot('<button type="button" class="btn btn-primary" id="save">출고</button>'))
  wirePicker('pk_sh', '#s_lines')
  $('#save').onclick = async () => {

    }))

async function openStocktake(rec, done) {
  const st = await api(`/stocktakes/${rec._id}`)
  const open = st.status === '진행중'
  const canW = me.can.includes('stock')
  const diffCls = (d) => (d == null || d === 0 ? '' : d < 0 ? 'low' : '')
  const body = `<div class="drawer-note">${st.kind === 'goods' ? '상품' : '물품'} 검수 #${st.no} · ${esc(st.status)}${st.note ? ' · ' + esc(st.note) : ''}${
    open ? ' — 실제로 센 수량을 입력하세요. 비워 둔 줄은 보정하지 않습니다.' : ` · 보정 ${won(st.adjusted)}건, 미입력 ${won(st.skipped)}건`}</div>
    <div class="field full"><table class="data"><thead><tr><th>코드</th><th>이름</th><th>색상</th><th>사이즈</th><th class="num">전산</th><th class="num">실사</th><th class="num">차이</th></tr></thead><tbody>${
      st.lines.map((l) => `<tr><td class="mono">${esc(l.code)}</td><td>${esc(l.name)}</td><td>${esc(l.color)}</td><td>${esc(l.size)}</td><td class="num">${won(l.systemQty)}</td>
        <td class="num">${open && canW ? `<input class="field-input" style="width:90px;text-align:right" type="number" min="0" step="any" data-ct="${esc(l.code)}" data-sys="${l.systemQty}" value="${l.countedQty ?? ''}">` : won(l.countedQty)}</td>
        <td class="num ${diffCls(l.diff)}" data-df="${esc(l.code)}">${l.diff == null ? '' : (l.diff > 0 ? '+' : '') + won(l.diff)}</td></tr>`).join('')}</tbody></table></div>`
  const dlg = shell(`재고검수 #${st.no}`, body,
    `${open && canW ? '<button type="button" class="btn btn-danger" id="tx">삭제</button>' : ''}${closeFoot(open && canW ? '<button type="button" class="btn btn-ghost" id="tsv">저장</button><button type="button" class="btn btn-primary" id="tcp">검수 완료(재고 보정)</button>' : '')}`)
  document.querySelectorAll('[data-ct]').forEach((inp) => {
    inp.oninput = () => {
      const cell = document.querySelector(`[data-df="${CSS.escape(inp.dataset.ct)}"]`)
      if (inp.value === '') { cell.textContent = ''; return }
      const d = Number(inp.value) - Number(inp.dataset.sys)
      cell.textContent = (d > 0 ? '+' : '') + won(d); cell.className = `num ${d < 0 ? 'low' : ''}`
    }
  })
  const collect = () => [...document.querySelectorAll('[data-ct]')].map((i) => ({ code: i.dataset.ct, countedQty: i.value }))
  const run = async (fn) => { try { await fn(); dlg.close(); done() } catch (e) { setErr(e.message) } }
  $('#tsv')?.addEventListener('click', () => run(() => api(`/stocktakes/${st._id}`, { method: 'PATCH', body: { lines: collect() } })))
  $('#tcp')?.addEventListener('click', () => {
    if (!confirm('입력한 실사 수량으로 재고를 보정합니다. 완료 후에는 되돌릴 수 없습니다.')) return
    run(async () => { await api(`/stocktakes/${st._id}`, { method: 'PATCH', body: { lines: collect() } }); await api(`/stocktakes/${st._id}/complete`, { method: 'POST' }) })
  })
  $('#tx')?.addEventListener('click', () => { if (confirm('이 검수를 삭제할까요?')) run(() => api(`/stocktakes/${st._id}`, { method: 'DELETE' })) })
}
