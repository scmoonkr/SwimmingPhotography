      ev.dataTransfer.setData('text/plain', JSON.stringify({ k: 'order', id: el.dataset.oid }))
      ev.dataTransfer.effectAllowed = 'copy'
      el.classList.add('dragging')
    })
    el.addEventListener('dragend', () => el.classList.remove('dragging'))
    el.addEventListener('click', () => openForm(ENT.orders, { _id: el.dataset.oid }, SCH.reload))
  })

  box.querySelectorAll('[data-plan]').forEach((b) => b.addEventListener('click', (ev) => { ev.stopPropagation(); openPlan(b.dataset.plan) }))
}

// 납기 초과 작업: 완료되지 않았고 ① 작업일이 납기보다 늦거나 ② 납기가 이미 지난 경우. 이유 문구를 돌려준다(아니면 null).
function lateInfo(en) {
  if (!en || en.status === '완료' || !en.order?.dueAt) return null
  const due = new Date(en.order.dueAt).toISOString().slice(0, 10)
  const md = (d) => d.slice(5).replace('-', '/')
  if (en.date > due) return `작업일(${md(en.date)})이 납기(${md(due)})보다 늦습니다`
  if (due < ymd(new Date())) return `납기(${md(due)})가 지났는데 아직 완료되지 않았습니다`
  return null
}

function paintCal(canW, repaint, canWork) {
  const cal = $('#sch_cal')
  $('#s_label').textContent = schLabel()
  document.querySelectorAll('.sch-seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === SCH.view))
  const [s, e] = schRange()
  const today = ymd(new Date())
  const entries = currentEntries()
  const by = new Map()
  entries.forEach((en) => { if (!by.has(en.date)) by.set(en.date, []); by.get(en.date).push(en) })

  const costs = machineCosts(entries)
  const mcLine = (en) => {
    const m = mcOf(en.machineId)
    if (!m) return en.status !== '완료' && SCH.machines.length ? '<div class="prog">자수기 미배정</div>' : ''
    const c = costs.get(en._id), sw = c ? c.swaps : 0
    const need = needsOfEntry(en)
    return `<div class="prog"><b>${esc(m.name)}</b> · ${sw ? `<span class="late-txt">실 교체 ${sw}개 (약 ${Math.round(sw * SCH.swapMin)}분)</span>` : '실 교체 없음'}${need.length ? ` · 필요한 실 ${need.map((x) => esc(x)).join(' ')}` : ''}</div>`
  }
  const mcChip = (en) => {
    const m = mcOf(en.machineId)
    if (!m) return ''
    const c = costs.get(en._id)
    const sw = c ? c.swaps : 0
    return `<span class="mchip ${sw ? 'warn' : ''}" title="${esc(`${m.name} — 실 교체 ${sw}개${sw ? ` (약 ${Math.round(sw * SCH.swapMin)}분)` : ''}`)}">${esc(m.name.replace(/^자수기\s*/, '') || m.name)}${sw ? ` ·교체${sw}` : ' ✓'}</span>`
  }
  const chip = (en, big) => `<div class="sch-chip ${en._draft ? 'draft' : ''} ${lateInfo(en) ? 'late' : ''}" data-st="${esc(en.status)}" data-task="${esc(en.task || '')}" data-eid="${en._id}" ${canW ? 'draggable="true"' : ''}
      title="${esc(`#${en.orderNo} ${en.order?.title || ''} — ${en.qty}장${en.task ? ' ' + en.task : ''} (${en.status})${en._draft ? ' · 저장 전' : ''}${lateInfo(en) ? '\n⚠ ' + lateInfo(en) : ''}${en.note ? '\n' + en.note : ''}`)}">
      <b>${lateInfo(en) ? '⚠ ' : ''}#${en.orderNo}</b> ${won(en.qty)}장${en.status !== '완료' && ['none', 'working'].includes(en.order?.designState) ? '<span class="dzflag" title="디자인 미확정">D</span>' : ''}${en.task ? `<span class="task">${esc(en.task)}</span>` : ''}${mcChip(en)}${big ? `<span class="sub">${esc(en.order?.title || '')}</span>` : ''}</div>`
  // 날짜 머리글: 합계/한도. 한도를 넘으면 붉게(관리자가 보고 재배정), 주말 작업은 '휴무' 표시
  const loadOf = (list) => (list || []).reduce((t, x) => t + x.qty, 0)
  const dayHead = (k, list) => {
    const n = loadOf(list), cap = SCH.cap[k]
    if (cap == null) return n ? `<span class="sch-sum off" title="작업일이 아닌 날(주말)에 배정되어 있습니다">휴무 ${won(n)}장</span>` : ''
    if (!n) return `<span class="sch-sum faint" title="하루 한도">한도 ${won(cap)}</span>`
    const over = n > cap
    return `<span class="sch-sum ${over ? 'over' : ''}" title="하루 한도 ${cap}장${over ? ` — ${n - cap}장 초과` : ''}">${over ? '⚠ ' : ''}${won(n)}/${won(cap)}</span>`
  }
  {
    const [rs, re] = schRange()
    let overDays = 0
    for (let d = new Date(rs); d <= re; d = addDays(d, 1)) {
      const k = ymd(d)
      if (SCH.cap[k] != null && loadOf(by.get(k)) > SCH.cap[k]) overDays++
    }
    $('#s_over').textContent = overDays ? `⚠ 한도 초과 ${overDays}일` : ''
  }

  if (SCH.view === 'day') {
    const key = ymd(SCH.cur)
    const list = by.get(key) || []
    const dn = loadOf(list), dcap = SCH.cap[key]
    const head = dcap == null ? (dn ? `<div class="sch-dayhead over" style="color:var(--orange-deep);border-color:var(--orange)">휴무일 작업 ${won(dn)}장</div>` : '<div class="sch-dayhead">휴무일(주말)입니다. 필요하면 일정 계획에서 직접 배정하세요.</div>')
      : `<div class="sch-dayhead ${dn > dcap ? 'over' : ''}">합계 ${won(dn)} / 하루 한도 ${won(dcap)}장${dn > dcap ? ` — ⚠ ${won(dn - dcap)}장 초과, 재배정이 필요합니다` : ''}</div>`
    cal.innerHTML = `<div class="sch-dayview" data-date="${key}">
      ${head}
      ${list.length ? list.map((en) => `<div class="sch-entry ${en._draft ? 'draft' : ''} ${lateInfo(en) ? 'late' : ''}" data-task="${esc(en.task || '')}" data-eid="${en._id}" ${canW ? 'draggable="true"' : ''}>
        <div class="qty">${won(en.qty)}장${en.task ? `<div style="font-size:12px;font-weight:700">${esc(en.task)}</div>` : ''}</div>
        <div class="meta"><div class="t">#${en.orderNo} ${esc(en.order?.title || '')}</div>
          <div class="s">${esc(en.order?.partnerName || '')}${en.status !== '완료' && ['none', 'working'].includes(en.order?.designState) ? ` · <span class="late-txt" style="color:var(--orange-deep)">디자인 ${en.order.designState === 'none' ? '필요' : '작업 중'}</span>` : ''}${lateInfo(en) ? ` · <span class="late-txt">⚠ ${esc(lateInfo(en))}</span>` : ''}${en.note ? ` · ${esc(en.note)}` : ''}${en._draft ? ' · 저장 전' : ''}</div>
          ${(en.order?.designs || []).filter((d) => !en.task || !d.role || d.role === en.task).map((d) => `<div class="sch-dz">${thumb(d.preview)}
            <span><b>${esc(d.role || '디자인')}</b> ${esc(d.code)} v${d.version} ${esc(d.status)}${d.colors.some((c) => c.label || c.code || c.no) ? ` · 컬러 ${d.colors.filter((c) => c.label || c.code || c.no).map((c) => esc(c.label || c.code || c.no)).join(', ')}` : ''}</span>
            ${d.files.map((f) => `<a href="${esc(fileUrl(f.path))}" download>${esc(f.ext)} 파일</a>`).join(' ')}</div>`).join('')}
          ${mcLine(en)}
          ${en.order?.totalQty ? `<div class="prog">${esc(en.task || '전체')} 공정 완료 ${won(en.order.taskDone?.[en.task || ''] || 0)} / ${won(en.order.totalQty)}장</div>` : ''}</div>
        ${badge(en.status, en.status === '완료' ? 'b-good' : en.status === '진행' ? 'b-info' : 'b-warn')}
        ${canWork && !en._draft ? `<div class="sch-actions">${statusButtons(en)}</div>` : (canWork ? '<div class="sch-actions"><span class="field-hint">저장 후 처리 가능</span></div>' : '')}</div>`).join('')
        : '<div class="sch-hint">이 날짜에 배정된 작업이 없습니다.<br>왼쪽 주문을 이곳으로 끌어다 놓으세요.</div>'}</div>`
  } else {
    const days = []
    for (let d = new Date(s); d <= e; d = addDays(d, 1)) days.push(new Date(d))
    cal.innerHTML = `<div class="sch-grid ${SCH.view}">${DOW.map((n, i) => `<div class="sch-dow ${i === 0 ? 'sun' : ''}">${n}</div>`).join('')}${
      days.map((d) => {
        const k = ymd(d)
        const out = SCH.view === 'month' && d.getMonth() !== SCH.cur.getMonth()
        const list = by.get(k) || []
        return `<div class="sch-cell ${out ? 'out' : ''} ${k === today ? 'today' : ''}" data-date="${k}">
          <div class="sch-day"><span class="sch-daynum ${d.getDay() === 0 ? 'sun' : ''}">${d.getDate()}</span>${dayHead(k, list)}</div>
          ${list.map((en) => chip(en, SCH.view === 'week')).join('')}</div>`
      }).join('')}</div>`
  }

  // 놓기(drop) — 주문 카드는 임시 배정 추가, 일정 칸은 날짜 이동. 저장은 [저장] 버튼에서.
  cal.querySelectorAll('[data-date]').forEach((cell) => {
    if (!canW) return
    cell.addEventListener('dragover', (ev) => { ev.preventDefault(); cell.classList.add('over') })
    cell.addEventListener('dragleave', (ev) => { if (!cell.contains(ev.relatedTarget)) cell.classList.remove('over') })
    cell.addEventListener('drop', (ev) => {
      ev.preventDefault()
      cell.classList.remove('over')
      const d = dragData(ev)
      if (!d) return
      if (d.k === 'order') {
        const o = SCH.orders.find((x) => String(x._id) === d.id)
        if (o) stageAdd(o, cell.dataset.date)
      } else if (d.k === 'entry') {
        const r = dropEntry(d.id, cell.dataset.date, ev.target.closest?.('[data-eid]')?.dataset.eid)
        if (r?.merged) workMsg(`#${r.orderNo} ${r.task ? r.task + ' ' : ''}${won(r.qty)}장을 ${mdText(r.date)} 배정에 합쳤습니다 (저장 전)`)
      }
      repaint()
    })
  })
  cal.querySelectorAll('[data-wkst]').forEach((b) => {
    b.addEventListener('click', (ev) => { ev.stopPropagation(); setWorkStatus(findEntry(b.dataset.eid), b.dataset.wkst) })
    b.addEventListener('dragstart', (ev) => ev.preventDefault())
  })
  cal.querySelectorAll('[data-wk]').forEach((b) => {
    b.addEventListener('click', (ev) => { ev.stopPropagation(); workAction(findEntry(b.dataset.eid), b.dataset.wk) })
    b.addEventListener('dragstart', (ev) => ev.preventDefault())
  })
  cal.querySelectorAll('[data-eid]').forEach((el) => {
    el.addEventListener('dragstart', (ev) => {
      ev.dataTransfer.setData('text/plain', JSON.stringify({ k: 'entry', id: el.dataset.eid }))
      ev.dataTransfer.effectAllowed = 'move'
    })
    el.addEventListener('click', (ev) => { ev.stopPropagation(); openEntry(findEntry(el.dataset.eid), canW, repaint, canWork) })
  })
}

// ── 작업 처리 (시작 · 완료 · 완료 취소) — 계획과 달리 저장 버튼 없이 즉시 반영된다 ──
function workMsg(text, bad) {
  const el = $('#w_msg')
  if (!el) return
  el.textContent = text
  el.style.color = bad ? 'var(--bad)' : ''
  clearTimeout(workMsg.t)
  workMsg.t = setTimeout(() => { el.textContent = '' }, 6000)
}
function workResultText(r, en, action) {
  const parts = [`#${en.orderNo} ${en.task ? en.task + ' ' : ''}${{ start: '작업 시작', complete: '완료 처리', undo: '완료 취소', reset: '지시로 되돌림' }[action]}`]
  for (const c of r.statusChanged || []) parts.push(`주문 ${c.from} → ${c.to}`)
  if (r.stock?.moves) parts.push(`수모 ${Math.abs(r.stock.delta)}장 ${r.stock.delta > 0 ? '재고 차감' : '재고 복원'}`)
  if (r.stock?.unmatched) parts.push(`⚠ 수모 옵션을 찾지 못해 ${r.stock.unmatched}장은 재고에 반영되지 않았습니다`)
  return parts.join(' · ')
}
// 작업 상태 버튼(지시 · 진행 · 완료) — 누르면 바로 처리된다 (저장 불필요)
const statusButtons = (en) => WORK_ST.map((st) =>
  `<button type="button" class="${en.status === st ? 'on' : ''}" data-wkst="${st}" data-eid="${en._id}" ${en.status === st ? 'aria-pressed="true"' : ''}>${st}</button>`).join('')
function setWorkStatus(en, to) {
  if (!en || en.status === to) return
  if (to === '완료') return workAction(en, 'complete')                    // 수량 입력창
  if (en.status === '완료') return workAction(en, 'undo', undefined, undefined, to)   // 완료 → 진행/지시
  if (to === '진행') return workAction(en, 'start')
  return workAction(en, 'reset')                                           // 진행 → 지시
}

async function workAction(en, action, qty, carry, to) {
  if (!en) return
  if (draftCount()) { alert('저장하지 않은 배정 변경이 있습니다. 먼저 저장하거나 변경을 취소한 뒤 처리하세요.'); return }
  if (action === 'complete' && qty === undefined) return openComplete(en)
  if ((action === 'start' || action === 'complete') && ['none', 'working'].includes(en.order?.designState)) {
    const why = en.order.designState === 'none' ? '디자인이 연결되지 않았습니다' : '연결된 디자인이 아직 확정되지 않았습니다'
    if (!confirm(`#${en.orderNo} ${why}.\n그래도 ${action === 'start' ? '작업을 시작' : '완료 처리'}할까요?`)) return
  }
  if (action === 'undo' && !confirm(`#${en.orderNo} ${en.task || ''} ${won(en.qty)}장의 완료를 취소할까요? (사용한 수모 재고는 되돌려집니다)`)) return
  try {
    const r = await api(`/schedule/${en._id}/work`, { method: 'POST', body: { action, qty, carry, to } })
    await SCH.reload()
    workMsg(workResultText(r, en, action), !!r.stock?.unmatched)
  } catch (e) { alert(e.message) }
}
const mdText = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`
// 다음 작업일 추정: 같은 주문·공정의 다음 배정 날짜, 없으면 다음 평일 (서버도 같은 규칙으로 정한다)
function nextWorkDate(en) {
  const nxt = knownEntries().filter((e) => String(e.orderId) === String(en.orderId) && e._id !== en._id && e.status !== '완료'
    && (e.task || '') === (en.task || '') && e.date > en.date).sort((a, b) => a.date.localeCompare(b.date))[0]
  if (nxt) return nxt.date
  let d = addDays(new Date(`${en.date}T12:00:00`), 1)
  while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1)
  return ymd(d)
}

// 완료 수량 입력
//   · 계획보다 적게 → 남은 수량은 같은 날·같은 자수기의 지시로 남는다
//   · 계획보다 많이 → 이 칸의 수량만 늘린다 (다른 배정의 수량은 다시 계산하지 않는다)
function openComplete(en) {
  const nextD = nextWorkDate(en)
  const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${en.orderNo}</b> ${esc(en.order?.title || '')}${en.task ? ` · <b>${esc(en.task)}</b>` : ''} · ${esc(en.date)} · 계획 ${won(en.qty)}장</div>`
    + fieldHtml('완료 수량(장)', `<input class="field-input" id="c_qty" type="number" min="1" value="${en.qty}" inputmode="numeric" style="font-size:20px;padding:14px">`, true)
    + '<div id="c_more" style="grid-column:1/-1"></div>'
  const dlg = shell(`완료 처리 · #${en.orderNo}`, body, closeFoot('<button type="button" class="btn btn-primary" id="c_ok">완료 처리</button>'))
  const more = () => {
    const n = Math.round(Number($('#c_qty').value))
    const box = $('#c_more')
    if (n > 0 && n < en.qty) {
      box.innerHTML = `<div class="drawer-note">남은 <b>${won(en.qty - n)}장</b>은 같은 날(${mdText(en.date)})·같은 자수기의 지시로 남습니다. 다른 배정의 수량은 바꾸지 않습니다.</div>`
    } else if (n > en.qty) {
      box.innerHTML = `<div class="drawer-note">계획(${won(en.qty)}장)보다 <b>${won(n - en.qty)}장</b> 더 했습니다. 이 칸의 수량만 늘어나고, 다른 배정의 수량은 바꾸지 않습니다.</div>`
    } else box.innerHTML = ''
  }
  $('#c_qty').addEventListener('input', more)
  $('#c_qty').select()
  $('#c_ok').onclick = () => {
    const n = Math.round(Number($('#c_qty').value))
    if (!(n > 0)) return setErr('완료 수량은 1 이상이어야 합니다.')
    dlg.close()
    workAction(en, 'complete', n)
  }
}

// ── 디자인 라이브러리 ─────────────────────────────────────
// 주문 이미지를 자수 파일로 변환·디자인한 결과를 버전별로 보관하고 재주문에서 다시 쓴다.
// 버전은 덮어쓰지 않으며 확정(디자인 중 → 확정)된 버전은 수정할 수 없다. 컬러는 자수사 번호(재고관리의 자수사 물품 옵션).
const DS_BADGE = { 확정: 'b-good', '디자인 중': 'b-warn', 삭제됨: 'b-bad' }
const fileUrl = (p) => `/api/files/${String(p).split('/').map(encodeURIComponent).join('/')}`
const fmtSize = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`)

// ── 작업배정 — 7일 생산 계획. 자동 배정안을 만들고(자수기·순서·수량 분할), 수동으로 고치며 지표를 비교한 뒤 확정한다. ──
//   서버가 시간 계산(근무시간·작업자 1명·실 교체·수모 교체)을 하고, 이 화면은 결과를 간트로 보여 주며 변경 요청을 보낸다.
const PLAN = { sc: null, win: 0, hl: null, zoom: 0, mode: 'gantt', day: 0 }       // mode: 'gantt'(7일 간트) | 'day'(일별 — 자수기 카드)
const kst = (ms) => new Date(ms + 9 * 3600e3).toISOString()
const fmtT = (ms) => (ms == null ? '-' : `${Number(kst(ms).slice(5, 7))}/${Number(kst(ms).slice(8, 10))} ${kst(ms).slice(11, 16)}`)
const fmtDur = (ms) => { const m = Math.round(ms / 60e3); return m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}` : `${m}분` }
const fmtSec = (s) => `${Math.floor(s / 60)}분${Math.round(s % 60) ? ` ${Math.round(s % 60)}초` : ''}`
const hueOf = (s) => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h }
const SRC = { actual: '실측', standard: '표준', stitches: '스티치 추정', default: '기본값' }

async function viewAssign() {
  const canW = me.can.includes('orders') || me.can.includes('work')
  $('#main').innerHTML = `<div class="plan">
    <div class="table-card plan-bar">
      <label class="plan-start" title="계획 만들기는 이 날짜부터 배정합니다">시작일<input type="date" id="p_start"></label>
      <span class="sch-nav"><button id="p_prev" title="이전 기간">‹</button><button id="p_today">처음</button><button id="p_next" title="다음 기간">›</button></span>
      <span class="sch-label" id="p_label" style="font-size:14px"></span>
      <span class="plan-stale" id="p_stale"></span>
      <span style="flex:1"></span>
      <button class="btn btn-ghost" id="p_mode" type="button" title="일별 보기 — 하루씩 넘기며 자수기마다 그날 작업을 봅니다">일별</button>
      <button class="btn btn-ghost" id="p_zoom" type="button" title="가로 확대/축소">확대</button>
      ${canW ? '<button class="btn btn-ghost" id="p_opt" type="button" title="지금 배정에서 더 좋은 배정을 찾습니다 (잠긴 작업은 그대로)">자동 개선</button><button class="btn btn-ghost" id="p_new" type="button" title="지금의 주문·자수기 상태로 자동 배정안을 새로 만듭니다">계획 만들기</button><button class="btn btn-primary" id="p_ok" type="button">확정</button>' : ''}
    </div>
    <div class="plan-metrics" id="p_metrics"></div>
    <div class="plan-body">
      <aside class="table-card plan-orders"><div class="table-tools"><b style="font-size:13px">주문 · 예상 완료</b><span class="field-hint" id="p_ocnt"></span></div><div class="plan-olist" id="p_olist"></div></aside>
      <section class="table-card plan-gantt"><div class="plan-gscroll" id="p_gantt"></div></section>
    </div></div>`

  const sc = () => PLAN.sc
  const busy = (on, label) => { document.querySelectorAll('#p_opt,#p_new,#p_ok').forEach((b) => { b.disabled = on }); if (label) $('#p_label').textContent = label }

  // ── 지표 카드 (자동안과 비교) ──
  const paintMetrics = () => {
    const s = sc()
    const box = $('#p_metrics')
    if (!s) { box.innerHTML = ''; return }
    const m = s.metrics, a = s.autoMetrics
    const diff = (cur, base, unit, fmt = (v) => v, lowerBetter = true) => {
      if (!a || base == null) return ''
      const d = cur - base
      if (!d) return '<span class="pm-d">자동안과 같음</span>'
      return `<span class="pm-d ${(d < 0) === lowerBetter ? 'good' : 'bad'}">자동안 대비 ${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}${unit}</span>`
    }
    const util = s.machines.length ? s.machines.reduce((t, x) => t + x.util, 0) / s.machines.length : 0
    const cards = [
      ['납기 지연', `${m.lateOrders}건`, m.lateOrders ? `합계 ${fmtDur(m.lateMs)}` : '모두 납기 안', diff(m.lateOrders, a?.lateOrders, '건'), m.lateOrders ? 'bad' : 'good'],
      ['마지막 완료', fmtT(m.endMs), `계획 시작 ${fmtT(s.startMs)}`, diff(m.makespanMs, a?.makespanMs, '', fmtDur), ''],
      ['실 교체', `${m.threadSwaps}개`, `약 ${fmtDur(m.threadMs)} (1색 ${s.threadSec / 60}분)`, diff(m.threadSwaps, a?.threadSwaps, '개'), ''],
      ['작업자', `점유 ${fmtDur(m.workerBusyMs)}`, `자수기 대기 ${fmtDur(m.waitWorkMs)}${m.workerCount > 1 ? ` · ${m.workerCount}명` : ''}`, diff(m.waitWorkMs, a?.waitWorkMs, '', fmtDur), ''],
      ['자수기 가동률', `${Math.round(util * 100)}%`, `${s.machines.length}대 평균 · 편차 ${fmtDur(m.loadStdMs)}`, '', ''],
    ]
    if (m.unassignedCaps) cards.push(['미배정', `${m.unassignedCaps}장`, '자수기에 배정되지 않음', '', 'bad'])
    box.innerHTML = cards.map(([t, v, sub, d, cls]) => `<div class="pm ${cls}"><div class="pm-t">${t}</div><div class="pm-v">${v}</div><div class="pm-s">${sub}</div>${d}</div>`).join('')
  }

  // ── 주문 목록 ──
  const paintOrders2 = () => {
    const s = sc()
    const box = $('#p_olist')
    if (!s) { box.innerHTML = ''; return }
    $('#p_ocnt').textContent = `${s.orders.length}건`
    const w = s.warnings || {}
    const skipped = [w.outOfRange ? `납기가 참고 기간 밖 ${w.outOfRange}건` : '', w.noDue ? `납기 없음·미배정 ${w.noDue}건` : ''].filter(Boolean).join(' · ')
    box.innerHTML = s.orders.map((o) => `<div class="po ${o.lateMs ? 'late' : ''} ${PLAN.hl === o.id ? 'on' : ''}" data-poid="${o.id}">
        ${canW ? `<div class="po-prio" title="priority 0~9 — 숫자가 큰 주문부터 배정합니다 (자동 개선·계획 만들기에 반영)"><span>priority</span><button type="button" data-pdec="${o.id}">−</button><input type="number" min="0" max="9" step="1" data-prio="${o.id}" value="${o.priority || 0}"><button type="button" data-pinc="${o.id}">+</button></div>` : (o.priority > 0 ? `<span class="po-prio on">priority ${o.priority}</span>` : '')}
        <div><b>#${o.orderNo}</b> ${esc(o.title)}<span class="so-q" style="float:right" title="${o.done ? `전체 ${o.total}장 중 완료 ${o.done}장 · 남은 ${o.total - o.done}장` : ''}">${o.done ? `${Math.max(0, o.total - o.done)}/${o.done}` : `${o.remaining}장`}</span></div>
        <div class="po-s">${o.dueMs ? `납기 ${o.dueAt ? new Date(o.dueAt).toISOString().slice(5, 10).replace('-', '/') : ''} · 자수 목표 ${fmtT(o.dueMs)}` : '납기 없음'}</div>
        <div class="po-s ${o.lateMs ? 'late-txt' : ''}">${o.endMs ? `예상 완료 ${fmtT(o.endMs)}${o.lateMs ? ` · ⚠ ${fmtDur(o.lateMs)} 지연` : ''}` : '<span class="late-txt">배정되지 않음</span>'}${o.noDesign ? ' · 디자인 미연결' : ''}</div></div>`).join('')
      + (skipped ? `<div class="field-hint" style="padding:8px">제외: ${skipped}</div>` : '')
    box.querySelectorAll('[data-poid]').forEach((el) => { el.onclick = () => { PLAN.hl = PLAN.hl === el.dataset.poid ? null : el.dataset.poid; paintOrders2(); paintGantt() } })
    box.querySelectorAll('.po-prio').forEach((l) => l.addEventListener('click', (ev) => ev.stopPropagation()))
    const clampP = (v) => Math.max(0, Math.min(9, Math.round(Number(v) || 0)))
    box.querySelectorAll('[data-prio]').forEach((inp) => { inp.onchange = () => setPrio(inp.dataset.prio, clampP(inp.value)) })
    box.querySelectorAll('[data-pinc]').forEach((b) => { b.onclick = () => { const inp = box.querySelector(`[data-prio="${b.dataset.pinc}"]`); setPrio(b.dataset.pinc, clampP(Number(inp.value) + 1)) } })
    box.querySelectorAll('[data-pdec]').forEach((b) => { b.onclick = () => { const inp = box.querySelector(`[data-prio="${b.dataset.pdec}"]`); setPrio(b.dataset.pdec, clampP(Number(inp.value) - 1)) } })
  }

  // ── 간트: 열 = 날짜(근무 시간 구간), 행 = 자수기 + 작업자 ──
  const paintGantt = () => {
    const s = sc()
    const box = $('#p_gantt')
    if (!s) {
      box.innerHTML = `<div class="sch-hint" style="padding:40px">${canW ? '<b>계획 만들기</b>를 누르면 지금의 주문·자수기·작업자 상태로 자동 배정안을 만듭니다.<br>그 뒤 작업 블록을 눌러 자수기·순서·수량을 바꾸고, 지표를 비교한 뒤 확정하세요.' : '만들어진 생산 계획이 없습니다.'}</div>`
      return
    }
    if (PLAN.mode === 'day') return paintDay()
    const hz = Number(s.cfg.horizonDays) || 7
    const days = s.axis.slice(PLAN.win * 7, PLAN.win * 7 + 7)
    if (!days.length) { PLAN.win = 0; return paintGantt() }
    const workMin = (days.find((d) => d.work) ? (days.find((d) => d.work).e - days.find((d) => d.work).s) : 540e3 * 60) / 60e3
    const avail = Math.max(600, box.clientWidth - 130)
    const nWork = days.filter((d) => d.work).length || 1
    const ppm = PLAN.zoom ? 1.1 : Math.max(0.25, (avail - (days.length - nWork) * 26) / (nWork * workMin))
    const dayW = (d) => (d.work ? Math.round(workMin * ppm) : 26)
    const xs = []
    let acc = 0
    days.forEach((d) => { xs.push(acc); acc += dayW(d) })
    const total = acc
    // 구간 [a,b] 를 날짜 열에 맞춰 조각낸다 (밤·주말 구간은 건너뜀)
    const pieces = (a, b) => {
      const out = []
      days.forEach((d, i) => {
        if (!d.work) return
        const lo = Math.max(a, d.s), hi = Math.min(b, d.e)
        if (hi > lo) out.push({ x: xs[i] + ((lo - d.s) / 60e3) * ppm, w: Math.max(2, ((hi - lo) / 60e3) * ppm) })
      })
      return out
    }
    $('#p_label').textContent = `${days[0].date.slice(5).replace('-', '/')} ~ ${days[days.length - 1].date.slice(5).replace('-', '/')}`
    const head = `<div class="pg-row pg-head"><div class="pg-name">자수기</div><div class="pg-track" style="width:${total}px">${days.map((d, i) => `<div class="pg-day ${d.work ? '' : 'off'}" style="left:${xs[i]}px;width:${dayW(d)}px">${d.work ? `${Number(d.date.slice(5, 7))}/${Number(d.date.slice(8))} (${'일월화수목금토'[new Date(`${d.date}T12:00`).getDay()]})` : '휴'}</div>`).join('')}</div></div>`
    // 점심 구간(근무 달력상 비는 곳)
    const lunch = days.map((d, i) => (d.work ? `<div class="pg-lunch" style="left:${xs[i] + ((d.lunchS - d.s) / 60e3) * ppm}px;width:${((d.lunchE - d.lunchS) / 60e3) * ppm}px"></div>` : '')).join('')
    const mrow = (m) => {
      const jobs = s.jobs.filter((j) => j.machineId === m.id).sort((p, q) => p.seq - q.seq)
      const bars = jobs.flatMap((j) => {
        if (j.startMs == null) return []
        const hue = hueOf(j.designCode || j.orderNo)
        const dim = PLAN.hl && PLAN.hl !== j.orderId ? 'dim' : ''
        return pieces(j.startMs, j.endMs).map((p, k) => `<div class="pg-job ${j.locked ? 'locked' : ''} ${dim}" data-job="${j.id}" style="left:${p.x}px;width:${p.w}px;background:hsl(${hue} 55% 80%);border-color:hsl(${hue} 45% 55%)"
          title="${esc(`#${j.orderNo} ${j.title}\n${j.designName || j.designCode} ${j.setName || ''}\n${j.count}장 · ${fmtT(j.startMs)} ~ ${fmtT(j.endMs)}\n실 교체 ${j.swaps}개${j.locked ? '\n🔒 잠금' : ''}`)}">${k === 0 ? `<span>${j.locked ? '🔒' : ''}#${j.orderNo} ×${j.count}</span>` : ''}</div>`)
      })
      const marks = m.segs.filter((x) => x.t !== 'run').flatMap((x) => pieces(x.s, x.e).map((p) => `<div class="pg-${x.t}" style="left:${p.x}px;width:${p.w}px"></div>`))
      return `<div class="pg-row"><div class="pg-name" title="${esc(m.needles.map((x) => x || '-').join(' '))}"><b>${esc(m.name)}</b><small>${Math.round(m.util * 100)}% · 교체 ${m.swaps}</small></div><div class="pg-track" style="width:${total}px">${lunch}${bars.join('')}${marks.join('')}</div></div>`
    }
    const unJobs = s.jobs.filter((j) => !j.machineId)
    const un = unJobs.length ? `<div class="pg-un"><b>미배정</b> ${unJobs.map((j) => `<span class="pg-chip" data-job="${j.id}">#${j.orderNo} ×${j.count}</span>`).join('')}</div>` : ''
    const wrow = `<div class="pg-row"><div class="pg-name"><b>작업자</b><small>${s.cfg.workers}명</small></div><div class="pg-track" style="width:${total}px">${lunch}${s.workerSegs.flatMap((L, wi) => L.flatMap((x) => pieces(x.s, x.e).map((p) => `<div class="pg-wk" style="left:${p.x}px;width:${p.w}px;top:${wi * 12 + 6}px"></div>`))).join('')}</div></div>`
    box.innerHTML = `${un}<div style="min-width:${total + 120}px">${head}${s.machines.map(mrow).join('')}${wrow}</div>
      <div class="pg-legend"><span><i class="k job"></i>자수 작업</span><span><i class="k th"></i>실 교체</span><span><i class="k wt"></i>작업자 대기</span><span><i class="k lk"></i>🔒 잠금</span><span class="field-hint">블록을 누르면 자수기·순서·수량을 바꿀 수 있습니다</span></div>`
    box.querySelectorAll('[data-job]').forEach((el) => { el.onclick = () => openJob(el.dataset.job) })
  }

  // ── 일별 보기: 하루씩 넘기며, 자수기 카드(한 줄에 6개) 안에 그날 작업을 위에서 아래로 ──
  const paintDay = () => {
    const s = sc()
    const box = $('#p_gantt')
    PLAN.day = Math.max(0, Math.min(PLAN.day, s.axis.length - 1))
    const d = s.axis[PLAN.day]
    const dow = '일월화수목금토'[new Date(`${d.date}T12:00`).getDay()]
    $('#p_label').textContent = `${Number(d.date.slice(5, 7))}월 ${Number(d.date.slice(8))}일 (${dow})${d.work ? '' : ' · 휴무'}`
    const hm = (ms) => kst(ms).slice(11, 16)
    const todays = (j) => j.capDays?.[d.date] || 0
    const un = s.jobs.filter((j) => !j.machineId)
    const unHtml = un.length ? `<div class="pg-un" style="grid-column:1/-1"><b>미배정</b> ${un.map((j) => `<span class="pg-chip" data-job="${j.id}">#${j.orderNo} ×${j.count}</span>`).join('')}</div>` : ''
    const cards = s.machines.map((m, mi) => {
      const lim = s.cap ? ((s.cap.overrides?.[d.date] ?? s.cap.machines) > mi ? s.cap.perMachine : 0) : null          // 이 자수기의 이 날 작업 수량 한도(장)
      const mine = s.jobs.filter((j) => j.machineId === m.id && todays(j) > 0).sort((a, b) => a.seq - b.seq)
      const caps = mine.reduce((t, j) => t + todays(j), 0)
      const items = mine.map((j) => {
        const hue = hueOf(j.designCode || j.orderNo)
        const from = Math.max(j.startMs, d.s), to = Math.min(j.endMs, d.e + 24 * 3600e3)
        const dim = PLAN.hl && PLAN.hl !== j.orderId ? 'dim' : ''
        const startsToday = j.startMs >= d.s - 1 && j.startMs < d.e + 1
        return `<div class="pd-job ${j.locked ? 'locked' : ''} ${dim}" data-job="${j.id}" style="border-left-color:hsl(${hue} 50% 55%);background:hsl(${hue} 55% 94%)">
          <div class="pd-t"><b>${hm(from)}</b>${j.endMs > d.e + 60e3 ? ' ~ 이어서' : ` ~ ${hm(to)}`}</div>
          <div><b>#${j.orderNo}</b> ${esc(j.title)}</div>
          <div class="po-s">${esc(j.designName || j.designCode || '')}${j.setName ? ` · ${esc(j.setName)}` : ''}${j.initialColor ? ` · 이니셜 ${esc(j.initialColor)}` : ''}</div>
          <div class="po-s"><b>${todays(j)}장</b>${todays(j) !== j.count ? ` / 전체 ${j.count}장` : ''}${j.locked ? ' 🔒' : ''}${startsToday && j.swaps ? ` <span class="mchip warn">실 교체 ${j.swaps}</span>` : ''}</div>
          ${todays(j) < j.count ? `<div class="po-s">나머지 ${j.count - todays(j)}장: ${Object.entries(j.capDays).filter(([dt]) => dt !== d.date).sort().map(([dt, n]) => `${Number(dt.slice(5, 7))}/${Number(dt.slice(8))} ${n}장`).join(' · ')}</div>` : ''}
          <div class="pd-th">${j.threads.slice(0, 9).map((x) => thColorImg(x)).join('')}</div></div>`
      }).join('')
      return `<div class="pd-card"><div class="asg-h"><b>${esc(m.name)}</b><span class="asg-load ${lim != null && caps > lim ? 'over' : ''}" title="자수기 1대 하루 작업 수량 한도 ${lim ?? '-'}장">${caps ? `${caps}${lim != null ? `/${lim}` : ''}장 · ${mine.length}건` : (lim === 0 ? '쉬는 날' : lim != null ? `한도 ${lim}장` : '작업 없음')}</span></div>${items || '<div class="field-hint" style="padding:6px 2px">이 날 작업이 없습니다</div>'}</div>`
    }).join('')
    box.innerHTML = `<div class="pd-grid">${d.work ? '' : '<div class="field-hint" style="grid-column:1/-1">휴무일입니다. (근무 요일은 설정 > 생산 계획에서 바꿉니다)</div>'}${unHtml}${cards}</div>`
    box.querySelectorAll('[data-job]').forEach((el) => { el.onclick = () => openJob(el.dataset.job) })
  }

  // ── 작업 블록 상세 (자수기 이동 · 순서 · 분할 · 잠금) ──
  const openJob = (id) => {
    const s = sc()
    const j = s.jobs.find((x) => x.id === id)
    if (!j) return
    const mine = s.jobs.filter((x) => x.machineId === j.machineId && x.machineId).sort((a, b) => a.seq - b.seq)
    const pos = mine.findIndex((x) => x.id === id)
    const ed = canW && s.status === 'draft'
    const mach = s.machines.find((m) => m.id === j.machineId)
    const mopts = (sel) => `<option value="">(미배정)</option>${s.machines.map((m) => `<option value="${m.id}" ${m.id === sel ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}`
    const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${j.orderNo}</b> ${esc(j.title)}</div>
      ${fieldHtml('디자인 · 세트', `<div>${esc(j.designName || j.designCode || '(디자인 없음)')}${j.setName ? ` · ${esc(j.setName)}` : ''}</div>`)}
      ${fieldHtml('이니셜색상', `<div>${esc(j.initialColor || '-')}</div>`)}
      ${fieldHtml('수량', `<div><b>${j.count}장</b></div>`)}
      ${fieldHtml('수모 1개 자수 시간', `<div>${fmtSec(j.secPerCap)} <span class="mchip">${SRC[j.source] || '-'}</span></div>`)}
      ${fieldHtml('예상 시간', `<div>${fmtT(j.startMs)} ~ ${fmtT(j.endMs)}${j.waitMs > 120e3 ? `<br><span class="field-hint">작업자 대기 ${fmtDur(j.waitMs)} 포함</span>` : ''}</div>`)}
      ${fieldHtml('실 교체', `<div>${j.swaps}개${j.swaps ? ` (약 ${fmtDur(j.swaps * s.threadSec * 1000)})` : ''}</div>`)}
      <div class="field full"><span class="field-label">필요한 실 ${j.threads.length}개${j.threads.length > 7 ? ' — ⚠ 7개를 넘어 작업 중 추가 교체가 필요합니다' : ''}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${j.threads.map((t) => `<span style="display:inline-flex;align-items:center;gap:4px">${thColorImg(t)}<span class="mono">${esc(t)}</span></span>`).join('') || '<span class="field-hint">지정된 실 없음</span>'}</div>
        ${mach ? `<span class="field-hint">${esc(mach.name)}의 현재 침: ${mach.needles.map((x) => esc(x || '-')).join(' ')}</span>` : ''}</div>
      ${ed ? `<div class="field full" style="border-top:1px solid var(--line);padding-top:12px"><span class="field-label">자수기 · 순서</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select class="field-input" id="j_m" style="width:auto" ${j.locked ? 'disabled' : ''}>${mopts(j.machineId)}</select>
          <button type="button" class="btn btn-primary" id="j_move" ${j.locked ? 'disabled' : ''}>이동</button>
          ${j.machineId ? `<button type="button" class="btn btn-ghost" id="j_up" ${pos <= 0 || j.locked ? 'disabled' : ''}>앞으로 ↑</button><button type="button" class="btn btn-ghost" id="j_dn" ${pos >= mine.length - 1 || j.locked ? 'disabled' : ''}>뒤로 ↓</button>` : ''}</div>
        <span class="field-hint">${j.machineId ? `이 자수기의 ${pos + 1}/${mine.length}번째 작업` : '자수기에 배정되지 않았습니다'}</span></div>
        ${j.count > 1 ? `<div class="field full"><span class="field-label">수량 나누기 — 일부를 다른 자수기에서 (합계는 그대로)</span>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="field-input" id="j_n" type="number" min="1" max="${j.count - 1}" placeholder="나눌 수량(1~${j.count - 1})" style="width:150px" ${j.locked ? 'disabled' : ''}>
            <select class="field-input" id="j_sm" style="width:auto" ${j.locked ? 'disabled' : ''}>${mopts(j.machineId)}</select><button type="button" class="btn btn-ghost" id="j_split" ${j.locked ? 'disabled' : ''}>나누기</button></div></div>` : ''}
        ${j.fixed ? '' : `<label class="c-opt field full" style="padding:0"><input type="checkbox" id="j_lock" ${j.locked ? 'checked' : ''}> 잠금 — 자동 개선이 이 작업을 옮기거나 나누지 않습니다 (확정하면 작업배정에도 잠금으로 남습니다)</label>`}` : '<div class="drawer-note" style="grid-column:1/-1">확정된 계획은 바꿀 수 없습니다. 새 계획을 만드세요.</div>'}`
    const dlg = shell(`작업 · #${j.orderNo} ×${j.count}`, body, closeFoot(ed ? '' : ''))
    const send = async (ops) => {
      try { PLAN.sc = await api(`/production/scenarios/${s._id}/jobs`, { method: 'PATCH', body: { ops } }); dlg.close(); repaint() } catch (e) { setErr(e.message) }
    }
    $('#j_move')?.addEventListener('click', () => send([{ op: 'move', jobId: id, machineId: $('#j_m').value }]))
    $('#j_up')?.addEventListener('click', () => send([{ op: 'move', jobId: id, machineId: j.machineId, index: pos - 1 }]))
    $('#j_dn')?.addEventListener('click', () => send([{ op: 'move', jobId: id, machineId: j.machineId, index: pos + 1 }]))
    $('#j_split')?.addEventListener('click', () => send([{ op: 'split', jobId: id, count: Number($('#j_n').value), machineId: $('#j_sm').value }]))
    $('#j_lock')?.addEventListener('change', () => send([{ op: 'lock', jobId: id, locked: $('#j_lock').checked }]))
  }

  // 우선 지정 — 주문의 우선순위를 바꾸고 계획에 반영(이미 짠 배정은 그대로, 다음 자동 개선·계획 만들기에서 먼저 배정)
  const setPrio = async (id, priority) => {
    try {
      PLAN.sc = await api('/production/priority', { method: 'POST', body: { id, priority, scenarioId: sc()._id } })
      repaint()
      $('#p_stale').textContent = sc().status === 'draft' ? 'priority가 바뀌었습니다 — "자동 개선"(또는 계획 만들기)을 누르면 숫자가 큰 주문부터 배정합니다' : 'priority가 바뀌었습니다 — "계획 만들기"를 누르면 숫자가 큰 주문부터 배정합니다'
      $('#p_stale').className = 'plan-stale warn'
    } catch (e) { alert(e.message); repaint() }
  }
  const repaint = () => {
    const s = sc()
    if (s && s.startMs && document.activeElement !== $('#p_start')) $('#p_start').value = kst(s.startMs).slice(0, 10)          // 만들어 둔 계획의 시작일
    $('#p_stale').textContent = s ? (s.status === 'confirmed' ? `확정됨 (${fmtT(new Date(s.confirmedAt).getTime())})` : s.stale ? '⚠ 계획을 만든 뒤 작업배정이 바뀌었습니다 — 계획 만들기로 다시 계산하세요' : '초안 — 확정 전에는 실제 작업배정이 바뀌지 않습니다') : ''
    $('#p_stale').className = `plan-stale ${s && (s.stale ? 'warn' : s.status === 'confirmed' ? 'ok' : '')}`
    const ok = $('#p_ok'); if (ok) ok.disabled = !s || s.status !== 'draft'
    const op = $('#p_opt'); if (op) op.disabled = !s || s.status !== 'draft'
    paintMetrics(); paintOrders2(); paintGantt()
  }
  const run = async (label, fn) => {
    busy(true, label)
    try { PLAN.sc = await fn(); PLAN.win = 0; repaint() } catch (e) { alert(e.message); repaint() } finally { busy(false); repaint() }
  }
  $('#p_prev').onclick = () => { if (PLAN.mode === 'day') PLAN.day = Math.max(0, PLAN.day - 1); else PLAN.win = Math.max(0, PLAN.win - 1); paintGantt() }
  $('#p_next').onclick = () => {
    const s = sc()
    if (!s) return
    if (PLAN.mode === 'day') PLAN.day = Math.min(s.axis.length - 1, PLAN.day + 1)
    else if ((PLAN.win + 1) * 7 < s.axis.length) PLAN.win++
    paintGantt()
  }
  $('#p_today').onclick = () => { PLAN.win = 0; PLAN.day = 0; paintGantt() }
  const modeUi = () => {
    $('#p_mode').textContent = PLAN.mode === 'day' ? '간트' : '일별'
    $('#p_mode').title = PLAN.mode === 'day' ? '7일 간트로 돌아갑니다' : '일별 보기 — 하루씩 넘기며 자수기마다 그날 작업을 봅니다'
    $('#p_zoom').style.display = PLAN.mode === 'day' ? 'none' : ''
    $('#p_prev').title = PLAN.mode === 'day' ? '전날' : '이전 기간'; $('#p_next').title = PLAN.mode === 'day' ? '다음날' : '다음 기간'
    $('#p_today').textContent = '처음'
  }
  $('#p_mode').onclick = () => { PLAN.mode = PLAN.mode === 'day' ? 'gantt' : 'day'; if (PLAN.mode === 'day') PLAN.day = Math.min(PLAN.win * 7, (sc()?.axis.length || 1) - 1); else PLAN.win = Math.floor(PLAN.day / 7); modeUi(); paintGantt() }
  $('#p_zoom').onclick = () => { PLAN.zoom = PLAN.zoom ? 0 : 1; $('#p_zoom').textContent = PLAN.zoom ? '맞춤' : '확대'; paintGantt() }
  $('#p_new')?.addEventListener('click', () => {
    if (sc()?.status === 'draft' && !confirm('지금의 초안을 버리고 새로 계산할까요? (수동으로 바꾼 내용은 사라집니다)')) return
    run('계산 중…', () => api('/production/scenarios', { method: 'POST', body: { startDate: $('#p_start').value || undefined } }))
  })
  $('#p_opt')?.addEventListener('click', () => run('개선하는 중…', () => api(`/production/scenarios/${sc()._id}/optimize`, { method: 'POST', body: {} })))
  $('#p_ok')?.addEventListener('click', async () => {
    const s = sc()
    if (!s || !confirm(`이 계획을 확정할까요?\n계획에 포함된 주문의 '지시' 배정이 새 배정(${s.jobs.filter((j) => j.machineId && !j.fixed).length}건 작업)으로 바뀌고 작업현황·작업지시서에 반영됩니다.${s.metrics.unassignedCaps ? `\n⚠ 자수기에 배정되지 않은 ${s.metrics.unassignedCaps}장은 배정이 빠집니다.` : ''}`)) return
    busy(true, '확정하는 중…')
    try {
      const r = await api(`/production/scenarios/${s._id}/confirm`, { method: 'POST', body: {} })
      PLAN.sc = await api(`/production/scenarios/${s._id}`)
      alert(`확정했습니다. 작업배정 ${r.entries}건이 만들어졌습니다.`)
    } catch (e) { alert(e.message) } finally { busy(false); repaint() }
  })
  window.addEventListener('resize', () => { if ($('#p_gantt')) paintGantt() }, { once: true })
  try { PLAN.sc = await api('/production/scenarios/latest') } catch (e) { alert(e.message) }
  $('#p_start').min = ymd(new Date())
  $('#p_start').value = ymd(new Date())
  modeUi()
  repaint()
}

// ── 자수기 — 이름과 침 1~7 에 현재 걸린 실. 작업을 시작·완료하면 자동으로 갱신되고, 실을 직접 바꿨다면 여기서 고친다. ──
async function viewMachines() {
  const canW = me.can.includes('work') || me.can.includes('settings')
  pageShell({
    en: 'Embroidery Machines', title: '자수기', addLabel: canW ? '자수기 추가' : '',
    tools: `<span class="field-hint">실 교체 시간</span><input id="mc_swap" class="table-search" style="width:70px;max-width:70px" type="number" min="1" step="0.5"><span class="field-hint">분 / 실 1개</span>
      ${canW ? '<button class="btn btn-ghost" id="mc_swap_save" type="button">저장</button>' : ''}`,
  })
  let list = []
  const needleCell = (m, i) => { const v = m.needles?.[i] || ''; return `<td class="mcn"><div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><input class="cmx-in num" style="width:62px" data-mn="${i}" value="${esc(v)}" placeholder="-" inputmode="numeric" ${canW ? '' : 'disabled'}><span data-mw="${i}" style="width:30px;height:30px;flex:none">${/^\d+$/.test(v) ? thColorImg(v) : ''}</span></div></td>` }
  const paint = () => {
    if (!list.length) {
      $('#tbl').innerHTML = `<div class="sch-hint" style="padding:30px">등록된 자수기가 없습니다.${canW ? '<br><br><button class="btn btn-primary" id="mc_bulk" type="button">8대 한 번에 만들기</button> <span class="field-hint">또는 오른쪽 위 "자수기 추가"</span>' : ''}</div>`
      $('#mc_bulk')?.addEventListener('click', async () => { try { await api('/machines/bulk', { method: 'POST', body: { count: 8 } }); load() } catch (e) { alert(e.message) } })
      $('#ft').textContent = ''
      return
    }
    $('#tbl').innerHTML = `<table class="data mc-table"><thead><tr><th>자수기</th>${[1, 2, 3, 4, 5, 6, 7].map((n) => `<th class="num">침 ${n}</th>`).join('')}<th>사용</th><th>최근 작업</th><th></th></tr></thead><tbody>${
      list.map((m) => `<tr data-id="${m._id}"><td><input class="field-input" style="width:120px;padding:6px 8px" data-mname value="${esc(m.name)}" ${canW ? '' : 'disabled'}></td>${
        [0, 1, 2, 3, 4, 5, 6].map((i) => needleCell(m, i)).join('')}<td><input type="checkbox" data-mact ${m.active !== false ? 'checked' : ''} ${canW ? '' : 'disabled'}></td>
        <td class="field-hint">${m.lastJob ? `#${esc(m.lastJob.orderNo)} ${esc(m.lastJob.task || '')} · 교체 ${m.lastJob.swaps}개 · ${esc(day(m.lastJob.at))}` : ''}</td>
        <td>${canW ? '<button class="btn btn-primary" data-msave type="button" style="padding:4px 12px">저장</button> <button class="tb-logout" data-mdel type="button">삭제</button>' : ''}</td></tr>`).join('')}</tbody></table>`
    $('#ft').textContent = `${list.length}대 · 사용 ${list.filter((m) => m.active !== false).length}대`
    $('#tbl').querySelectorAll('tr[data-id]').forEach((tr) => {
      const m = list.find((x) => x._id === tr.dataset.id)
      tr.querySelectorAll('[data-mn]').forEach((el) => {
        el.oninput = () => { const w = tr.querySelector(`[data-mw="${el.dataset.mn}"]`); if (w) w.innerHTML = /^\d+$/.test(el.value.trim()) ? thColorImg(el.value.trim()) : '' }
      })
      tr.querySelector('[data-msave]')?.addEventListener('click', async () => {
        try {
          await api(`/machines/${m._id}`, { method: 'PATCH', body: {
            name: tr.querySelector('[data-mname]').value, active: tr.querySelector('[data-mact]').checked,
            needles: [...tr.querySelectorAll('[data-mn]')].map((x) => x.value.trim()),
          } })
          load()
        } catch (e) { alert(e.message) }
      })
      tr.querySelector('[data-mdel]')?.addEventListener('click', async () => {
        if (!confirm(`${m.name}을(를) 삭제할까요? 이 자수기에 배정된 작업은 미배정으로 돌아갑니다.`)) return
        try { await api(`/machines/${m._id}`, { method: 'DELETE' }); load() } catch (e) { alert(e.message) }
      })
    })
  }
  const load = async () => {
    try { const r = await api('/machines'); list = r.items; $('#mc_swap').value = r.swapMinutes; paint() } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }
  $('#add')?.addEventListener('click', async () => {
    const name = prompt('자수기 이름', `자수기 ${list.length + 1}`)
    if (!name) return
    try { await api('/machines', { method: 'POST', body: { name } }); load() } catch (e) { alert(e.message) }
  })
  $('#mc_swap_save')?.addEventListener('click', async () => {
    try { await api('/settings', { method: 'PUT', body: { swapMinutes: Number($('#mc_swap').value) } }); load() } catch (e) { alert(e.message) }
  })
  load()
}

// ── 디자인 매핑 — 주문 → 디자인 (주문마다 쓸 디자인을 연결한다. 컬러 설정은 '디자인 · 컬러') ──
async function viewDesignMap() {
  const canAct = me.can.includes('design') || me.can.includes('orders')
  pageShell({
    en: 'Design Mapping', title: '디자인 매핑',
    tools: `<input id="q" class="table-search" placeholder="주문번호·주문명·거래처 검색…" type="search">
      <select id="f" class="table-select"><option value="need">매핑 필요</option><option value="ready">연결됨(확정)</option><option value="working">연결됨(작업 중)</option><option value="na">디자인 불필요</option><option value="">전체</option></select>`,
  })
  let all = []
  const stateOf = (o) => (o.notNeeded ? 'na' : o.designState === 'ready' ? 'ready' : o.designState === 'working' ? 'working' : 'need')
  const paint = () => {
    const q = $('#q').value.trim().toLowerCase(), f = $('#f').value
    const list = all.filter((o) => (!f || (f === 'need' ? stateOf(o) === 'need' : stateOf(o) === f))
      && (!q || o.title.toLowerCase().includes(q) || String(o.orderNo) === q || (o.partnerName || '').toLowerCase().includes(q)))
    const ST = { need: ['매핑 필요', 'b-warn'], working: ['작업 중', 'b-info'], ready: ['확정', 'b-good'], na: ['불필요', 'b-mute'] }
    paintTable(list, [
      ['no', '#', (o) => o.orderNo, 'r'],
      ['img', '받은 이미지', (o) => ((o.attachments || []).length ? `<span style="display:inline-flex;gap:4px">${o.attachments.slice(0, 3).map((p) => thumb(p)).join('')}${o.attachments.length > 3 ? `<span class="field-hint">+${o.attachments.length - 3}</span>` : ''}</span>` : '<span class="field-hint">없음</span>')],
      ['title', '주문명', (o) => `<b>${esc(o.title)}</b>`], ['partner', '거래처', (o) => esc(o.partnerName)],
      ['due', '납기', (o) => (o.dueAt ? dueCell(o) : '')], ['qty', '수량', (o) => (o.totalQty ? won(o.totalQty) : ''), 'r'],
      ['st', '매핑', (o) => badge(ST[stateOf(o)][0], ST[stateOf(o)][1])],
      ['dz', '디자인 · 세트', (o) => ((o.designUse || []).length || o.unmapped ? `${(o.designUse || []).map((u) => `<div><span class="mono">${esc(u.code)}</span> ${esc(u.name)}${u.hasSets ? ` — ${u.sets.map((s) => `${esc(s.name)} ${s.n}`).join(' · ')}` : ` ${u.sets.reduce((a, s) => a + s.n, 0)}장`}</div>`).join('')}${o.unmapped ? `<div class="late-txt">디자인 미지정 ${o.unmapped}장</div>` : ''}` : (o.designs || []).length ? o.designs.map((d) => `<span class="mono">${esc(d.code)}</span> v${d.version}${d.role ? ` ${esc(d.role)}` : ''}`).join('<br>') : (stateOf(o) === 'need' && o.candidates.length ? `<span class="field-hint">이전 디자인 ${o.candidates.length}건</span>` : ''))],
    ], (o) => openDesignAssist(o, canAct, load), f === 'need' ? '매핑이 필요한 주문이 없습니다.' : '해당하는 주문이 없습니다.')
    $('#ft').textContent = `${list.length}건 / 진행 주문 ${all.length}건`
  }
  const load = async () => {
    try { all = (await api('/schedule/design-queue?scope=all')).items; paint() } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }
  $('#q').addEventListener('input', debounce(paint))
  $('#f').onchange = paint
  load()
}

async function viewDesigns() {
  const canW = me.can.includes('design')
  pageShell({
    en: 'Designs', title: '디자인', addLabel: canW ? '디자인 등록' : '',
    tools: `<input id="q" class="table-search" placeholder="이름·코드·거래처·태그 검색…" type="search">
      <select id="f" class="table-select"><option value="">상태 전체</option><option>디자인 중</option><option>확정</option></select>`,

      const { items } = await api(`/designs?${p}`)
      paintTable(items, [
        ['img', '', (d) => thumb(d.preview)], ['code', '코드', (d) => `<span class="mono">${esc(d.code)}</span>`],
        ['name', '디자인', (d) => `<b>${esc(d.name)}</b>${d.active === false ? ` ${badge('중지', 'b-mute')}` : ''}`],
        ['partner', '거래처', (d) => esc(d.partnerName)],
        ['ver', '최신 버전', (d) => `v${d.latestVersion} ${badge(d.latestStatus, DS_BADGE[d.latestStatus] || 'b-mute')}`],
        ['col', '컬러', (d) => `${d.colorCount}색`, 'r'], ['sets', '세트', (d) => `${d.setCount || 1}개`, 'r'], ['stc', '스티치', (d) => (d.stitches ? won(d.stitches) : '-'), 'r'], ['files', '자수 파일', (d) => `${d.fileCount}개`, 'r'],
        ['upd', '수정', (d) => day(d.updatedAt)],
      ], (d) => openDesign(d._id, load), '등록된 디자인이 없습니다. "디자인 등록"으로 시작하세요.')
