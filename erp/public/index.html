// 디자인 드로어: id 가 없으면 새로 만든다. prefill: { name, partnerId } (주문 화면에서 만들 때)
// 컬러 세트 고르기 — 장의 수모 색(color)이 어느 세트의 '적용 수모'에 있으면 그 세트, 없으면 null(=기본 세트)
const capKey = (v) => { const s = String(v ?? '').trim().toLowerCase().replace(/^caps/, ''); return /^\d+$/.test(s) ? String(Number(s)) : s }
const variantFor = (variants, capColor) => (variants || []).find((x) => (x.caps || []).some((c) => capKey(c) === capKey(capColor)) && capKey(capColor) !== '') || null
const thColorImg = (no) => `<img src="/images/sewing/${encodeURIComponent(no)}.png" alt="" style="width:30px;height:30px;object-fit:cover;border-radius:4px;border:1px solid var(--line)" onerror="this.style.visibility='hidden'">`
async function openDesign(id, done, prefill = {}, onCreated) {
  const canW = me.can.includes('design'), canD = me.can.includes('delete')
  if (!cache.partners) await refs().catch(() => {})
  const partnerOpts = (cur) => `<option value="">(미지정)</option>${(cache.partners || []).map((p) => `<option value="${p._id}" ${p._id === cur ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}`

  // 새 디자인 — 이름·거래처만 받고 만들면 버전 1(디자인 중)이 생긴다. 파일은 만든 뒤 올린다.
  if (!id) {
    const body = fieldHtml('디자인 이름', `<input class="field-input" id="n_name" value="${esc(prefill.name || '')}" placeholder="예: CRS 로고">`, true)
      + fieldHtml('거래처', `<select class="field-input" id="n_partner">${partnerOpts(prefill.partnerId || '')}</select>`)
      + fieldHtml('태그 (쉼표)', '<input class="field-input" id="n_tags" placeholder="로고, 이니셜 …">')
      + '<div class="drawer-note" style="grid-column:1/-1">만든 뒤 시안 이미지·자수 파일·컬러를 올리고 확정합니다. 같은 이름의 디자인을 두 번 만들지 말고, 수정은 새 버전으로 하세요.</div>'
    const dlg = shell('디자인 등록', body, closeFoot('<button type="button" class="btn btn-primary" id="save">만들기</button>'))
    $('#save').onclick = async () => {
      try {
        const d = await api('/designs', { method: 'POST', body: { name: $('#n_name').value, partnerId: $('#n_partner').value || null, tags: textToTags($('#n_tags').value) } })
        dlg.close()
        if (onCreated) onCreated(d)
        else { done && done(); openDesign(d._id, done) }
      } catch (e) { setErr(e.message) }
    }
    return
  }

  let design = await api(`/designs/${id}`)
  const threads = (await api('/designs/thread-options').catch(() => ({ items: [], keyword: '자수사' })))
  let curNo = Math.max(...design.versions.map((v) => v.no))
  let sets = []                                   // sets[0] = 기본 세트, 이후 = 컬러 세트(배리에이션). 각 세트의 colors[i] = 침 i+1

  const ver = () => design.versions.find((v) => v.no === curNo)
  const editable = () => canW && ver().status === '디자인 중'
  const readVersionFields = () => ({
    note: $('#v_note')?.value ?? '', widthMm: $('#v_w')?.value ?? '', heightMm: $('#v_h')?.value ?? '', stitches: $('#v_s')?.value ?? '', colors: sets[0].colors, baseName: sets[0].name.trim() || '기본',
    variants: sets.slice(1).map(({ name, caps, colors: cs }) => ({ name, caps, colors: cs })),
  })

  const render = () => {
    const v = ver()
    const ed = editable()
    sets = [{ name: v.baseName || '기본', caps: [], colors: v.colors.map((c) => ({ ...c })) },
      ...(v.variants || []).map((x) => ({ name: x.name, caps: [...(x.caps || [])], colors: (x.colors || []).map((c) => ({ ...c })) }))]
    sets.forEach((s) => { while (s.colors.length < 7) s.colors.push({}) })      // 침 7칸
    const dis = ed ? '' : 'disabled'
    const body = `
      <div class="drawer-note" style="grid-column:1/-1"><b>${esc(design.code)}</b> · 버전 ${design.versions.length}개 · 사용 주문 ${design.usedBy.length ? design.usedBy.map((u) => `#${u.orderNo}(v${u.version})`).join(', ') : '없음'}</div>
      ${fieldHtml('디자인 이름', `<input class="field-input" id="d_name" value="${esc(design.name)}" ${canW ? '' : 'disabled'}>`, true)}
      ${fieldHtml('거래처', `<select class="field-input" id="d_partner" ${canW ? '' : 'disabled'}>${partnerOpts(design.partnerId ? String(design.partnerId) : '')}</select>`)}
      ${fieldHtml('태그 (쉼표)', `<input class="field-input" id="d_tags" value="${esc((design.tags || []).join(', '))}" ${canW ? '' : 'disabled'}>`)}
      ${fieldHtml('메모', `<textarea class="field-input" id="d_memo" ${canW ? '' : 'disabled'}>${esc(design.memo || '')}</textarea>`, true)}
      <div class="field full" style="border-top:1px solid var(--line);padding-top:14px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="field-label" style="margin:0">버전</span>
          <select class="field-input" id="v_sel" style="width:auto">${design.versions.slice().sort((a, b) => b.no - a.no).map((x) => `<option value="${x.no}" ${x.no === curNo ? 'selected' : ''}>v${x.no} · ${esc(x.status)}</option>`).join('')}</select>
          ${badge(v.status, DS_BADGE[v.status])}
          <span class="field-hint">${v.status === '확정' ? `확정 ${day(v.confirmedAt)} — 확정된 버전은 수정할 수 없습니다. 고치려면 새 버전을 만드세요.` : '디자인 중 — 컬러를 정하고(자수 파일은 있으면 올리고) 확정하세요.'}</span>
        </div>
      </div>
      <div class="field full"><span class="field-label">시안 이미지</span>
        <div class="img-field"><span>${thumb(v.previewImage)}</span><div class="img-side">
          ${v.previewImage ? `<a href="${esc(fileUrl(v.previewImage))}" target="_blank" rel="noopener" class="field-hint">원본 열기</a>` : ''}
          ${ed ? `<input type="file" id="up_img" accept="image/png,image/jpeg,image/webp,image/gif">${v.previewImage ? '<button type="button" class="btn btn-ghost" id="rm_img" style="align-self:flex-start">시안 제거</button>' : ''}` : ''}
        </div></div></div>
      <div class="field full"><span class="field-label">자수 파일 (.dst .pes .jef .exp .emb … · 50MB 이하)</span>
        ${(v.files || []).length ? `<div>${v.files.map((f) => `<div class="cp-row"><a href="${esc(fileUrl(f.path))}" download>${esc(f.name)}</a>
          <span class="field-hint">${esc(f.ext)} · ${fmtSize(f.size || 0)}</span><span class="sp"></span>${ed ? `<button type="button" class="tb-logout" data-rmf="${esc(f.path)}">삭제</button>` : ''}</div>`).join('')}</div>`
          : '<div class="field-hint">올린 자수 파일이 없습니다.</div>'}
        ${ed ? '<input type="file" id="up_file" style="margin-top:8px">' : ''}
      </div>
      <div class="field full"><span class="field-label">침별 컬러 — 자수사 번호 (세트별 · 위에서부터 침 1~7)</span>
        <div id="d_matrix" class="cmx-wrap"></div>
        <span class="field-hint">번호를 입력하면 컬러 이미지가 나옵니다. 세트는 "추가+"로 만들고, 적용 수모 번호에 해당하는 장에 그 세트가 쓰입니다.</span>
      </div>
      ${fieldHtml('가로(mm)', `<input class="field-input" id="v_w" type="number" min="0" step="any" value="${v.widthMm ?? ''}" ${dis}>`)}
      ${fieldHtml('세로(mm)', `<input class="field-input" id="v_h" type="number" min="0" step="any" value="${v.heightMm ?? ''}" ${dis}>`)}
      ${fieldHtml('실측 자수 시간 (분 · 수모 1개)', `<div style="display:flex;gap:8px;align-items:center"><input class="field-input" id="v_act" type="number" min="0" step="0.1" placeholder="예: 13" value="${v.production?.actualSecondsPerCap ? Math.round(v.production.actualSecondsPerCap / 6) / 10 : ''}" ${canW ? '' : 'disabled'}>${canW ? '<button type="button" class="btn btn-ghost" id="v_act_save" style="white-space:nowrap">실측 저장</button>' : ''}</div><span class="field-hint">반복·대량 주문이면 1개를 직접 자수해 보고 입력하세요. 수모 탈착·실 교체를 뺀 순수 자수 시간(이니셜 포함)이며, 입력하면 스티치 수 추정보다 우선합니다. 확정된 버전에도 입력할 수 있고, 비우면 추정으로 돌아갑니다.</span>`)}
      ${fieldHtml('스티치 수', `<input class="field-input" id="v_s" type="number" min="0" value="${v.stitches ?? ''}" ${dis}>`)}
      ${fieldHtml('버전 메모 (변경 내용 등)', `<textarea class="field-input" id="v_note" ${dis}>${esc(v.note || '')}</textarea>`, true)}`
    const latest = Math.max(...design.versions.map((x) => x.no))
    const foot = `${canD ? '<button type="button" class="btn btn-danger" id="d_del">디자인 삭제</button>' : ''}${
      canW && ver().status === '확정' && curNo === latest ? '<button type="button" class="btn btn-ghost" id="d_newver">새 버전 만들기</button>' : ''}${
      closeFoot(canW ? `<button type="button" class="btn btn-ghost" id="save">저장</button>${ed ? '<button type="button" class="btn btn-primary" id="d_confirm">확정</button>' : ''}${me.role === 'admin' && ver().status === '확정' && curNo === latest ? '<button type="button" class="btn btn-ghost" id="d_reopen" title="관리자 전용 — 수정할 수 있게 디자인 중으로 되돌립니다">디자인 중으로 변경</button>' : ''}` : '')}`
    const dlg = shell(`디자인 · ${esc(design.name)}`, body, foot)
    wire(dlg)
    paintMatrix()
  }

  // 침별 컬러 표: 열 = 컬러 세트(기본 + 배리에이션), 행 = 침 1~7. 칸마다 번호를 입력하면 컬러 이미지(sewing/번호.png)가 옆에 나온다.
  const swatch = (no) => (/^\d+$/.test(String(no || '').trim()) ? thColorImg(String(no).trim()) : '')
  const paintMatrix = () => {
    const box = $('#d_matrix')
    if (!box) return
    const ed = editable()
    const rows = Math.max(7, ...sets.map((s) => s.colors.length))
    const th = sets.map((s, si) => `<th colspan="2">${si === 0
      ? `<div class="cmx-h"><input class="cmx-in" data-sn="0" value="${esc(s.name)}" placeholder="기본" style="font-weight:700" ${ed ? '' : 'disabled'}></div>`
      : `<div class="cmx-h"><input class="cmx-in" data-sn="${si}" value="${esc(s.name)}" placeholder="세트 이름" ${ed ? '' : 'disabled'}>${ed ? `<button type="button" class="cmx-x" data-sdel="${si}" title="이 세트 삭제">×</button>` : ''}</div>`}</th>`).join('')
      + (ed && sets.length < 11 ? '<th class="cmx-add"><button type="button" class="btn btn-ghost" id="set_add" style="padding:4px 12px">추가 +</button></th>' : '')
    const caps = sets.map((s, si) => `<td colspan="2" class="cmx-caps">${si === 0
      ? '<span class="field-hint">나머지 수모 전체</span>'
      : `<input class="cmx-in" data-sc="${si}" value="${esc((s.caps || []).join(', '))}" placeholder="적용 수모 (예: 08, 12)" ${ed ? '' : 'disabled'}>`}</td>`).join('') + (ed && sets.length < 11 ? '<td></td>' : '')
    const body = Array.from({ length: rows }, (_, r) => `<tr>${sets.map((s, si) => { const c = s.colors[r] || {}; const no = c.no || c.code || ''
      return `<td class="cmx-no"><input class="cmx-in num" data-cs="${si}" data-cr="${r}" value="${esc(no)}" placeholder="${r + 1}" inputmode="numeric" ${ed ? '' : 'disabled'}></td><td class="cmx-sw" data-sw="${si}-${r}">${swatch(no)}</td>` }).join('')}${ed && sets.length < 11 ? '<td></td>' : ''}</tr>`).join('')
    box.innerHTML = `<div class="table-scroll"><table class="cmx"><thead><tr>${th}</tr><tr>${caps}</tr></thead><tbody>${body}</tbody></table></div>`
    box.querySelectorAll('[data-cs]').forEach((el) => {
      el.oninput = () => {
        const s = sets[Number(el.dataset.cs)], r = Number(el.dataset.cr), v = el.value.trim()
        if (!v) { s.colors[r] = {} } else {
          // 재고에 등록된 자수사면 그 옵션과 연결한다 (번호가 같은 옵션이 하나일 때). 없어도 번호만으로 지정된다.
          const hits = threads.items.filter((x) => String(x.no || x.code) === v || x.code === v)
          s.colors[r] = { ...(s.colors[r] || {}), code: hits.length === 1 ? hits[0].code : '', no: v, label: `${hits[0]?.name || threads.keyword} ${v}` }
        }
        const sw = box.querySelector(`[data-sw="${el.dataset.cs}-${r}"]`)
        if (sw) sw.innerHTML = swatch(v)
      }
    })
    box.querySelectorAll('[data-sn]').forEach((el) => { el.oninput = () => { sets[Number(el.dataset.sn)].name = el.value.trim() } })
    box.querySelectorAll('[data-sc]').forEach((el) => { el.oninput = () => { sets[Number(el.dataset.sc)].caps = el.value.split(/[,\s]+/).map((x) => x.trim()).filter(Boolean) } })
    box.querySelectorAll('[data-sdel]').forEach((b) => {
      b.onclick = () => {
        const si = Number(b.dataset.sdel)
        if (!confirm(`컬러 세트 "${sets[si].name}"을(를) 삭제할까요?`)) return
        sets.splice(si, 1); paintMatrix()
      }
    })
    $('#set_add')?.addEventListener('click', () => {
      // 마지막 세트의 컬러를 복사해서 시작 — 달라지는 침만 고치면 된다
      const last = sets[sets.length - 1]
      sets.push({ name: `세트${sets.length}`, caps: [], colors: last.colors.map((c) => ({ ...c })) })
      paintMatrix()
    })
  }

  const reload = async (keepNo) => {
    design = await api(`/designs/${id}`)
    if (keepNo) curNo = keepNo
    render()
  }
  const saveAll = async () => {
    await api(`/designs/${id}`, { method: 'PATCH', body: { name: $('#d_name').value, partnerId: $('#d_partner').value || null, tags: textToTags($('#d_tags').value), memo: $('#d_memo').value } })
    if (editable()) await api(`/designs/${id}/versions/${curNo}`, { method: 'PATCH', body: readVersionFields() })
  }
  const upload = async (inputEl) => {
    const f = inputEl.files[0]
    if (!f) return
    setErr('')
    try {
      await saveAll()                                              // 입력 중이던 컬러·메모를 잃지 않게 먼저 저장
      const fd = new FormData(); fd.append('file', f)
      const r = await fetch(`/api/designs/${id}/versions/${curNo}/files`, { method: 'POST', body: fd, credentials: 'same-origin' })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(j.error || r.statusText)
      await reload(curNo)
    } catch (e) { setErr(e.message); inputEl.value = '' }
  }

  const wire = (dlg) => {
    $('#v_sel').onchange = async () => { if (editable()) { try { await saveAll() } catch (e) { return setErr(e.message) } } await reload(Number($('#v_sel').value)) }
    $('#up_img')?.addEventListener('change', (e) => upload(e.target))
    $('#up_file')?.addEventListener('change', (e) => upload(e.target))
    $('#rm_img')?.addEventListener('click', async () => {
      try { await api(`/designs/${id}/versions/${curNo}/files?path=${encodeURIComponent(ver().previewImage)}`, { method: 'DELETE' }); await reload(curNo) } catch (e) { setErr(e.message) }
    })
    dlg.querySelectorAll('[data-rmf]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('이 파일을 지울까요?')) return
      try { await api(`/designs/${id}/versions/${curNo}/files?path=${encodeURIComponent(b.dataset.rmf)}`, { method: 'DELETE' }); await reload(curNo) } catch (e) { setErr(e.message) }
    }))
    $('#save')?.addEventListener('click', async () => {
      try { await saveAll(); await reload(curNo); done && done() } catch (e) { setErr(e.message) }
    })
    $('#d_confirm')?.addEventListener('click', async () => {
      try { await saveAll(); await api(`/designs/${id}/versions/${curNo}/confirm`, { method: 'POST' }); await reload(curNo); done && done() } catch (e) { setErr(e.message); alert(`확정하지 못했습니다.
${e.message}`) }
    })
    $('#v_act_save')?.addEventListener('click', async () => {
      try {
        await saveAll()                                   // 입력 중이던 다른 값(컬러 등)이 사라지지 않게 먼저 저장
        await api(`/designs/${id}/versions/${curNo}/production`, { method: 'PATCH', body: { actualMinutes: $('#v_act').value || null } })
        await reload(curNo); done && done()
      } catch (e) { setErr(e.message); alert(e.message) }
    })
    $('#d_reopen')?.addEventListener('click', async () => {
      try { await api(`/designs/${id}/versions/${curNo}/reopen`, { method: 'POST' }); await reload(curNo); done && done() } catch (e) { setErr(e.message); alert(e.message) }
    })
    $('#d_newver')?.addEventListener('click', async () => {
      try { const v = await api(`/designs/${id}/versions`, { method: 'POST' }); await reload(v.no); done && done() } catch (e) { setErr(e.message) }
    })
    $('#d_del')?.addEventListener('click', async () => {
      if (!confirm('이 디자인을 삭제할까요? 되돌릴 수 없습니다.')) return
      try { await api(`/designs/${id}`, { method: 'DELETE' }); dlg.close(); done && done() } catch (e) { setErr(e.message) }
    })
  }
  render()
}

// ── 주문 화면의 '디자인' 영역 ──────────────────────────────
// 한 주문에 디자인을 여러 개 연결할 수 있다(로고 + 이니셜 등). 연결은 '쓰는 버전'에 고정된다.
function wireDesigns(initial, canW, partnerOf) {
  const box = $('#dz_box')
  let list = initial.map((x) => ({ designId: String(x.designId), version: x.version, role: x.role || '', note: x.note || '', code: x.code, name: x.name, versions: null }))
  const info = new Map(initial.map((x) => [String(x.designId), x]))

  const ensure = async (l) => {
    if (l.versions) return
    try { l.versions = (await api(`/designs/${l.designId}`)).versions } catch (e) { l.versions = [] }
  }
  const verOf = (l) => (l.versions || []).find((v) => v.no === l.version)
  const paint = async () => {
    await Promise.all(list.map(ensure))
    box.innerHTML = `${list.length ? list.map((l, i) => {
      const v = verOf(l)
      const latest = (l.versions || []).reduce((m, x) => (!m || x.no > m.no ? x : m), null)
      const newer = latest && latest.no > l.version
      return `<div class="dz-row">
        <span>${thumb(v?.previewImage || info.get(l.designId)?.preview)}</span>
        <div class="dz-main">
          <div><b>${esc(l.code || '')}</b> ${esc(l.name || '')} ${v ? badge(`v${l.version} ${v.status}`, DS_BADGE[v.status]) : badge('삭제됨', 'b-bad')}
            ${newer ? `<span class="field-hint">· 새 버전 v${latest.no}(${esc(latest.status)})이 있습니다</span>` : ''}</div>
          <div class="field-hint">${(v?.colors || []).filter((c) => c.label || c.code || c.no).map((c) => esc(`${c.label || c.code || c.no}${c.part ? '(' + c.part + ')' : ''}`)).join(' · ') || '컬러 미지정'}
            ${(v?.files || []).map((f) => ` · <a href="${esc(fileUrl(f.path))}" download>${esc(f.name)}</a>`).join('')}</div>
        </div>
        <div class="dz-ctl">
          <select class="field-input" data-dz-role="${i}" ${canW ? '' : 'disabled'}>${[['', '용도 없음'], ['로고', '로고'], ['이니셜', '이니셜']].map(([k, t]) => `<option value="${k}" ${k === l.role ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <select class="field-input" data-dz-ver="${i}" ${canW ? '' : 'disabled'}>${(l.versions || []).slice().sort((a, b) => b.no - a.no).map((x) => `<option value="${x.no}" ${x.no === l.version ? 'selected' : ''}>v${x.no} ${esc(x.status)}</option>`).join('')}</select>
          ${canW ? `<button type="button" class="tb-logout" data-dz-rm="${i}">제거</button>` : ''}
        </div></div>`
    }).join('') : '<div class="field-hint">연결된 디자인이 없습니다.</div>'}
      ${canW ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <input class="field-input" id="dz_q" placeholder="디자인 검색 (이름·코드·거래처)" style="flex:1;min-width:180px">
        <select class="field-input" id="dz_sel" style="flex:1;min-width:200px"><option value="">검색 결과…</option></select>
        <button type="button" class="btn btn-ghost" id="dz_add">연결</button>
        ${me.can.includes('design') ? '<button type="button" class="btn btn-ghost" id="dz_new">새 디자인</button>' : ''}</div>` : ''}`
    box.querySelectorAll('[data-dz-role]').forEach((s) => { s.onchange = () => { list[s.dataset.dzRole].role = s.value } })
    box.querySelectorAll('[data-dz-ver]').forEach((s) => { s.onchange = () => { list[s.dataset.dzVer].version = Number(s.value); paint() } })
    box.querySelectorAll('[data-dz-rm]').forEach((b) => { b.onclick = () => { list.splice(Number(b.dataset.dzRm), 1); paint() } })
    const search = debounce(async () => {
      const q = $('#dz_q').value.trim()
      const sel = $('#dz_sel')
      try {
        const r = await api(`/designs?active=1&limit=30${q ? `&q=${encodeURIComponent(q)}` : ''}${!q && partnerOf() ? `&partnerId=${partnerOf()}` : ''}`)
        sel.innerHTML = '<option value="">검색 결과…</option>' + r.items.map((d) => `<option value="${d._id}" data-code="${esc(d.code)}" data-name="${esc(d.name)}">${esc(d.code)} ${esc(d.name)}${d.partnerName ? ` · ${esc(d.partnerName)}` : ''} (v${d.latestVersion} ${esc(d.latestStatus)})</option>`).join('')
      } catch (e) { /* 무시 */ }
    }, 250)
    $('#dz_q')?.addEventListener('input', search)
    search()
    $('#dz_add')?.addEventListener('click', async () => {
      const o = $('#dz_sel').selectedOptions[0]
      if (!o || !o.value) return setErr('연결할 디자인을 고르세요.')
      try {
        const d = await api(`/designs/${o.value}`)
        const best = d.versions.filter((v) => v.status === '확정').sort((a, b) => b.no - a.no)[0] || d.versions.slice().sort((a, b) => b.no - a.no)[0]
        list.push({ designId: String(d._id), version: best.no, role: '', note: '', code: d.code, name: d.name, versions: d.versions })
        info.set(String(d._id), { preview: best.previewImage })
        setErr(''); paint()
      } catch (e) { setErr(e.message) }
    })
    $('#dz_new')?.addEventListener('click', () => {
      // 새 디자인은 별도 드로어에서 만든다 — 주문 입력 중인 내용이 사라지지 않도록 이름만 받아 바로 만든다
      const name = prompt('새 디자인 이름 (예: CRS 로고)\n거래처는 이 주문의 거래처로 들어갑니다. 파일·컬러는 디자인 메뉴에서 올리세요.')
      if (!name || !name.trim()) return
      api('/designs', { method: 'POST', body: { name: name.trim(), partnerId: partnerOf() || null } }).then((d) => {
        list.push({ designId: String(d._id), version: 1, role: '', note: '', code: d.code, name: d.name, versions: d.versions })
        setErr(''); paint()
      }).catch((e) => setErr(e.message))
    })
  }
  paint()
  return () => list.map((l) => ({ designId: l.designId, version: l.version, role: l.role, note: l.note }))
}

// ── 작업지시서 (A4 한 장에 2개, PDF) ─────────────────────────────
// 작업일자 기준으로 배정된 주문을 보여 주고, 체크한 주문의 작업지시서를 만든다.
// 양식: 왼쪽 표(주문번호·주문명·작업일자, 수모 컬러/사이즈, 이니셜 좌/우, 로고 침·색상, 작업자) + 오른쪽 디자인 이미지·메모.
// 제작 명세가 여러 줄인 주문은 지시서에 색상×사이즈 합계를 싣고, 개별 내역은 별지(표)로 뒤에 붙인다.
const WS = { date: '', all: false, rows: [], sel: new Set() }
const WS_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
]
const loadScript = (src) => new Promise((res, rej) => {
  if (document.querySelector(`script[data-lib="${src}"]`)) return res()
  const el = document.createElement('script')
  el.src = src; el.dataset.lib = src
  el.onload = res
  el.onerror = () => rej(new Error('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하거나 [인쇄]를 사용하세요.'))
  document.head.appendChild(el)
})

async function viewWorksheets() {
  if (!WS.date) WS.date = ymd(new Date())
  pageShell({
    en: 'Worksheets', title: '작업지시서', addLabel: '',
    tools: `<span class="sch-nav"><button id="ws_prev" type="button" title="전날">‹</button><button id="ws_today" type="button">오늘</button><button id="ws_next" type="button" title="다음날">›</button></span>
      <input id="ws_date" class="table-select" type="date" value="${WS.date}">
      <label class="table-check"><input type="checkbox" id="ws_all" ${WS.all ? 'checked' : ''}> 미완료 배정 전체(오늘부터 30일)</label>
      <span style="flex:1"></span>
      <span id="ws_cnt" class="field-hint"></span>
      <button class="btn btn-ghost" id="ws_print" type="button">인쇄</button>
      <button class="btn btn-primary" id="ws_pdf" type="button">작업지시서 PDF</button>`,
  })
  const keyOf = (r) => `${r.orderId}|${r.date}`
  const count = () => { $('#ws_cnt').textContent = WS.sel.size ? `${WS.sel.size}건 선택` : '' }

  const paint = () => {
    paintTable(WS.rows, [
      ['chk', '<input type="checkbox" id="ws_chk_all" title="전체 선택">', (r) => `<input type="checkbox" data-ws="${esc(keyOf(r))}" ${WS.sel.has(keyOf(r)) ? 'checked' : ''}>`],
      ['no', '#', (r) => `<b>#${r.orderNo}</b>`],
      ['title', '주문명', (r) => esc(r.title)],
      ['partner', '거래처', (r) => esc(r.partnerName)],
      ['date', '작업일자', (r) => esc(r.date)],
      ['tasks', '공정 · 수량', (r) => r.tasks.map((t) => `${esc(t.task || '전체')} ${won(t.qty)}장`).join(' · ')],
      ['st', '상태', (r) => badge(r.status, r.status === '완료' ? 'b-good' : r.status === '진행' ? 'b-info' : 'b-warn')],
      ['dz', '디자인', (r) => { const m = { ready: ['확정', 'b-good'], working: ['작업 중', 'b-warn'], none: ['없음', 'b-bad'], na: ['불필요', 'b-mute'] }[r.designState] || ['없음', 'b-bad']; return badge(m[0], m[1]) }],
    ], null, '이 날짜에 배정된 주문이 없습니다.')
    $('#ft').textContent = `${WS.rows.length}건`
    const all = $('#ws_chk_all')
    if (all) {
      all.checked = WS.rows.length > 0 && WS.rows.every((r) => WS.sel.has(keyOf(r)))
      all.onchange = () => { WS.rows.forEach((r) => (all.checked ? WS.sel.add(keyOf(r)) : WS.sel.delete(keyOf(r)))); paint() }
    }
    document.querySelectorAll('[data-ws]').forEach((c) => {
      c.onchange = () => { c.checked ? WS.sel.add(c.dataset.ws) : WS.sel.delete(c.dataset.ws); count(); if (all) all.checked = WS.rows.every((r) => WS.sel.has(keyOf(r))) }
    })
    count()
  }

  const load = async () => {
    try {
      const all = $('#ws_all').checked
      WS.all = all; WS.date = $('#ws_date').value || ymd(new Date())
      const from = all ? ymd(new Date()) : WS.date
      const to = all ? ymd(addDays(new Date(), 30)) : WS.date
      const [r, mc] = await Promise.all([api(`/schedule?from=${from}&to=${to}`), api('/machines').catch(() => ({ items: [] }))])
      const mname = new Map(mc.items.map((m) => [String(m._id), m.name]))
      const map = new Map()
      for (const e of r.entries) {
        if (all && e.status === '완료') continue
        const k = `${e.orderId}|${e.date}`
        if (!map.has(k)) map.set(k, { orderId: String(e.orderId), orderNo: e.orderNo, title: e.order?.title || '', partnerName: e.order?.partnerName || '', date: e.date, tasks: [], notes: [], statuses: [], machines: [], designState: e.order?.designState || 'none', total: e.order?.totalQty || 0, offset: e.offset || 0 })
        const row = map.get(k)
        row.offset = Math.min(row.offset, e.offset || 0)
        const mn = e.machineId ? mname.get(String(e.machineId)) : ''
        if (mn && !row.machines.includes(mn)) row.machines.push(mn)
        ;(row.ents = row.ents || []).push({ m: mn || '', qty: e.qty, off: e.offset || 0, units: e.units || null, at: new Date(e.estStartAt || e.createdAt || 0).getTime(), seq: e.seq ?? 0, task: e.task || '' })
        const t = row.tasks.find((x) => x.task === (e.task || ''))
        if (t) t.qty += e.qty; else row.tasks.push({ task: e.task || '', qty: e.qty })
        row.statuses.push(e.status)
        if (e.note) row.notes.push(e.note)
      }
      WS.rows = [...map.values()].map((r) => ({ ...r, status: r.statuses.every((s) => s === '완료') ? '완료' : r.statuses.some((s) => s !== '지시') ? '진행' : '지시' }))
        .sort((a, b) => a.date.localeCompare(b.date) || a.orderNo - b.orderNo)
      // 목록에서 사라진 행은 선택에서 뺀다
      const keys = new Set(WS.rows.map(keyOf))
      for (const k of [...WS.sel]) if (!keys.has(k)) WS.sel.delete(k)
      paint()
    } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }

  $('#ws_date').addEventListener('change', load)
  $('#ws_all').addEventListener('change', load)
  $('#ws_today').onclick = () => { $('#ws_date').value = ymd(new Date()); $('#ws_all').checked = false; load() }
  const shift = (n) => { $('#ws_date').value = ymd(addDays(new Date(`${$('#ws_date').value || ymd(new Date())}T12:00`), n)); $('#ws_all').checked = false; load() }
  $('#ws_prev').onclick = () => shift(-1)
  $('#ws_next').onclick = () => shift(1)
  $('#ws_pdf').onclick = () => makeWorksheets('pdf')
  $('#ws_print').onclick = () => makeWorksheets('print')
  load()
}

// ── 지시서 HTML ─────────────────────────────────────────
const wsGroups = (o) => {
  const m = new Map()
  const ps = o.pieces || []
  if (ps.length) ps.forEach((p) => { const k = `${p.color || ''}\u0000${p.size || ''}`; m.set(k, (m.get(k) || 0) + 1) })
  else (o.items || []).forEach((i) => { const k = `${i.color || ''}\u0000${i.size || ''}`; m.set(k, (m.get(k) || 0) + (Number(i.qty) || 1)) })
  return [...m].map(([k, n]) => { const [color, size] = k.split('\u0000'); return { color, size, n } })
}

// 수모 컬러 칸: 코드 + 이미지를 왼쪽 정렬. 한 줄뿐이면(장별 시트) 칸을 키워 이미지를 크게 보여 준다.
const capCell = (v, big) => {
  const c = String(v ?? '').trim()
  const u = c ? pcImg('color', c) : ''
  return big ? `<td class="cim cap" style="height:38px"><div class="ws-ci"><span>${esc(c)}</span>${u ? `<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</div></td>`
    : `<td class="cim"><div class="ws-ci"><span>${esc(c)}</span>${u ? `<img class="sm" src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</div></td>`
}
// 컬러코드 + 이미지(남는 칸을 가득) — 이니셜 컬러 칸용
const codeImgCell = (v) => { const c = String(v ?? '').trim(); if (!c) return ''; const u = pcImg('initialColor', c); return `<div class="ws-ci"><span>${esc(c)}</span>${u ? `<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">` : ''}</div>` }

function wsSheet(row, o, pos) {
  const ps = o.pieces || []
  const grp = !!row.groupMode                                // 디자인·컬러 세트·이니셜이 같은 장을 묶은 시트
  const one = ps.length === 1 || (grp && ps.length) ? ps[0] : null
  const many = ps.length > 1 && !grp
  const groups = wsGroups(o)
  const shown = groups.slice(0, 4)
  const designs = o.designsState || []
  // 장별로 매핑한 디자인(디자인 매핑 단계) — 많이 쓰는 순. 매핑이 없으면 주문에 연결된 디자인 중 로고용을 쓴다.
  const usedN = new Map()
  ps.forEach((p) => { if (p.design) usedN.set(p.design, (usedN.get(p.design) || 0) + 1) })
  const used = [...usedN].sort((a, b) => b[1] - a[1]).map(([code, n]) => ({ d: designs.find((x) => x.code === code), code, n }))
  const logo = used.find((u) => u.d)?.d || designs.find((d) => d.role === '로고') || designs.find((d) => d.role !== '이니셜') || designs[0] || null
  const initDesign = designs.find((d) => d.role === '이니셜')
  // 컬러 세트: 장이 고른 세트(없으면 수모 색으로 자동, 그래도 없으면 기본)의 침별 컬러
  const dset = (() => {
    const vs = logo?.variants || []
    if (!one || !vs.length) return null
    if (one.variant && one.variant !== '기본') { const x = vs.find((y) => y.name === one.variant); if (x) return x }
    if (one.variant === '기본') return { name: logo.baseName || '기본', colors: logo.colors }
    return variantFor(vs, one.color) || { name: logo.baseName || '기본', colors: logo.colors }
  })()
  const colors = dset ? (dset.colors || []) : (logo?.colors || [])
  const colorText = (c) => `${c.label || c.code}${c.part ? ` (${c.part})` : ''}`
  const img = logo?.preview || initDesign?.preview || (o.attachments || [])[0] || ''
  const memo = [o.content, o.request, (row.pieceNote ?? one?.note) ? `비고: ${row.pieceNote ?? one.note}` : '', ...(row.notes || [])].filter((x) => x && String(x).trim()).join('\n')
  // 공정 · 매수: 묶은 장이 여러 장이면 "N매 작업", 한 장이면 비운다 ("전체 1장" 표기는 쓰지 않는다)
  const mae = row.mae || 0
  const taskTxt = mae > 1 ? (row.tasks.some((t) => t.task) ? row.tasks.map((t) => `${t.task || '전체'} ${mae}매 작업`).join(' · ') : `${mae}매 작업`)
    : (mae === 1 ? row.tasks.filter((t) => t.task).map((t) => t.task).join(' · ') : row.tasks.map((t) => `${t.task || '전체'} ${won(t.qty)}장`).join(' · '))
  const tr = (cells) => `<tr>${cells.join('')}</tr>`

  const capRows = shown.map((g, i) => tr([`<td class="l">${i === 0 ? '컬러' : ''}</td>`, capCell(g.color, shown.length === 1), `<td>${esc(g.size)}${groups.length > 1 || g.n > 1 ? ` ×${g.n}` : ''}</td>`])).join('')
    + (groups.length > shown.length ? tr(['<td class="l"></td>', `<td colspan="2">외 ${groups.length - shown.length}종</td>`]) : '')
  const initRows = many
    ? tr(['<td class="l">좌측</td>', `<td colspan="2">개별 ${ps.length}건 — 별지 참조</td>`]) + tr(['<td class="l">우측</td>', '<td></td><td></td>'])
    : tr(['<td class="l">좌측</td>', `<td>${esc(one?.initials || '')}</td>`, `<td class="cim">${codeImgCell(one?.initialColor)}</td>`])
      + tr(['<td class="l">우측</td>', `<td>${esc(one?.initialsRight || '')}</td>`, `<td class="cim">${one?.initialsRight ? codeImgCell(one?.initialColor) : ''}</td>`])
  // 로고: 침(1~7) · 컬러코드 · 컬러 이미지(칸을 가득 채움). 번호가 없는 옛 컬러는 이름 글자로 보여 준다.
  const logoRows = [0, 1, 2, 3, 4, 5, 6].map((i) => {
    const c = colors[i] && (colors[i].no || colors[i].code || colors[i].label) ? colors[i] : null
    const u = c?.no ? pcImg('initialColor', c.no) : ''
    return tr([`<td class="n">${i + 1}</td>`, `<td class="cc">${c ? esc(c.no || c.code || c.label || '') : ''}</td>`,
      `<td class="cim">${u ? `<img src="${esc(u)}" alt="" onerror="this.style.visibility='hidden'">` : (c && !c.no ? esc(colorText(c)) : '')}</td>`])
  }).join('')

  return `<div class="ws-sheet ${pos}">
    <div class="ws-left">
      <table class="ws-t ws-head"><tbody>
        <tr><td class="no">#${row.orderNo}</td><td colspan="2" class="ti">${esc(row.title)}${row.seq ? ` <span class="ws-seq">${esc(row.seq)}</span>` : ''}</td></tr>
        <tr><td class="l2">작업일자</td><td>${esc(row.date)}</td><td class="sub">${esc(taskTxt)}</td></tr>
        ${(row.seq || grp) && one && ((row.personText ?? one.person) || one.position) ? `<tr><td class="l2">주문자</td><td colspan="2"><div class="ws-pr"><span>${esc([row.personText ?? one.person, one.position].filter(Boolean).join(' · '))}</span><b>${one.design && logo ? esc(logo.name) + (dset ? ` (${esc(dset.name)})` : '') : ''}</b></div></td></tr>` : ''}
      </tbody></table>
      <table class="ws-t"><thead><tr><th>수모</th><th>컬러</th><th>사이즈</th></tr></thead><tbody>${capRows || tr(['<td class="l">컬러</td>', '<td></td>', '<td></td>'])}</tbody></table>
      <table class="ws-t"><thead><tr><th>이니셜</th><th>이니셜</th><th>컬러</th></tr></thead><tbody>${initRows}</tbody></table>
      <table class="ws-t"><thead><tr><th>로고</th><th>color</th><th>색상</th></tr></thead><tbody>${logoRows}</tbody></table>
      <table class="ws-t"><tbody><tr><td class="l">작업자</td><td></td><td></td></tr></tbody></table>
      <table class="ws-t ws-mach"><tbody><tr><td class="l">자수기</td><td colspan="2" class="mno">${esc((row.machines || []).map((n) => (/\d+/.exec(n) ? `${/\d+/.exec(n)[0]}번` : n)).join(' · '))}</td></tr></tbody></table>
    </div>
    <div class="ws-right">
      <div class="ws-img">${img ? `<img src="${esc(imgSrc(img))}" alt="">` : '<span>디자인 이미지 없음</span>'}</div>
      <div class="ws-cap">${used.length > 1 ? used.map((u) => `${esc(u.code)}${u.d ? ' ' + esc(u.d.name) : ''} ×${u.n}`).join(' · ') : logo ? `${esc(logo.code)} ${esc(logo.name)} v${logo.version}${logo.status ? ` (${esc(logo.status)})` : ''}${dset ? ` · ${esc(dset.name)}` : ''}` : ''}</div>
      <div class="ws-memo-l">메모</div>
      <div class="ws-memo">${esc(memo)}</div>
    </div>
  </div>`
}

async function makeWorksheets(mode) {
  const picked = WS.rows.filter((r) => WS.sel.has(`${r.orderId}|${r.date}`))
  if (!picked.length) return alert('작업지시서를 만들 주문을 체크하세요.')
  const btn = $(mode === 'pdf' ? '#ws_pdf' : '#ws_print')
  const label = btn.textContent
  btn.disabled = true; btn.textContent = '준비 중…'
  try {
    // 주문 상세(제작 명세·디자인·메모)
    const details = await Promise.all(picked.map((r) => api(`/orders/${r.orderId}`)))
    // 주문이 여러 장(제작 명세 2줄 이상)이면 장마다 한 장씩 만든다. 같은 디자인이어도 각각이며 1/7, 2/7 … 로 구분한다.
    //   주문 수량 N장이면 N장 각각: 이 작업일자에 배정된 장수만큼, 전체 번호(g/N)를 붙인다 (다른 날 배정분은 그 날짜의 작업지시서에서 이어서).
    //   제작 명세(장별 사양)가 N줄이면 한 줄씩, 줄 수가 N과 다르면 균등하게 나눠 대응시킨다.
    const sheets = []
    const notes = []
    picked.forEach((r, i) => {
      const d = details[i], ps = d.pieces || []
      const count = Math.max(1, ...r.tasks.map((x) => x.qty))
      const total = Math.max(r.total || 0, r.offset + count, ps.length)
      if (total <= 1 && count <= 1) { sheets.push(wsSheet({ ...r, mae: 1 }, d, '')); return }
      if (ps.length && ps.length !== total) notes.push(`#${r.orderNo}: 제작 명세 ${ps.length}줄 ≠ 주문 ${total}장 — 줄을 균등하게 나눠 ${total}장으로 만들었습니다`)
      // 이 날짜 작업분의 장마다 (사양, 자수기)를 정하고, 디자인·컬러 세트·이니셜(좌우·색)과 자수기가 같은 장은 한 시트로 묶는다.
      //   이니셜이 다르면 같은 디자인이어도 각각의 시트. 묶은 시트에는 "N매 작업"이 표시되고, 수모 색·사이즈는 ×장수로 나열된다.
      // 이 날짜 작업분의 (장 번호, 자수기): 생산 계획에서 확정한 배정은 장 번호(units)를 알고 있어 그대로 쓰고,
      //   장 번호가 없는 배정은 그 배정의 순서(offset)부터 수량만큼 차례로 잡는다. 로고·이니셜을 따로 배정한 주문은 수량이 많은 공정 하나만 본다.
      const byTask = new Map()
      for (const e of r.ents || []) byTask.set(e.task, (byTask.get(e.task) || 0) + e.qty)
      const mainTask = [...byTask.entries()].sort((a, b) => b[1] - a[1])[0]?.[0]
      const slots = []
      for (const e of (r.ents || []).filter((x) => x.task === mainTask).sort((a, b) => a.at - b.at || a.seq - b.seq)) {
        if (e.units && e.units.length) e.units.forEach((u) => slots.push({ g: u, m: e.m }))
        else for (let i = 0; i < e.qty; i++) slots.push({ g: e.off + i, m: e.m })
      }
      if (!slots.length) for (let k = 0; k < count; k++) slots.push({ g: r.offset + k, m: '' })
      slots.sort((a, b) => a.g - b.g)
      const groups = new Map()
      for (const slot of slots) {
        const g = slot.g
        const piece = ps.length ? (ps.length >= total ? (ps[g] || ps[ps.length - 1]) : ps[Math.min(ps.length - 1, Math.floor((g * ps.length) / total))]) : null
        const mach = slot.m ? [slot.m] : []
        const det = (d.designsState || []).find((x) => x.code === piece?.design)
        const setName = piece?.design ? (piece.variant || variantFor(det?.variants, piece.color)?.name || '기본') : ''
        const key = [piece?.design || '', setName, piece?.initials || '', piece?.initialsRight || '', piece?.initialColor || '', mach[0] || ''].join('\u0001')
        if (!groups.has(key)) groups.set(key, { machines: mach, pcs: [] })
        groups.get(key).pcs.push(piece)
      }
      const list = [...groups.values()]
      list.forEach((grp, si) => {
        const pcs = grp.pcs.filter(Boolean)
        const persons = [...new Set(pcs.map((x) => x.person).filter(Boolean))]
        const noteList = [...new Set(pcs.map((x) => x.note).filter(Boolean))]
        const n = grp.pcs.length
        sheets.push(wsSheet({
          ...r, machines: grp.machines, groupMode: true, mae: n, tasks: r.tasks.map((x) => ({ ...x, qty: n })),
          seq: list.length > 1 ? `${si + 1}/${list.length}` : '',
          personText: persons.length > 1 ? `${persons[0]} 외 ${persons.length - 1}명` : persons[0] || '',
          pieceNote: noteList.join(' / '),
        }, { ...d, pieces: pcs }, ''))
      })
    })
    if (notes.length) alert(notes.join('\n'))
    const pages = []
    for (let i = 0; i < sheets.length; i += 2) {
      pages.push(`<div class="ws-page">${sheets[i].replace('class="ws-sheet "', 'class="ws-sheet top"')}${sheets[i + 1] ? sheets[i + 1].replace('class="ws-sheet "', 'class="ws-sheet bottom"') : ''}<div class="ws-cut"></div></div>`)
    }

    let host = document.getElementById('ws_render')
    if (!host) { host = document.createElement('div'); host.id = 'ws_render'; document.body.appendChild(host) }
    host.innerHTML = pages.join('')
    // 이미지·글꼴이 준비될 때까지
    await Promise.all([...host.querySelectorAll('img')].map((im) => (im.complete ? 1 : new Promise((res) => { im.onload = im.onerror = res }))))
    if (document.fonts?.ready) await document.fonts.ready

    if (mode === 'print') { window.print(); return }

    await Promise.all(WS_LIBS.map(loadScript))
    host.classList.add('pdfmode')                  // 캡처 중에만 글자 위치 보정 (admin.css 참고)
    const { jsPDF } = window.jspdf
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' })
    const els = [...host.querySelectorAll('.ws-page')]
    for (let i = 0; i < els.length; i++) {
      btn.textContent = `PDF 만드는 중 ${i + 1}/${els.length}`
      const canvas = await window.html2canvas(els[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false })
      if (i) pdf.addPage()
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297)
    }
    pdf.save(`작업지시서_${WS.all ? ymd(new Date()) : WS.date}.pdf`)
  } catch (e) { alert(e.message) } finally { document.getElementById('ws_render')?.classList.remove('pdfmode'); btn.disabled = false; btn.textContent = label }
}

// ── 설정 ─────────────────────────────────────────────────
// 항목별 카드로 나눠 둔다. 새 설정이 생기면 카드를 하나 더 추가하면 된다. 변경은 관리자·매니저만(조회는 모두).

  let cap, app
  try { [cap, app] = await Promise.all([api('/schedule/capacity'), api('/settings')]) } catch (e) { $('#set_root').innerHTML = `<div class="sch-hint">${esc(e.message)}</div>`; return }

  const card = (id, title, desc, body) => `<section class="set-card"><header><h2>${title}</h2><p>${desc}</p></header>

      field('가동 중인 자수기(대)', `<input class="field-input" id="cp_m" type="number" min="0" value="${cap.machines}" ${dis}>`)
      + field('대당 하루 처리량(장)', `<input class="field-input" id="cp_p" type="number" min="1" value="${cap.perMachine}" ${dis}>`)
      + '<div class="drawer-note full" id="cp_lim"></div>'
      + `<div class="field full"><span class="field-label">날짜별 지정 — 장애·점검으로 대수가 줄거나, 주말에 작업하는 날</span><div id="cp_list"></div>

// ── 기간 배정: 하루 수량을 정해 여러 날에 한 번에 (임시 배정으로 쌓이고 [저장]으로 확정) ──
// 한도 반영: 이미 배정된 일정과 하루 한도를 고려해 날짜별로 채운다. 주말은 제외(주말 포함을 켜면 포함).
function planDays({ start, total, target, weekend, useCap, load, cap }) {
  const rows = []
  let left = total
  let d = new Date(`${start}T12:00:00`)
  for (let i = 0; i < 120 && left > 0; i++, d = addDays(d, 1)) {
    const k = ymd(d)
    const wk = d.getDay() === 0 || d.getDay() === 6
    const c = cap[k]
    if (wk && !weekend && c == null) continue
    if (c === 0) continue
    const avail = useCap && c != null ? Math.max(0, c - (load[k] || 0)) : Infinity
    const take = Math.min(left, target, avail)
    if (take <= 0) continue
    rows.push({ date: k, qty: take, load: (load[k] || 0) + take, cap: c })
    left -= take
  }
  return { rows, left }
}

// entry 를 주면(작업관리 드로어에서) 그 배정 하나의 수량을 여러 날로 나눈다 — 공정(로고·이니셜)은 그대로 두고
// 원래 배정은 대신 빠지고(임시), 나눈 배정들이 새로 생긴다. 로고·이니셜을 나눈 뒤에도 공정별로 기간 배정을 할 수 있다.
async function openPlan(orderId, entry) {
  const o = entry
    ? { _id: entry.orderId, orderNo: entry.orderNo, title: entry.order?.title || '', partnerName: entry.order?.partnerName, dueAt: entry.order?.dueAt, totalQty: entry.qty, status: entry.order?.status }
    : SCH.orders.find((x) => String(x._id) === String(orderId))
  if (!o) return
  let start = new Date(entry ? `${entry.date}T12:00:00` : Date.now())
  while (start.getDay() === 0 || start.getDay() === 6) start = addDays(start, 1)
  let daily = 60
  try { daily = (await api('/settings')).planDaily || 60 } catch (e) { /* 기본값 사용 */ }
  const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${o.orderNo}</b> ${esc(o.title)}${entry
    ? ` · <b>${esc(entry.task || '전체')}</b> 배정 ${won(entry.qty)}장(${esc(entry.date)})을 여러 날로 나눕니다. 이 배정은 아래 결과로 대체됩니다.`
    : (o.totalQty ? ` · 주문 수량 ${won(o.totalQty)}장` : ' · 수량을 직접 입력하세요')}</div>`
    + fieldHtml('시작일', `<input class="field-input" id="pl_start" type="date" value="${ymd(start)}">`)
    + fieldHtml('하루 배정 수량(장)', `<input class="field-input" id="pl_daily" type="number" min="1" value="${daily}">`)
    + fieldHtml('총 수량(장)', `<input class="field-input" id="pl_total" type="number" min="1" value="${o.totalQty || ''}" ${entry ? 'disabled' : ''}>`)
    + (entry
      ? fieldHtml('공정', `<select class="field-input" id="pl_task" disabled><option value="${esc(entry.task || '')}">${esc(entry.task || '전체(구분 없음)')}</option></select>`)
      : fieldHtml('공정', '<select class="field-input" id="pl_task"><option value="">전체(구분 없음)</option><option value="로고">로고</option><option value="이니셜">이니셜</option><option value="both">로고 + 이니셜 (각각 전체 수량)</option></select>'))
    + '<div class="field full"><label class="c-opt"><input type="checkbox" id="pl_cap" checked> 하루 한도를 넘지 않게(이미 배정된 일정 고려)</label>'
    + '<label class="c-opt"><input type="checkbox" id="pl_wk"> 주말 포함</label></div>'
    + '<div class="field full"><span class="field-label">미리보기</span><div id="pl_prev"></div></div>'
  const dlg = shell(`기간 배정 · #${o.orderNo}`, body, closeFoot(`<button type="button" class="btn btn-primary" id="pl_ok">${entry ? '나눠서 배정' : '배정 추가'}</button>`))
  let rows = [], left = 0, token = 0
  const calc = async () => {
    const my = ++token
    const st = $('#pl_start').value
    const total = Math.round(Number($('#pl_total').value)), target = Math.round(Number($('#pl_daily').value))
    const prev = $('#pl_prev')
    if (!st || !(total > 0) || !(target > 0)) { rows = []; prev.innerHTML = '<div class="field-hint">시작일, 하루 수량, 총 수량을 입력하세요.</div>'; return }
    const to = ymd(addDays(new Date(`${st}T12:00:00`), 95))
    let r
    try { r = await api(`/schedule?from=${st}&to=${to}`) } catch (e) { return setErr(e.message) }
    if (my !== token) return
    // 날짜별 이미 배정된 수량: 서버 배정(임시 삭제·수정 반영) + 임시 변경
    const loadMap = {}
    const bump = (e) => { if (e.date >= st && e.date <= to) loadMap[e.date] = (loadMap[e.date] || 0) + e.qty }
    const self = entry?._id
    r.entries.forEach((e) => { if (e._id !== self && !DRAFT.removes.has(e._id) && !DRAFT.edits.has(e._id) && !DRAFT.cancelAll.has(String(e.orderId))) bump(e) })
    DRAFT.edits.forEach((e) => { if (e._id !== self && !DRAFT.cancelAll.has(String(e.orderId))) bump(e) })
    DRAFT.adds.forEach((e) => { if (e._id !== self) bump(e) })
    const tasks = $('#pl_task').value === 'both' ? ['로고', '이니셜'] : [$('#pl_task').value]
    rows = []; left = 0
    for (const t of tasks) {
      const res = planDays({ start: st, total, target, weekend: $('#pl_wk').checked, useCap: $('#pl_cap').checked, load: loadMap, cap: r.capacity })
      res.rows.forEach((x) => { rows.push({ ...x, task: t }); loadMap[x.date] = x.load })
      left += res.left
    }
    prev.innerHTML = rows.length
      ? `<div class="table-scroll"><table class="data pl-table"><thead><tr><th>날짜</th><th>공정</th><th class="num">수량</th><th class="num">당일 합계 / 한도</th></tr></thead><tbody>${
        rows.map((x) => `<tr><td>${mdText(x.date)} (${DOW[new Date(`${x.date}T12:00`).getDay()]})</td><td>${esc(x.task || '전체')}</td><td class="num">${won(x.qty)}장</td>
          <td class="num ${x.cap != null && x.load > x.cap ? 'over' : ''}">${won(x.load)} / ${x.cap == null ? '–' : won(x.cap)}</td></tr>`).join('')}</tbody></table></div>
        <div class="field-hint" style="margin-top:6px">${rows.length}건 · 합계 ${won(rows.reduce((t, x) => t + x.qty, 0))}장${rows.length ? ` · ${mdText(rows[0].date)} ~ ${mdText(rows[rows.length - 1].date)}` : ''}</div>`
        + (left > 0 ? `<div class="drawer-note" style="color:var(--bad);margin-top:6px">⚠ ${won(left)}장을 배정하지 못했습니다(약 95일 안에 한도가 부족). 하루 수량이나 한도를 조정하세요.</div>` : '')
      : '<div class="drawer-note" style="color:var(--bad)">배정할 수 있는 날이 없습니다. 한도·시작일을 확인하세요.</div>'
  }
  ;['#pl_start', '#pl_daily', '#pl_total', '#pl_task', '#pl_cap', '#pl_wk'].forEach((id) => $(id).addEventListener('input', debounce(calc, 200)))
  $('#pl_task').addEventListener('change', calc)
  $('#pl_cap').addEventListener('change', calc)
  $('#pl_wk').addEventListener('change', calc)
  calc()
  $('#pl_ok').onclick = () => {
    if (!rows.length) return setErr('배정할 내용이 없습니다.')
    if (entry) {
      if (left > 0 && !confirm(`${won(left)}장을 배정하지 못했습니다. 그래도 이 배정을 나눠서 대체할까요? (배정하지 못한 수량은 사라집니다)`)) return
      if (!String(entry._id).startsWith('new-')) DRAFT.noMerge.add(entry._id)      // 대체하는 것이므로 서버가 다른 배정에 합치지 않게
      stageRemove(entry._id)
    }
    for (const x of rows) {
      DRAFT.adds.push({
        _id: `new-${++DRAFT.seq}`, orderId: o._id, orderNo: o.orderNo, date: x.date, qty: x.qty, task: x.task, status: '지시', note: '',
        order: { orderNo: o.orderNo, title: o.title, partnerName: o.partnerName, dueAt: o.dueAt, totalQty: o.totalQty, status: o.status },
      })
    }
    SCH.cur = new Date(`${rows[0].date}T12:00:00`)
    dlg.close()
    SCH.reload()
  }
}

// 배정 현황: "로고 32/32장 · 이니셜 24/32장\" — 공정별 배정 합계와 주문 수량
function taskNote(en) {
  const tt = taskTotals(en.orderId)
  const total = en.order?.totalQty || 0
  const parts = Object.keys(tt).filter((k) => tt[k] > 0).map((k) => {
    const warn = total && tt[k] !== total ? ' style="color:var(--orange-deep);font-weight:700"' : ''
    return `<span${warn}>${k || '전체'} ${won(tt[k])}${total ? `/${won(total)}` : ''}장</span>`
  })
  return parts.length ? `<div class="drawer-note" style="grid-column:1/-1">배정 현황(저장 전 변경 포함): ${parts.join(' · ')}</div>` : ''
}

// 작업지시 편집 — 여기서의 변경도 임시 변경이며 [저장]을 눌러야 반영된다.
function openEntry(en, canW, repaint, canWork) {
  if (!en) return
  const dis = canW ? '' : 'disabled'
  const body = taskNote(en)
    + fieldHtml('작업 일자', `<input class="field-input" id="e_date" type="date" value="${esc(en.date)}" ${dis}>`)
    + fieldHtml('수량(장)', `<input class="field-input" id="e_qty" type="number" min="1" value="${en.qty}" ${dis}><span class="field-hint">줄이면 남은 수량은 같은 날짜의 별도 배정(지시)으로 분리됩니다.</span>`)
    + fieldHtml('공정', `<select class="field-input" id="e_task" ${dis}>${[['', '전체(구분 없음)'], ['로고', '로고'], ['이니셜', '이니셜']].map(([v, l]) => `<option value="${v}" ${v === (en.task || '') ? 'selected' : ''}>${l}</option>`).join('')}</select>`)
    + `<div class="field"><span class="field-label">작업 상태${canWork && !en._draft && !String(en._id).startsWith('new-') ? ' <span style="font-weight:400;color:var(--ink-light)">· 누르면 바로 처리</span>' : ''}</span>${
      canWork && !en._draft && !String(en._id).startsWith('new-')
        ? `<div class="sch-statusbtn" id="wk_st">${statusButtons(en)}</div>`
        : `<div>${badge(en.status, en.status === '완료' ? 'b-good' : en.status === '진행' ? 'b-info' : 'b-warn')}</div>${
          canWork && (en._draft || String(en._id).startsWith('new-') || DRAFT.edits.has(en._id)) ? '<span class="field-hint">저장 전의 임시 배정입니다. 오른쪽 위 <b>저장</b>을 누르면 지시·진행·완료를 처리할 수 있습니다.</span>' : ''}`}</div>`
    + (SCH.machines.length ? `<div class="field full"><span class="field-label">자수기 — 실 교체를 줄이도록 배정하세요</span>
        <select class="field-input" id="e_machine" ${dis}><option value="">(미배정)</option>${SCH.machines.filter((m) => m.active !== false || String(m._id) === String(en.machineId)).map((m) => `<option value="${m._id}" ${String(m._id) === String(en.machineId || '') ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select>
        <div id="e_mneed" style="margin-top:8px"></div></div>` : '')
    + fieldHtml('작업 메모', `<textarea class="field-input" id="e_note" ${dis}>${esc(en.note || '')}</textarea>`, true)
    + '<div class="field full"><span class="field-label">주문 시 받은 이미지</span><div id="en_imgs"><span class="field-hint">불러오는 중…</span></div></div>'
    + `<div class="field full"><span class="field-label">수모 선택 — 이 주문에 쓸 수모 (번호 + 사이즈)</span><div id="en_caps"></div>${canWork ? `
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center"><input class="field-input" id="cp_no" placeholder="수모 번호 (예: 01)" style="width:150px" inputmode="numeric">
        <span id="cp_prev" style="width:30px;height:30px;flex:none"></span><input class="field-input" id="cp_size" placeholder="사이즈 (예: L)" style="width:110px">
        <button type="button" class="btn btn-ghost" id="cp_add">수모 추가</button></div>` : ''}</div>`
    + `<div class="field full"><span class="field-label">디자인 선택${['none', 'working'].includes(en.order?.designState) && (me.can.includes('design') || me.can.includes('orders'))
        ? ` <button type="button" class="btn btn-primary" id="dz_map" style="margin-left:10px;padding:3px 12px">디자인 매핑</button> <span style="font-weight:400;color:var(--bad)">${en.order.designState === 'none' ? '디자인이 연결되지 않았습니다' : '연결된 디자인이 아직 확정되지 않았습니다'}</span>` : ''}</span><div id="en_dz"></div>${canWork ? `
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><input class="field-input" id="dz_q" placeholder="디자인 이름·코드·거래처로 찾기" style="flex:1;min-width:200px" type="search">
        <select class="field-input" id="dz_sel" style="flex:1;min-width:220px"><option value="">디자인 선택…</option></select>
        <button type="button" class="btn btn-ghost" id="dz_add">디자인 연결</button></div>` : ''}</div>`
    + '<div class="field full"><span class="field-label">개별 주문내역 (제작 명세)</span><div id="en_pieces"><span class="field-hint">불러오는 중…</span></div></div>'
    + (canW && en.status === '지시' && en.qty >= Math.max(1, (SCH.cfg.machines || 0) * (SCH.cfg.perMachine || 0)) ? `<div class="field full"><span class="field-label">기간 배정 — ${esc(en.task || '전체')} 공정 ${won(en.qty)}장을 하루 수량씩 여러 날에</span>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn btn-ghost" id="pl_open">기간 배정</button>
        <span class="field-hint">이 배정이 날짜별 배정으로 대체됩니다(저장 전까지 임시). 로고·이니셜도 공정별로 각각 할 수 있습니다.</span></div></div>` : '')
    + (canW && en.qty > 1 ? `<div class="field full"><span class="field-label">수량 나누기 — 일부를 다른 날짜에 작업</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="field-input" id="sp_qty" type="number" min="1" max="${en.qty - 1}" placeholder="나눌 수량" style="flex:1;min-width:110px">
        <input class="field-input" id="sp_date" type="date" style="flex:1;min-width:150px"><button type="button" class="btn btn-ghost" id="sp_btn">나누기</button></div>
        <span class="field-hint">날짜를 비워 두면 같은 날짜(${esc(en.date)})로 나눕니다.</span></div>` : '')
    + (canW ? `<div class="field full"><span class="field-label">공정 나누기 — 로고와 이니셜을 따로 작업</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="field-input" id="tk_date" type="date" value="${esc(en.date)}" style="flex:1;min-width:150px">
        <button type="button" class="btn btn-ghost" id="tk_btn">${(en.task || '') ? `'${en.task === '로고' ? '이니셜' : '로고'}' 공정 추가` : '로고 · 이니셜로 나누기'}</button></div>
        <span class="field-hint">같은 수량(${won(en.qty)}장)의 ${(en.task || '') ? (en.task === '로고' ? '이니셜' : '로고') : '이니셜'} 작업이 위 날짜에 추가됩니다. 공정별로 날짜를 따로 옮길 수 있습니다.</span></div>` : '')
    + '<div class="drawer-note" style="grid-column:1/-1">적용한 변경은 일정표의 <b>저장</b>을 눌러야 반영됩니다.<br>"배정 취소"하면 이 수량이 같은 주문·같은 공정의 남은 배정(가장 빠른 날짜)에 합쳐지고, 남은 배정이 없으면 주문이 접수로 돌아갑니다.<br>로고·이니셜로 나뉜 주문은 "주문 전체 배정 취소"로 모든 공정을 한 번에 접수로 되돌릴 수 있습니다.</div>'
  const dlg = shell(`작업지시 · #${en.orderNo} ${esc(en.order?.title || '')}`, body,
    `${canW ? `<button type="button" class="btn btn-danger" id="e_del">${multiTask(en.orderId) ? '이 배정만 취소' : '배정 취소'}</button>` : ''}${
      canW && multiTask(en.orderId) ? '<button type="button" class="btn btn-danger" id="e_delall">주문 전체 배정 취소</button>' : ''}<button type="button" class="btn btn-ghost" id="e_open">주문 열기</button>${
      ''}${
      closeFoot(canW ? '<button type="button" class="btn btn-primary" id="e_apply">적용</button>' : '')}`)
  // 개별 주문내역(제작 명세) — 주문 수정 화면의 표와 같은 내용을 읽기 전용으로 보여 준다
  let ord = null
  const paintCaps = () => {
    const box = $('#en_caps')
    if (!box) return
    const caps = ord?.caps || []
    box.innerHTML = caps.length ? caps.map((c, i) => `<div class="cp-row"><b>${i + 1}</b><span class="mono" style="min-width:56px">${esc(c.no || c.code)}</span>
      <span style="display:inline-flex;align-items:center;gap:6px;min-width:120px">${c.no ? `<img src="/images/caps/${encodeURIComponent(c.no)}.png" alt="" style="width:30px;height:30px;object-fit:cover;border-radius:4px;border:1px solid var(--line)" onerror="this.style.visibility='hidden'"><span class="field-hint">${esc(c.no)}.png</span>` : ''}</span>
      <span style="min-width:40px">${esc(c.size || '')}</span><span class="sp"></span>${canWork ? `<button type="button" class="tb-logout" data-rmcap="${i}">삭제</button>` : ''}</div>`).join('')
      : '<div class="field-hint">선택한 수모가 없습니다.</div>'
    box.querySelectorAll('[data-rmcap]').forEach((b) => b.addEventListener('click', () => saveCaps(caps.filter((_, i) => i !== Number(b.dataset.rmcap)))))
  }
  const saveCaps = async (caps) => {
    try { const r = await api(`/orders/${en.orderId}/caps`, { method: 'POST', body: { caps } }); ord.caps = r.caps; paintCaps(); setErr('') } catch (e) { setErr(e.message) }
  }
  const paintDz = () => {
    const box = $('#en_dz')
    if (!box) return
    const cur = ord?.designsState || []
    box.innerHTML = cur.length ? cur.map((d) => `<div class="dz-row"><span>${thumb(d.preview)}</span>
      <div class="dz-main"><b>${esc(d.code)}</b> ${esc(d.name)} ${badge(`v${d.version} ${d.status || ''}`, DS_BADGE[d.status] || 'b-mute')}${d.role ? ` · ${esc(d.role)}` : ''}</div>
      ${canWork ? `<button type="button" class="tb-logout" data-rmdz="${esc(String(d.designId))}:${d.version}:${esc(d.role || '')}">연결 해제</button>` : ''}</div>`).join('')
      : `<div class="field-hint">${ord?.designNotNeeded ? '디자인이 필요 없는 주문으로 표시되어 있습니다.' : '연결된 디자인이 없습니다. 아래에서 선택하세요.'}</div>`
    box.querySelectorAll('[data-rmdz]').forEach((b) => b.addEventListener('click', () => saveDz((ord.designs || []).filter((l) => `${l.designId}:${l.version}:${l.role || ''}` !== b.dataset.rmdz))))
  }
  const saveDz = async (links) => {
    try {
      await api(`/orders/${en.orderId}/designs`, { method: 'POST', body: { designs: links.map((l) => ({ designId: String(l.designId), version: l.version, role: l.role || '', note: l.note || '' })) } })
      ord = await api(`/orders/${en.orderId}`); paintDz(); setErr('')
    } catch (e) { setErr(e.message) }
  }
  let dzList = []
  const loadDzList = async () => {
    const sel = $('#dz_sel')
    if (!sel) return
    try {
      const p = new URLSearchParams({ limit: '60', active: '1' })
      if ($('#dz_q').value.trim()) p.set('q', $('#dz_q').value.trim())
      else if (ord?.partnerId) p.set('partnerId', String(ord.partnerId))             // 검색어가 없으면 이 주문 거래처의 디자인부터
      dzList = (await api(`/designs?${p}`)).items
      sel.innerHTML = `<option value="">디자인 선택… (${dzList.length}개)</option>${dzList.map((d) => `<option value="${d._id}">${esc(d.code)} · ${esc(d.name)}${d.partnerName ? ` · ${esc(d.partnerName)}` : ''} (${d.hasConfirmed ? '확정' : '디자인 중'})</option>`).join('')}`
    } catch (e) { /* 목록 없이 진행 */ }
  }
  $('#dz_map')?.addEventListener('click', async () => {      // 디자인 매핑 drawer (장별 수모·이니셜 컬러·디자인·컬러 세트)로 이동
    try {
      const item = (await api('/schedule/design-queue?scope=all')).items.find((x) => String(x._id) === String(en.orderId))
      if (!item) return setErr('디자인 매핑을 할 수 없는 주문입니다.')
      dlg.close()
      openDesignAssist(item, true, () => SCH.reload && SCH.reload())
    } catch (e) { setErr(e.message) }
  })
  $('#dz_q')?.addEventListener('input', debounce(loadDzList))
  $('#dz_add')?.addEventListener('click', () => {
    const id = $('#dz_sel').value
    if (!id) return setErr('연결할 디자인을 선택하세요.')
    saveDz([...(ord.designs || []), { designId: id, version: 0, role: '' }])
  })
  $('#cp_no')?.addEventListener('input', () => { const v = $('#cp_no').value.trim(); $('#cp_prev').innerHTML = /^\d+$/.test(v) ? `<img src="/images/caps/${v}.png" alt="" style="width:30px;height:30px;object-fit:cover;border-radius:4px;border:1px solid var(--line)" onerror="this.style.visibility='hidden'">` : '' })
  $('#cp_add')?.addEventListener('click', async () => {
    const no = $('#cp_no').value.trim(), size = $('#cp_size').value.trim()
    if (!no) return setErr('수모 번호를 입력하세요.')
    if ((ord.caps || []).some((c) => c.no === no && (c.size || '') === size)) return setErr('이미 선택한 수모입니다.')
    await saveCaps([...(ord.caps || []), { no, size, label: `수모 ${no}${size ? ' ' + size : ''}` }])
    $('#cp_no').value = ''; $('#cp_size').value = ''; $('#cp_prev').innerHTML = ''
  })
  api(`/orders/${en.orderId}`).then((o) => {
    ord = o
    const im = $('#en_imgs')
    if (im) {
      const list = o.attachments || []
      im.innerHTML = list.length
        ? `<div style="display:flex;gap:10px;flex-wrap:wrap">${list.map((p) => `<a href="${esc(imgSrc(p))}" target="_blank" rel="noopener"><img class="cell-img" style="width:150px;height:150px;object-fit:cover" src="${esc(imgSrc(p))}" alt="" loading="lazy"></a>`).join('')}</div>`
        : '<span class="field-hint">주문에 첨부된 이미지가 없습니다.</span>'
    }
    paintCaps(); paintDz(); loadDzList()
    const box = $('#en_pieces')
    if (!box) return
    const ps = o.pieces || []
    if (!ps.length) { box.innerHTML = `<span class="field-hint">입력된 제작 명세가 없습니다. (주문 수량 ${en.order?.totalQty ? en.order.totalQty + '장' : '미정'})</span>`; return }
    box.innerHTML = pcReadTable(ps)
  }).catch(() => { const box = $('#en_pieces'); if (box) box.innerHTML = '<span class="field-hint">제작 명세를 불러오지 못했습니다.</span>' })
  // 자수기를 고르면 필요한 실이 그 자수기에 걸려 있는지(있음/없음)와 교체 개수·시간을 보여 준다
  const paintMneed = () => {
    const box = $('#e_mneed')
    if (!box) return
    const m = mcOf($('#e_machine').value)
    const need = needsOfEntry(en)
    if (!need.length) { box.innerHTML = '<span class="field-hint">이 작업에 지정된 실 정보가 없습니다. (디자인 매핑·이니셜색상을 확인하세요)</span>'; return }
    if (!m) { box.innerHTML = `<span class="field-hint">필요한 실 ${need.length}개: ${need.map((x) => esc(x)).join(' · ')} — 자수기를 선택하면 교체 개수를 계산합니다.</span>`; return }
    const sw = swapN(m.needles, need)
    box.innerHTML = `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${need.map((x) => `<span class="mchip ${m.needles.includes(x) ? '' : 'warn'}">${esc(x)} ${m.needles.includes(x) ? '있음' : '교체'}</span>`).join('')}</div>
      <div class="field-hint" style="margin-top:6px">${sw ? `<b class="late-txt">실 교체 ${sw}개 · 약 ${Math.round(sw * SCH.swapMin)}분</b>` : '<b>실 교체 없음</b>'} · ${esc(m.name)} 현재 침: ${m.needles.map((x) => esc(x || '-')).join(' ')}${need.length > 7 ? ` · ⚠ 필요한 실이 7개를 넘어 작업 중 ${need.length - 7}개는 추가 교체가 필요합니다` : ''}</div>`
  }
  $('#e_machine')?.addEventListener('change', paintMneed)
  paintMneed()
  $('#e_open').onclick = () => { dlg.close(); openForm(ENT.orders, { _id: String(en.orderId) }, SCH.reload) }
  $('#wk_st')?.querySelectorAll('[data-wkst]').forEach((b) => b.addEventListener('click', () => { dlg.close(); setWorkStatus(en, b.dataset.wkst) }))
  $('#e_del')?.addEventListener('click', () => { cancelEntry(en._id); dlg.close(); repaint() })
  $('#e_delall')?.addEventListener('click', () => {
    if (!confirm(`#${en.orderNo} 의 로고·이니셜 배정을 모두 취소하고 접수 상태로 되돌릴까요?`)) return
    if (cancelOrderAll(en.orderId)) { dlg.close(); repaint() }
  })
  $('#sp_btn')?.addEventListener('click', () => {
    const n = Math.round(Number($('#sp_qty').value)), d = $('#sp_date').value || en.date      // 날짜를 비우면 같은 날짜로 나눈다
    if (!(n > 0 && n < en.qty)) return setErr(`나눌 수량은 1 ~ ${en.qty - 1} 사이여야 합니다.`)
    stageChange(en._id, { qty: en.qty - n })
    DRAFT.adds.push({ _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: d, qty: n, task: en.task || '', status: '지시', note: '', order: en.order, machineId: en.machineId || '', needs: en.needs })
    dlg.close(); repaint()
  })
  $('#pl_open')?.addEventListener('click', () => { dlg.close(); openPlan(en.orderId, en) })
  $('#tk_btn')?.addEventListener('click', () => {
    const d = $('#tk_date').value || en.date
    const cur = en.task || ''
    const other = cur === '로고' ? '이니셜' : cur === '이니셜' ? '로고' : '이니셜'
    if (!cur) stageChange(en._id, { task: '로고' })                    // 구분 없던 배정은 로고로 바꾸고 이니셜을 추가
    DRAFT.adds.push({ _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: d, qty: en.qty, task: other, status: '지시', note: '', order: en.order })
    dlg.close(); repaint()
  })
  $('#e_apply')?.addEventListener('click', () => {
    const qty = Math.round(Number($('#e_qty').value))
    if (!(qty > 0)) return setErr('수량은 1 이상이어야 합니다.')
    if (!$('#e_date').value) return setErr('작업 일자를 선택하세요.')
    const task = $('#e_task').value
    const machineId = $('#e_machine') ? ($('#e_machine').value || '') : (en.machineId || '')
    stageChange(en._id, { date: $('#e_date').value, qty, task, note: $('#e_note').value, machineId })
    // 수량을 줄이면 줄어든 수량이 사라지지 않도록, 원래 날짜에 별도 배정으로 남긴다 (일부만 완료한 경우의 나머지 등).
    // 필요 없는 수량이면 그 칸을 '배정 취소' 하면 된다.
    if (qty < en.qty) {
      DRAFT.adds.push({
        _id: `new-${++DRAFT.seq}`, orderId: en.orderId, orderNo: en.orderNo, date: en.date, qty: en.qty - qty, task,
        status: en.status === '진행' ? '진행' : '지시', note: '', order: en.order, machineId: en.machineId || '', needs: en.needs,
      })
    }
    dlg.close(); repaint()
  })
}

// 이름별로 묶어 색상(행) × 사이즈(열) 표로 보여 준다 — 예: 수모 블랙 L 의 재고가 한눈에
function paintMatrix(list, onCell) {
  const t = $('#tbl')
  if (!list.length) { t.innerHTML = emptyTable('등록된 항목이 없습니다.'); return }
  const groups = new Map()
  for (const r of list) { if (!groups.has(r.name)) groups.set(r.name, []); groups.get(r.name).push(r) }
  const sizeRank = ['XS', 'S', 'M', 'L', 'XL', 'XXL']
  const bySize = (a, b) => (sizeRank.indexOf(a) + 1 || 99) - (sizeRank.indexOf(b) + 1 || 99) || a.localeCompare(b, 'ko')
  const cells = []
  t.innerHTML = [...groups].map(([name, items]) => {
    const sizes = [...new Set(items.map((r) => r.size))].sort(bySize)
    const colors = [...new Set(items.map((r) => r.color))].sort((a, b) => a.localeCompare(b, 'ko'))
    const find = (c, s) => items.find((r) => r.color === c && r.size === s)
    const total = items.reduce((s, r) => s + r.onHand, 0)
    return `<div style="padding:14px 18px 6px;font-weight:700">${esc(name)} <span class="hint" style="font-weight:400;color:var(--ink-light)">합계 ${won(total)} ${esc(items[0].unit)}</span></div>
      <table class="data"><thead><tr><th>색상 \\ 사이즈</th>${sizes.map((s) => `<th class="num">${esc(s || '-')}</th>`).join('')}</tr></thead><tbody>${
        colors.map((c) => `<tr><td class="strong">${esc(c || '-')}</td>${sizes.map((s) => {
          const r = find(c, s)
          if (!r) return '<td class="num muted">·</td>'
          cells.push(r)
          return `<td class="num ${onCell ? 'clickable' : ''} ${r.low ? 'low' : ''}" data-ci="${cells.length - 1}" style="${onCell ? 'cursor:pointer' : ''}">${won(r.onHand)}</td>`
        }).join('')}</tr>`).join('')}</tbody></table>`
  }).join('')
  if (onCell) t.querySelectorAll('[data-ci]').forEach((td) => { td.onclick = () => onCell(cells[td.dataset.ci]) })
}

async function openPO(rec, done) {
  const canW = me.can.includes('stock'), canD = me.can.includes('delete')
  const po = rec ? await api(`/purchase-orders/${rec._id}`) : null
  const mats = (await api('/materials/options?active=1')).items

  const editable = canW && (!po || (!received && po.status !== '취소'))
  const canReceive = canW && po && po.status !== '취소' && po.status !== '입고완료'
  const linesText = (po?.lines || []).map((l) => [l.code, l.qty, l.unitPrice].join(', ')).join('\n')
  const dis = canW && po?.status !== '취소' ? '' : 'disabled'

  let body = fieldHtml('발주처', `<input class="field-input" id="p_sup" value="${esc(po?.supplier || '')}" list="p_sups" ${dis}><datalist id="p_sups">${[...new Set(mats.map((m) => m.supplier).filter(Boolean))].map((s) => `<option value="${esc(s)}">`).join('')}</datalist>`, true)

    + fieldHtml('입고 예정일', `<input class="field-input" id="p_exp" type="date" value="${day(po?.expectedAt)}" ${dis}>`)
  if (editable) {
    body += pickerHtml('pk_po', mats)
      + fieldHtml('발주 품목 (한 줄에 하나)', `<textarea class="field-input" id="p_lines">${esc(linesText)}</textarea><span class="field-hint">물품코드, 수량, 단가(비우면 구입가격)</span>`, true)
  }
  body += fieldHtml('메모', `<textarea class="field-input" id="p_memo" ${dis}>${esc(po?.memo || '')}</textarea>`, true)
  if (po) {
    body += `<div class="field full"><span class="field-label">품목 · 입고 (합계 ${won(po.total)}원)</span><table class="data"><thead><tr><th>물품</th><th class="num">발주</th><th class="num">기입고</th><th class="num">단가</th>${canReceive ? '<th class="num">이번 입고</th>' : ''}</tr></thead><tbody>${
      po.lines.map((l) => `<tr><td>${esc(optName(l))}</td><td class="num">${won(l.qty)}</td><td class="num">${won(l.receivedQty)}</td><td class="num">${won(l.unitPrice)}</td>${
        canReceive ? `<td class="num"><input class="field-input" style="width:90px;text-align:right" type="number" min="0" data-rc="${esc(l.code)}" value="${Math.max(0, l.qty - l.receivedQty)}"></td>` : ''}</tr>`).join('')}</tbody></table></div>`
  }
  const dlg = shell(po ? `발주 #${po.poNo} · ${esc(po.status)}` : '물품 발주', body,
    `${po && canD && !received ? '<button type="button" class="btn btn-danger" id="px">삭제</button>' : ''}${po && canW && !received && po.status === '발주' ? '<button type="button" class="btn btn-ghost" id="pc">발주 취소</button>' : ''}${
      closeFoot(canReceive ? '<button type="button" class="btn btn-ghost" id="prc">입고 처리</button>' : '', canW && po?.status !== '취소' ? '<button type="button" class="btn btn-primary" id="save">저장</button>' : '')}`)
  wirePicker('pk_po', '#p_lines')

  const run = async (fn) => { try { await fn(); dlg.close(); done() } catch (e) { setErr(e.message) } }
  $('#save')?.addEventListener('click', () => run(async () => {
    const body = { supplier: $('#p_sup').value, orderedAt: $('#p_ord').value || null, expectedAt: $('#p_exp').value || null, memo: $('#p_memo').value }
    if ($('#p_lines')) body.lines = rows($('#p_lines').value).map(([code, qty, unitPrice]) => ({ code, qty: Number(qty) || 0, unitPrice: unitPrice === '' || unitPrice == null ? null : Number(unitPrice) }))
    if (po) await api(`/purchase-orders/${po._id}`, { method: 'PATCH', body })
    else await api('/purchase-orders', { method: 'POST', body })
  }))
  $('#prc')?.addEventListener('click', () => run(async () => {
    const lines = [...document.querySelectorAll('[data-rc]')].map((i) => ({ code: i.dataset.rc, qty: Number(i.value) || 0 })).filter((l) => l.qty > 0)
    await api(`/purchase-orders/${po._id}/receive`, { method: 'POST', body: { lines } })
  }))
  $('#pc')?.addEventListener('click', () => { if (confirm('발주를 취소할까요?')) run(() => api(`/purchase-orders/${po._id}/cancel`, { method: 'POST' })) })
  $('#px')?.addEventListener('click', () => { if (confirm('삭제할까요?')) run(() => api(`/purchase-orders/${po._id}`, { method: 'DELETE' })) })
}

    <div class="field full"><table class="data"><thead><tr><th>코드</th><th>이름</th><th>색상</th><th>사이즈</th><th class="num">전산</th><th class="num">실사</th><th class="num">차이</th></tr></thead><tbody>${
      st.lines.map((l) => `<tr><td class="mono">${esc(l.code)}</td><td>${esc(l.name)}</td><td>${esc(l.color)}</td><td>${esc(l.size)}</td><td class="num">${won(l.systemQty)}</td>
        <td class="num">${open && canW ? `<input class="field-input" style="width:90px;text-align:right" type="number" min="0" step="any" data-ct="${esc(l.code)}" data-sys="${l.systemQty}" value="${l.countedQty ?? ''}">` : won(l.countedQty)}</td>
        <td class="num ${diffCls(l.diff)}" data-df="${esc(l.code)}">${l.diff == null ? '' : (l.diff > 0 ? '+' : '') + won(l.diff)}</td></tr>`).join('')}</tbody></table></div>`
  const dlg = shell(`재고검수 #${st.no}`, body,
    `${open && canW ? '<button type="button" class="btn btn-danger" id="tx">삭제</button>' : ''}${closeFoot(open && canW ? '<button type="button" class="btn btn-ghost" id="tsv">저장</button><button type="button" class="btn btn-primary" id="tcp">검수 완료(재고 보정)</button>' : '')}`)
  document.querySelectorAll('[data-ct]').forEach((inp) => {
    inp.oninput = () => {
      const cell = document.querySelector(`[data-df="${CSS.escape(inp.dataset.ct)}"]`)
      if (inp.value === '') { cell.textContent = ''; return }
      const d = Number(inp.value) - Number(inp.dataset.sys)
      cell.textContent = (d > 0 ? '+' : '') + won(d); cell.className = `num ${d < 0 ? 'low' : ''}`
    }
  })
  const collect = () => [...document.querySelectorAll('[data-ct]')].map((i) => ({ code: i.dataset.ct, countedQty: i.value }))
  const run = async (fn) => { try { await fn(); dlg.close(); done() } catch (e) { setErr(e.message) } }
  $('#tsv')?.addEventListener('click', () => run(() => api(`/stocktakes/${st._id}`, { method: 'PATCH', body: { lines: collect() } })))
  $('#tcp')?.addEventListener('click', () => {
    if (!confirm('입력한 실사 수량으로 재고를 보정합니다. 완료 후에는 되돌릴 수 없습니다.')) return
    run(async () => { await api(`/stocktakes/${st._id}`, { method: 'PATCH', body: { lines: collect() } }); await api(`/stocktakes/${st._id}/complete`, { method: 'POST' }) })
  })
  $('#tx')?.addEventListener('click', () => { if (confirm('이 검수를 삭제할까요?')) run(() => api(`/stocktakes/${st._id}`, { method: 'DELETE' })) })
}

api('/auth/me').then((r) => { me = r.user }).catch(() => {}).finally(render)
</script>
</body>
</html>
