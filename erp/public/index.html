// ── 작업관리 (접수 주문 → 일정표로 끌어다 놓기 → 저장하면 '작업배정') ───────
// 좌측: 접수 상태 주문만. 날짜로 끌어 놓으면 임시 배정(점선)이 되고, 오른쪽 위 [저장]을 눌러야 주문 상태가 '작업배정'이 된다.
// 되돌리기: 일정 칸을 좌측 목록으로 끌어다 놓거나 작업지시를 삭제하면, 그 주문의 배정이 모두 없어질 때 '접수'로 돌아간다.
// 일정표에는 '#주문번호 수량장' 으로 보이고, 칸을 다른 날짜로 끌면 옮겨진다. 일/주/월 보기.
const SCH = { view: 'month', cur: new Date(), q: '', orders: [], entries: [], dues: [], cap: {}, cfg: { machines: 8, perMachine: 10 }, leftTab: 'orders', dq: [] }
try { const v = localStorage.getItem('sch_view'); if (['day', 'week', 'month'].includes(v)) SCH.view = v } catch (e) { /* 저장소 사용 불가 */ }
// 저장 전 임시 변경 — adds: 새 배정, edits: 기존 배정의 변경본(전체 스냅샷), removes: 삭제할 배정(id → orderId)
const DRAFT = { adds: [], edits: new Map(), removes: new Map(), noMerge: new Set(), cancelAll: new Set(), seq: 0 }
const draftCount = () => DRAFT.adds.length + DRAFT.edits.size + DRAFT.removes.size + DRAFT.cancelAll.size
const draftReset = () => { DRAFT.adds = []; DRAFT.edits = new Map(); DRAFT.removes = new Map(); DRAFT.noMerge = new Set(); DRAFT.cancelAll = new Set() }

const p2 = (n) => String(n).padStart(2, '0')
const ymd = (d) => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x }
const DOW = ['일', '월', '화', '수', '목', '금', '토']
const WORK_ST = ['지시', '진행', '완료']

function schRange() {
  const c = SCH.cur
  if (SCH.view === 'day') return [c, c]
  if (SCH.view === 'week') { const s = addDays(c, -c.getDay()); return [s, addDays(s, 6)] }
  const first = new Date(c.getFullYear(), c.getMonth(), 1, 12)
  const last = new Date(c.getFullYear(), c.getMonth() + 1, 0, 12)
  return [addDays(first, -first.getDay()), addDays(last, 6 - last.getDay())]
}
function schLabel() {
  const c = SCH.cur
  if (SCH.view === 'month') return `${c.getFullYear()}년 ${c.getMonth() + 1}월`
  if (SCH.view === 'day') return `${c.getMonth() + 1}월 ${c.getDate()}일 (${DOW[c.getDay()]})`
  const [s, e] = schRange()
  return `${s.getMonth() + 1}/${s.getDate()} – ${e.getMonth() + 1}/${e.getDate()}`
}

// ── 임시 변경 다루기 ────────────────────────────────────
const findEntry = (id) => DRAFT.adds.find((a) => a._id === id) || DRAFT.edits.get(id) || SCH.entries.find((e) => e._id === id)
function stageAdd(order, date) {
  DRAFT.adds.push({
    _id: `new-${++DRAFT.seq}`, orderId: order._id, orderNo: order.orderNo, date, qty: order.totalQty || 1, task: '', status: '지시', note: '',
    order: { orderNo: order.orderNo, title: order.title, partnerName: order.partnerName, dueAt: order.dueAt, totalQty: order.totalQty, status: order.status },
  })
}
function stageChange(id, changes) {
  const add = DRAFT.adds.find((a) => a._id === id)
  if (add) { Object.assign(add, changes); return }
  const base = findEntry(id)
  if (base) DRAFT.edits.set(id, { ...base, ...changes, _base: base._base || { qty: base.qty, task: base.task || '' } })
}
function stageRemove(id) {
  const i = DRAFT.adds.findIndex((a) => a._id === id)
  if (i >= 0) { DRAFT.adds.splice(i, 1); return }
  const base = findEntry(id)
  DRAFT.edits.delete(id)
  if (base) DRAFT.removes.set(id, { orderId: base.orderId, qty: base._base?.qty ?? base.qty, task: base._base?.task ?? (base.task || '') })
}
// 주문의 공정별 배정 합계 { '': n, '로고': n, '이니셜': n } — 서버 값에 저장 전 변경을 반영한다
function taskTotals(orderId) {
  const o = SCH.orders.find((x) => String(x._id) === String(orderId))
  const t = DRAFT.cancelAll.has(String(orderId)) ? {} : { ...(o?.taskQty || {}) }
  const add = (task, n) => { t[task || ''] = (t[task || ''] || 0) + n }
  DRAFT.adds.forEach((a) => { if (String(a.orderId) === String(orderId)) add(a.task, a.qty) })
  DRAFT.edits.forEach((e) => { if (String(e.orderId) === String(orderId)) { add(e._base?.task, -(e._base?.qty || 0)); add(e.task, e.qty) } })
  DRAFT.removes.forEach((r) => { if (String(r.orderId) === String(orderId)) add(r.task, -r.qty) })
  return t
}
// 지금까지 화면이 아는 배정 전부(서버 값 + 임시 변경 + 새 배정) — 보이는 기간 밖의 것은 포함되지 않는다
function knownEntries() {
  const out = []
  const gone = (e) => DRAFT.cancelAll.has(String(e.orderId))
  for (const e of SCH.entries) if (!DRAFT.removes.has(e._id) && !DRAFT.edits.has(e._id) && !gone(e)) out.push(e)
  DRAFT.edits.forEach((e) => { if (!gone(e)) out.push(e) })
  DRAFT.adds.forEach((a) => out.push(a))
  return out
}
// 일정 칸을 날짜에 놓기. 그 날짜에 같은 주문·같은 공정의 (완료되지 않은) 배정이 있으면 수량을 합친다.
//   · 놓은 자리의 칸(hitId)이 같은 주문·공정이면 그 칸에 합치고, 아니면 그 날짜의 같은 주문·공정 배정에 합친다.
//   · 합치면 원래 칸은 사라진다. 임시 변경이므로 [저장]을 눌러야 반영된다.
function dropEntry(srcId, date, hitId) {
  const src = findEntry(srcId)
  if (!src) return null
  const same = (e) => e && e._id !== srcId && String(e.orderId) === String(src.orderId) && (e.task || '') === (src.task || '') && e.status !== '완료'
  const day = currentEntries().filter((e) => e.date === date)
  let target = hitId ? day.find((e) => e._id === hitId && same(e)) : null
  if (!target && src.status !== '완료') target = day.find(same)
  if (!target || src.status === '완료') {
    if (src.date !== date) stageChange(srcId, { date })
    return { merged: false }
  }
  const status = src.status === '진행' || target.status === '진행' ? '진행' : target.status
  const note = [target.note, src.note].filter((x) => x && x.trim()).join(' / ')
  if (!String(srcId).startsWith('new-')) DRAFT.noMerge.add(srcId)         // 화면에서 합쳤으니 서버가 또 합치지 않게
  stageChange(target._id, { qty: target.qty + src.qty, status, note })
  stageRemove(srcId)
  return { merged: true, qty: src.qty, date, orderNo: src.orderNo, task: src.task || '' }
}

// 배정 취소 — 취소한 수량은 같은 주문·같은 공정의 남은 배정(완료 제외) 중 가장 빠른 날짜에 합쳐 총 수량을 지킨다.
// 남은 배정이 하나도 없으면 주문 전체가 접수로 돌아간다. 보이는 기간 밖의 배정은 서버가 저장할 때 합친다.
function cancelEntry(id) {
  const en = findEntry(id)
  if (!en) return null
  if (en.status === '완료') { alert('완료된 작업지시는 취소할 수 없습니다.'); return null }
  const others = knownEntries()
    .filter((e) => String(e.orderId) === String(en.orderId) && e._id !== id && e.status !== '완료' && (e.task || '') === (en.task || ''))
    .sort((a, b) => a.date.localeCompare(b.date))
  let into = null
  if (others.length) {
    into = others[0]
    stageChange(into._id, { qty: into.qty + en.qty })
    if (!String(id).startsWith('new-')) DRAFT.noMerge.add(id)       // 화면에서 합쳤으니 서버가 또 합치지 않게
  }
  stageRemove(id)
  return into ? { date: into.date, qty: en.qty } : null
}

// 화면에 보일 배정: 서버 값에 임시 변경을 덮어쓴 것 + 새 배정
function currentEntries() {
  const out = []
  const gone = (e) => DRAFT.cancelAll.has(String(e.orderId))
  for (const e of SCH.entries) {
    if (DRAFT.removes.has(e._id) || DRAFT.edits.has(e._id) || gone(e)) continue
    out.push(e)
  }
  for (const e of DRAFT.edits.values()) if (!gone(e)) out.push({ ...e, _draft: true })
  for (const a of DRAFT.adds) out.push({ ...a, _draft: true })
  const [s, en] = schRange()
  const [a, b] = [ymd(s), ymd(en)]
  return out.filter((e) => e.date >= a && e.date <= b).sort((x, y) => x.date.localeCompare(y.date) || x.orderNo - y.orderNo)
}
// 좌측 목록: 접수 상태이면서 (임시 변경까지 반영해) 배정이 하나도 없는 주문
function leftOrders() {
  return SCH.orders.filter((o) => {
    const id = String(o._id)
    const adds = DRAFT.adds.filter((x) => String(x.orderId) === id).length
    if (DRAFT.cancelAll.has(id)) return adds === 0               // 전체 취소 대기 중 — 새로 배정하지 않았다면 접수 목록으로
    const removed = [...DRAFT.removes.values()].filter((r) => String(r.orderId) === id).length
    return o.scheduledDays - removed + adds <= 0
  })
}

// 공정이 둘 이상(로고·이니셜) 배정된 주문인가
function multiTask(orderId) {
  return Object.values(taskTotals(orderId)).filter((n) => n > 0).length >= 2
}
// 주문 전체 배정 취소 — 로고·이니셜 등 공정과 날짜에 상관없이 모두 지우고 접수로 되돌린다 (저장 시 반영)
function cancelOrderAll(orderId) {
  const id = String(orderId)
  if (knownEntries().some((e) => String(e.orderId) === id && e.status === '완료')) {
    alert('완료된 작업지시가 있어 주문 전체 배정을 취소할 수 없습니다.')
    return false
  }
  DRAFT.adds = DRAFT.adds.filter((a) => String(a.orderId) !== id)
  for (const [k, e] of [...DRAFT.edits]) if (String(e.orderId) === id) DRAFT.edits.delete(k)
  for (const [k, r] of [...DRAFT.removes]) if (String(r.orderId) === id) { DRAFT.removes.delete(k); DRAFT.noMerge.delete(k) }
  const o = SCH.orders.find((x) => String(x._id) === id)
  if (o && o.scheduledDays > 0) DRAFT.cancelAll.add(id)         // 서버에 저장된 배정이 있을 때만 서버에서 지운다
  return true
}

async function viewSchedule() {
  const canW = me.can.includes('orders')
  const canWork = me.can.includes('work')
  const canDesign = me.can.includes('design')
  const hasLeft = canW || canDesign                       // 주문관리(배정) 또는 디자인 담당만 왼쪽 목록을 쓴다
  if (!canW && canDesign) SCH.leftTab = 'design'
  if (!canW && canWork && !canDesign && !SCH.workInit) { SCH.workInit = true; SCH.view = 'day'; SCH.cur = new Date() }    // 작업자는 오늘 할 일부터 본다
  $('#main').innerHTML = `<div class="sch ${hasLeft ? '' : 'solo'}">
    ${hasLeft ? `<section class="table-card sch-left" id="sch_left">
      <div class="table-tools" style="flex-wrap:wrap"><span class="sch-seg">${canW ? '<button data-lt="orders">접수 주문</button>' : ''}<button data-lt="design">디자인 필요 <b id="dq_n"></b></button></span>
        <input id="sq" class="table-search" style="max-width:none;flex:1;min-width:120px" placeholder="검색…" type="search" value="${esc(SCH.q)}"></div>
      <div class="sch-orders" id="sch_orders"></div>
    </section>` : ''}
    <section class="table-card sch-right">
      <div class="table-tools sch-bar">
        <span class="sch-nav"><button id="s_prev" title="이전">‹</button><button id="s_today">오늘</button><button id="s_next" title="다음">›</button></span>
        <span class="sch-label" id="s_label"></span><span class="sch-wmsg" id="w_msg"></span>
        <span class="sch-over" id="s_over"></span>
        <span class="sch-seg">${[['day', '일'], ['week', '주'], ['month', '월']].map(([k, l]) => `<button data-v="${k}">${l}</button>`).join('')}</span>
        <span style="flex:1"></span>
        ${canW ? '<span class="sch-save"><span class="msg" id="s_msg"></span><button class="btn btn-ghost" id="s_cancel">변경 취소</button><button class="btn btn-primary" id="s_save">저장</button></span>' : ''}
      </div>
      <div class="sch-cal" id="sch_cal"></div>
    </section></div>`

  const step = (dir) => {
    const c = new Date(SCH.cur)
    if (SCH.view === 'month') c.setMonth(c.getMonth() + dir, 1)
    else c.setDate(c.getDate() + dir * (SCH.view === 'week' ? 7 : 1))
    SCH.cur = c
    load()
  }
  $('#s_prev').onclick = () => step(-1)
  $('#s_next').onclick = () => step(1)
  $('#s_today').onclick = () => { SCH.cur = new Date(); load() }
  document.querySelectorAll('.sch-seg button').forEach((b) => {
    b.onclick = () => { SCH.view = b.dataset.v; try { localStorage.setItem('sch_view', SCH.view) } catch (e) { /* 무시 */ } load() }
  })
  $('#sq')?.addEventListener('input', debounce(() => { SCH.q = $('#sq').value; load() }))

  // 저장 / 변경 취소
  $('#s_cancel')?.addEventListener('click', () => { if (!draftCount() || confirm('저장하지 않은 변경을 모두 취소할까요?')) { draftReset(); load() } })
  $('#s_save')?.addEventListener('click', async () => {
    if (!draftCount()) return
    const btn = $('#s_save')
    btn.disabled = true
    try {
      const r = await api('/schedule/commit', {
        method: 'POST',
        body: {
          adds: DRAFT.adds.map((a) => ({ orderId: a.orderId, date: a.date, qty: a.qty, note: a.note, task: a.task || '' })),
          edits: [...DRAFT.edits.values()].map((e) => ({ id: e._id, date: e.date, qty: e.qty, status: e.status, note: e.note, task: e.task || '' })),
          removes: [...DRAFT.removes.keys()],
          noMerge: [...DRAFT.noMerge],
          cancelOrders: [...DRAFT.cancelAll],
        },
      })
      draftReset()
      await load()
      const to = (r.statusChanged || []).filter((c) => c.to === '작업배정').length
      const back = (r.statusChanged || []).filter((c) => c.to === '접수').length
      const mg = (r.merged || []).map((m) => `#${m.orderNo} ${m.qty}장${m.task ? m.task : ''} → ${m.date.slice(5).replace('-', '/')}`).join(', ')
      $('#s_msg').textContent = `저장됨${to ? ` · ${to}건 작업배정` : ''}${back ? ` · ${back}건 접수로 복귀` : ''}${mg ? ` · 수량 합침: ${mg}` : ''}`
      setTimeout(() => { const m = $('#s_msg'); if (m && !draftCount()) m.textContent = '' }, 4000)
    } catch (e) { alert(e.message); btn.disabled = false }
  })

  // 좌측 목록으로 일정 칸을 끌어다 놓으면 배정 취소(접수로 되돌림)
  const left = $('#sch_left')
  if (canW) {
    left.addEventListener('dragover', (ev) => { ev.preventDefault(); left.classList.add('over') })
    left.addEventListener('dragleave', (ev) => { if (!left.contains(ev.relatedTarget)) left.classList.remove('over') })
    left.addEventListener('drop', (ev) => {
      ev.preventDefault()
      left.classList.remove('over')
      const d = dragData(ev)
      if (d?.k === 'entry' && SCH.leftTab === 'orders') {
        const en = findEntry(d.id)
        if (en && multiTask(en.orderId)) {
          // 로고·이니셜이 나뉜 주문은 한 칸만 빼면 다른 공정이 남아 주문이 계속 작업배정에 묶인다 — 전체를 되돌릴지 묻는다
          if (confirm(`#${en.orderNo} 은(는) 로고·이니셜로 나뉘어 있습니다.\n주문의 배정을 모두 취소하고 접수 상태로 되돌릴까요?\n\n(이 칸만 취소하려면 칸을 눌러 "이 배정만 취소"를 사용하세요)`)) cancelOrderAll(en.orderId)
        } else cancelEntry(d.id)
        paint()
      }
    })
  }

  const paint = () => { paintLeft(canW, canDesign || canW); paintCal(canW, paint, canWork); paintDirty() }
  document.querySelectorAll('[data-lt]').forEach((b) => { b.onclick = () => { SCH.leftTab = b.dataset.lt; paint() } })
  const load = async () => {
    try {
      SCH.cur.setHours(12, 0, 0, 0)
      const [s, e] = schRange()
      const [cal, ord, dq] = await Promise.all([
        api(`/schedule?from=${ymd(s)}&to=${ymd(e)}`),
        canW ? api(`/schedule/orders${SCH.q ? `?q=${encodeURIComponent(SCH.q)}` : ''}`) : { items: [] },
        hasLeft ? api('/schedule/design-queue').catch(() => ({ items: [] })) : { items: [] },
      ])
      SCH.dq = dq.items
      SCH.entries = cal.entries; SCH.dues = cal.dues; SCH.orders = ord.items
      SCH.cap = cal.capacity || {}; SCH.cfg = cal.cfg || SCH.cfg
      paint()
    } catch (err) { $('#sch_cal').innerHTML = `<div class="sch-hint">${esc(err.message)}</div>` }
  }
  SCH.reload = load
  load()
}

function paintDirty() {
  const n = draftCount()
  const save = $('#s_save'), cancel = $('#s_cancel'), msg = $('#s_msg')
  if (!save) return
  save.disabled = n === 0
  cancel.disabled = n === 0
  save.textContent = n ? `저장 (${n})` : '저장'
  if (n) msg.textContent = '저장하면 배정된 주문이 "작업배정" 상태가 됩니다'
}

const dragData = (ev) => { try { return JSON.parse(ev.dataTransfer.getData('text/plain')) } catch (e) { return null } }

// 좌측: 탭에 맞는 목록
function paintLeft(canW, canAct) {
  if (!$('#sch_orders')) return
  if (!canW && SCH.leftTab !== 'design') SCH.leftTab = 'design'
  document.querySelectorAll('[data-lt]').forEach((b) => b.classList.toggle('on', b.dataset.lt === SCH.leftTab))
  const n = $('#dq_n')
  if (n) n.textContent = SCH.dq.length ? `(${SCH.dq.length})` : ''
  if (SCH.leftTab === 'design') paintDesignQueue(canAct)
  else paintOrders(canW)
}

// 디자인 필요 — 작업관리자의 디자인 할 일 (배정은 됐는데 디자인이 확정되지 않은 주문, 작업일 빠른 순)
function paintDesignQueue(canAct) {
  const box = $('#sch_orders')
  const q = SCH.q.trim().toLowerCase()
  const list = SCH.dq.filter((o) => !q || o.title.toLowerCase().includes(q) || String(o.orderNo) === q || (o.partnerName || '').toLowerCase().includes(q))
  const today = ymd(new Date())
  const KIND = { new: ['신규', 'b-warn'], reorder: ['재주문 후보', 'b-info'], working: ['작업 중', 'b-mute'] }
  box.innerHTML = list.length ? list.map((o) => {
    const diff = o.nextDate ? Math.round((new Date(`${o.nextDate}T12:00`) - new Date(`${today}T12:00`)) / 864e5) : null
    const when = o.nextDate ? `작업일 ${mdText(o.nextDate)} (${diff < 0 ? `D+${-diff}` : diff === 0 ? '오늘' : `D-${diff}`})` : ''
    const hint = o.kind === 'reorder' ? `이전 디자인 ${o.candidates.length}건: ${o.candidates.map((c) => esc(c.code)).join(', ')}`
      : o.kind === 'working' ? `연결된 디자인 ${o.designs.length}건 작업 중(확정 전)` : '이전 디자인 없음 — 로고 디자인 필요'
    return `<div class="sch-order" data-dq="${o._id}">
      <div class="so-top"><b>#${o.orderNo}</b>${badge(KIND[o.kind][0], KIND[o.kind][1])}<span class="so-q">${o.totalQty ? `${won(o.totalQty)}장` : ''}</span></div>
      <div class="so-title">${esc(o.title)}</div>
      <div class="so-sub ${diff !== null && diff < 0 ? 'late' : diff !== null && diff <= 1 ? 'soon' : ''}">${when}${o.partnerName ? ` · ${esc(o.partnerName)}` : ''}</div>
      <div class="so-design working">${hint}</div></div>`
  }).join('') : `<div class="sch-hint">${SCH.q ? '검색 결과가 없습니다.' : '디자인이 필요한 배정 주문이 없습니다.'}</div>`
  box.querySelectorAll('[data-dq]').forEach((el) => { el.onclick = () => openDesignAssist(SCH.dq.find((x) => String(x._id) === el.dataset.dq), canAct) })
}

// 디자인 작업 화면: 주문 요구사항·원본 이미지를 보면서 이전 디자인을 연결하거나 새로 만든다.
async function openDesignAssist(item, canAct) {
  if (!item) return
  let o
  try { o = await api(`/orders/${item._id}`) } catch (e) { return alert(e.message) }
  const cur = o.designsState || []
  const imgs = o.attachments || []
  const links = () => (o.designs || []).map((l) => ({ designId: String(l.designId), version: l.version, role: l.role || '', note: l.note || '' }))
  const after = () => { dlg.close(); SCH.reload && SCH.reload() }
  const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${o.orderNo}</b> ${esc(o.title)}${item.partnerName ? ` · ${esc(item.partnerName)}` : ''}${item.totalQty ? ` · ${won(item.totalQty)}장` : ''}${item.nextDate ? ` · 작업일 ${esc(item.nextDate)}` : ''}</div>
    ${o.content || o.request ? `<div class="field full"><span class="field-label">주문 요구사항</span><div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6">${esc([o.content, o.request].filter(Boolean).join('\n'))}</div></div>` : ''}
    <div class="field full"><span class="field-label">원본 이미지 (주문 첨부)</span>${imgs.length
      ? `<div style="display:flex;gap:10px;flex-wrap:wrap">${imgs.map((p) => `<a href="${esc(imgSrc(p))}" target="_blank" rel="noopener"><img class="cell-img" style="width:130px;height:130px" src="${esc(imgSrc(p))}" alt="" loading="lazy"></a>`).join('')}</div>`
      : '<span class="field-hint">첨부된 이미지가 없습니다. 주문의 첨부 이미지를 확인하세요.</span>'}</div>
    <div class="field full"><span class="field-label">연결된 디자인</span>${cur.length ? cur.map((d) => `<div class="dz-row"><span>${thumb(d.preview)}</span>
      <div class="dz-main"><b>${esc(d.code)}</b> ${esc(d.name)} ${badge(`v${d.version} ${d.status || ''}`, DS_BADGE[d.status] || 'b-mute')}${d.role ? ` · ${esc(d.role)}` : ''}</div>
      ${canAct ? `<button type="button" class="btn btn-ghost" data-open-design="${d.designId}">디자인 열기</button>` : ''}</div>`).join('') : '<span class="field-hint">연결된 디자인이 없습니다.</span>'}</div>
    <div class="field full"><span class="field-label">${esc(item.partnerName || '거래처')}의 이전 디자인 (재주문)</span>${item.candidates.length ? item.candidates.map((c) => `<div class="dz-row"><span>${thumb(c.preview)}</span>
      <div class="dz-main"><b>${esc(c.code)}</b> ${esc(c.name)} · 확정 v${c.version}</div>
      ${canAct ? `<button type="button" class="btn btn-primary" data-link="${c._id}" data-ver="${c.version}">이 디자인 사용</button>` : ''}</div>`).join('')
      : '<span class="field-hint">확정된 이전 디자인이 없습니다. 신규로 만드세요.</span>'}</div>`
  const dlg = shell(`디자인 작업 · #${o.orderNo}`, body,
    `${canAct ? '<button type="button" class="btn btn-ghost" id="da_na">디자인 불필요로 표시</button><button type="button" class="btn btn-primary" id="da_new">새 디자인 만들기</button>' : ''}${closeFoot()}`)
  dlg.querySelectorAll('[data-open-design]').forEach((b) => b.addEventListener('click', () => { dlg.close(); openDesign(b.dataset.openDesign, () => SCH.reload && SCH.reload()) }))
  dlg.querySelectorAll('[data-link]').forEach((b) => b.addEventListener('click', async () => {
    try {
      await api(`/orders/${o._id}/designs`, { method: 'POST', body: { designs: [...links(), { designId: b.dataset.link, version: Number(b.dataset.ver), role: '' }] } })
      after()
    } catch (e) { setErr(e.message) }
  }))
  $('#da_na')?.addEventListener('click', async () => {
    if (!confirm('이 주문은 디자인이 필요 없는 주문으로 표시할까요? (디자인 필요 목록에서 빠집니다)')) return
    try { await api(`/orders/${o._id}/designs`, { method: 'POST', body: { notNeeded: true } }); after() } catch (e) { setErr(e.message) }
  })
  $('#da_new')?.addEventListener('click', () => {
    const name = String(o.title || '').replace(/#\S+/g, '').replace(/\s+/g, ' ').trim()
    dlg.close()
    openDesign(null, null, { name, partnerId: o.partnerId ? String(o.partnerId) : '' }, async (d) => {
      try {
        await api(`/orders/${o._id}/designs`, { method: 'POST', body: { designs: [...links(), { designId: String(d._id), version: 1, role: '' }] } })
        SCH.reload && SCH.reload()
        openDesign(String(d._id), () => SCH.reload && SCH.reload())
      } catch (e) { alert(e.message) }
    })
  })
}

function paintOrders(canW) {
  const box = $('#sch_orders')
  if (!box) return
  const today = ymd(new Date())
  const list = leftOrders()
  // 기간 배정은 하루 처리 한도 이상(하루에 다 못 하는) 주문에만 보인다 — 한도 = 가동 대수 × 대당 처리량 (설정)
  const dayLimit = Math.max(1, (SCH.cfg.machines || 0) * (SCH.cfg.perMachine || 0))
  box.innerHTML = list.length ? list.map((o) => {
    const due = o.dueAt ? new Date(o.dueAt).toISOString().slice(0, 10) : ''
    const diff = due ? Math.round((new Date(`${due}T12:00`) - new Date(`${today}T12:00`)) / 864e5) : null
    const dueTxt = due ? `납기 ${due.slice(5).replace('-', '/')} (${diff < 0 ? `D+${-diff}` : diff === 0 ? '오늘' : `D-${diff}`})` : '납기 미정'
    const overdue = diff !== null && diff < 0
    return `<div class="sch-order ${overdue ? 'overdue' : ''}" ${canW ? 'draggable="true"' : ''} data-oid="${o._id}">
      <div class="so-top"><b>#${o.orderNo}</b>${badge(o.status, ORDER_BADGE[o.status] || 'b-warn')}${overdue ? '<span class="so-late">납기 초과</span>' : ''}<span class="so-q">${o.totalQty ? `${won(o.totalQty)}장` : '수량 ?'}</span></div>
      <div class="so-title">${esc(o.title)}</div>
      <div class="so-design ${o.designState || 'none'}">${{ none: '디자인 연결 없음', working: `디자인 작업 중 (${o.designCount}건)`, ready: `✓ 디자인 확정 (${o.designCount}건)` }[o.designState || 'none']}</div>
      <div class="so-sub ${diff !== null && diff < 0 ? 'late' : diff !== null && diff <= 3 ? 'soon' : ''}">${dueTxt}${o.partnerName ? ` · ${esc(o.partnerName)}` : ''}</div>${canW && o.totalQty >= dayLimit ? `<div class="so-actions"><button type="button" class="btn btn-ghost" data-plan="${o._id}" title="하루 수량을 정해 여러 날에 한 번에 배정">기간 배정</button></div>` : ''}</div>`
  }).join('') : `<div class="sch-hint">${SCH.q ? '검색 결과가 없습니다.' : '작업배정을 기다리는 접수 주문이 없습니다.'}</div>`
  box.querySelectorAll('.sch-order').forEach((el) => {
    el.addEventListener('dragstart', (ev) => {
      ev.dataTransfer.setData('text/plain', JSON.stringify({ k: 'order', id: el.dataset.oid }))
      ev.dataTransfer.effectAllowed = 'copy'
      el.classList.add('dragging')
    })
    el.addEventListener('dragend', () => el.classList.remove('dragging'))
    el.addEventListener('click', () => openForm(ENT.orders, { _id: el.dataset.oid }, SCH.reload))
  })
  box.querySelectorAll('[data-plan]').forEach((b) => b.addEventListener('click', (ev) => { ev.stopPropagation(); openPlan(b.dataset.plan) }))
}

// 납기 초과 작업: 완료되지 않았고 ① 작업일이 납기보다 늦거나 ② 납기가 이미 지난 경우. 이유 문구를 돌려준다(아니면 null).
function lateInfo(en) {
  if (!en || en.status === '완료' || !en.order?.dueAt) return null
  const due = new Date(en.order.dueAt).toISOString().slice(0, 10)
  const md = (d) => d.slice(5).replace('-', '/')
  if (en.date > due) return `작업일(${md(en.date)})이 납기(${md(due)})보다 늦습니다`
  if (due < ymd(new Date())) return `납기(${md(due)})가 지났는데 아직 완료되지 않았습니다`
  return null
}

function paintCal(canW, repaint, canWork) {
  const cal = $('#sch_cal')
  $('#s_label').textContent = schLabel()
  document.querySelectorAll('.sch-seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === SCH.view))
  const [s, e] = schRange()
  const today = ymd(new Date())
  const entries = currentEntries()
  const by = new Map()
  entries.forEach((en) => { if (!by.has(en.date)) by.set(en.date, []); by.get(en.date).push(en) })

  const chip = (en, big) => `<div class="sch-chip ${en._draft ? 'draft' : ''} ${lateInfo(en) ? 'late' : ''}" data-st="${esc(en.status)}" data-task="${esc(en.task || '')}" data-eid="${en._id}" ${canW ? 'draggable="true"' : ''}
      title="${esc(`#${en.orderNo} ${en.order?.title || ''} — ${en.qty}장${en.task ? ' ' + en.task : ''} (${en.status})${en._draft ? ' · 저장 전' : ''}${lateInfo(en) ? '\n⚠ ' + lateInfo(en) : ''}${en.note ? '\n' + en.note : ''}`)}">
      <b>${lateInfo(en) ? '⚠ ' : ''}#${en.orderNo}</b> ${won(en.qty)}장${en.status !== '완료' && ['none', 'working'].includes(en.order?.designState) ? '<span class="dzflag" title="디자인 미확정">D</span>' : ''}${en.task ? `<span class="task">${esc(en.task)}</span>` : ''}${big ? `<span class="sub">${esc(en.order?.title || '')}</span>` : ''}</div>`
  // 날짜 머리글: 합계/한도. 한도를 넘으면 붉게(관리자가 보고 재배정), 주말 작업은 '휴무' 표시
  const loadOf = (list) => (list || []).reduce((t, x) => t + x.qty, 0)
  const dayHead = (k, list) => {
    const n = loadOf(list), cap = SCH.cap[k]
    if (cap == null) return n ? `<span class="sch-sum off" title="작업일이 아닌 날(주말)에 배정되어 있습니다">휴무 ${won(n)}장</span>` : ''
    if (!n) return `<span class="sch-sum faint" title="하루 한도">한도 ${won(cap)}</span>`
    const over = n > cap
    return `<span class="sch-sum ${over ? 'over' : ''}" title="하루 한도 ${cap}장${over ? ` — ${n - cap}장 초과` : ''}">${over ? '⚠ ' : ''}${won(n)}/${won(cap)}</span>`
  }
  {
    const [rs, re] = schRange()
    let overDays = 0
    for (let d = new Date(rs); d <= re; d = addDays(d, 1)) {
      const k = ymd(d)
      if (SCH.cap[k] != null && loadOf(by.get(k)) > SCH.cap[k]) overDays++
    }
    $('#s_over').textContent = overDays ? `⚠ 한도 초과 ${overDays}일` : ''
  }

  if (SCH.view === 'day') {
    const key = ymd(SCH.cur)
    const list = by.get(key) || []
    const dn = loadOf(list), dcap = SCH.cap[key]
    const head = dcap == null ? (dn ? `<div class="sch-dayhead over" style="color:var(--orange-deep);border-color:var(--orange)">휴무일 작업 ${won(dn)}장</div>` : '<div class="sch-dayhead">휴무일(주말)입니다. 필요하면 일정 계획에서 직접 배정하세요.</div>')
      : `<div class="sch-dayhead ${dn > dcap ? 'over' : ''}">합계 ${won(dn)} / 하루 한도 ${won(dcap)}장${dn > dcap ? ` — ⚠ ${won(dn - dcap)}장 초과, 재배정이 필요합니다` : ''}</div>`
    cal.innerHTML = `<div class="sch-dayview" data-date="${key}">
      ${head}
      ${list.length ? list.map((en) => `<div class="sch-entry ${en._draft ? 'draft' : ''} ${lateInfo(en) ? 'late' : ''}" data-task="${esc(en.task || '')}" data-eid="${en._id}" ${canW ? 'draggable="true"' : ''}>
        <div class="qty">${won(en.qty)}장${en.task ? `<div style="font-size:12px;font-weight:700">${esc(en.task)}</div>` : ''}</div>
        <div class="meta"><div class="t">#${en.orderNo} ${esc(en.order?.title || '')}</div>
          <div class="s">${esc(en.order?.partnerName || '')}${en.status !== '완료' && ['none', 'working'].includes(en.order?.designState) ? ` · <span class="late-txt" style="color:var(--orange-deep)">디자인 ${en.order.designState === 'none' ? '필요' : '작업 중'}</span>` : ''}${lateInfo(en) ? ` · <span class="late-txt">⚠ ${esc(lateInfo(en))}</span>` : ''}${en.note ? ` · ${esc(en.note)}` : ''}${en._draft ? ' · 저장 전' : ''}</div>
          ${(en.order?.designs || []).filter((d) => !en.task || !d.role || d.role === en.task).map((d) => `<div class="sch-dz">${thumb(d.preview)}
            <span><b>${esc(d.role || '디자인')}</b> ${esc(d.code)} v${d.version} ${esc(d.status)}${d.colors.length ? ` · 컬러 ${d.colors.map((c) => esc(c.label || c.code)).join(', ')}` : ''}</span>
            ${d.files.map((f) => `<a href="${esc(fileUrl(f.path))}" download>${esc(f.ext)} 파일</a>`).join(' ')}</div>`).join('')}
          ${en.order?.totalQty ? `<div class="prog">${esc(en.task || '전체')} 공정 완료 ${won(en.order.taskDone?.[en.task || ''] || 0)} / ${won(en.order.totalQty)}장</div>` : ''}</div>
        ${badge(en.status, en.status === '완료' ? 'b-good' : en.status === '진행' ? 'b-info' : 'b-warn')}
        ${canWork && !en._draft ? `<div class="sch-actions">${statusButtons(en)}</div>` : (canWork ? '<div class="sch-actions"><span class="field-hint">저장 후 처리 가능</span></div>' : '')}</div>`).join('')
        : '<div class="sch-hint">이 날짜에 배정된 작업이 없습니다.<br>왼쪽 주문을 이곳으로 끌어다 놓으세요.</div>'}</div>`
  } else {
    const days = []
    for (let d = new Date(s); d <= e; d = addDays(d, 1)) days.push(new Date(d))
    cal.innerHTML = `<div class="sch-grid ${SCH.view}">${DOW.map((n, i) => `<div class="sch-dow ${i === 0 ? 'sun' : ''}">${n}</div>`).join('')}${
      days.map((d) => {
        const k = ymd(d)
        const out = SCH.view === 'month' && d.getMonth() !== SCH.cur.getMonth()
        const list = by.get(k) || []
        return `<div class="sch-cell ${out ? 'out' : ''} ${k === today ? 'today' : ''}" data-date="${k}">
          <div class="sch-day"><span class="sch-daynum ${d.getDay() === 0 ? 'sun' : ''}">${d.getDate()}</span>${dayHead(k, list)}</div>
          ${list.map((en) => chip(en, SCH.view === 'week')).join('')}</div>`
      }).join('')}</div>`
  }

  // 놓기(drop) — 주문 카드는 임시 배정 추가, 일정 칸은 날짜 이동. 저장은 [저장] 버튼에서.
  cal.querySelectorAll('[data-date]').forEach((cell) => {
    if (!canW) return
    cell.addEventListener('dragover', (ev) => { ev.preventDefault(); cell.classList.add('over') })
    cell.addEventListener('dragleave', (ev) => { if (!cell.contains(ev.relatedTarget)) cell.classList.remove('over') })
    cell.addEventListener('drop', (ev) => {
      ev.preventDefault()
      cell.classList.remove('over')
      const d = dragData(ev)
      if (!d) return
      if (d.k === 'order') {
        const o = SCH.orders.find((x) => String(x._id) === d.id)
        if (o) stageAdd(o, cell.dataset.date)
      } else if (d.k === 'entry') {
        const r = dropEntry(d.id, cell.dataset.date, ev.target.closest?.('[data-eid]')?.dataset.eid)
        if (r?.merged) workMsg(`#${r.orderNo} ${r.task ? r.task + ' ' : ''}${won(r.qty)}장을 ${mdText(r.date)} 배정에 합쳤습니다 (저장 전)`)
      }
      repaint()
    })
  })
  cal.querySelectorAll('[data-wkst]').forEach((b) => {
    b.addEventListener('click', (ev) => { ev.stopPropagation(); setWorkStatus(findEntry(b.dataset.eid), b.dataset.wkst) })
    b.addEventListener('dragstart', (ev) => ev.preventDefault())
  })
  cal.querySelectorAll('[data-wk]').forEach((b) => {
    b.addEventListener('click', (ev) => { ev.stopPropagation(); workAction(findEntry(b.dataset.eid), b.dataset.wk) })
    b.addEventListener('dragstart', (ev) => ev.preventDefault())
  })
  cal.querySelectorAll('[data-eid]').forEach((el) => {
    el.addEventListener('dragstart', (ev) => {
      ev.dataTransfer.setData('text/plain', JSON.stringify({ k: 'entry', id: el.dataset.eid }))
      ev.dataTransfer.effectAllowed = 'move'
    })
    el.addEventListener('click', (ev) => { ev.stopPropagation(); openEntry(findEntry(el.dataset.eid), canW, repaint, canWork) })
  })
}

// ── 작업 처리 (시작 · 완료 · 완료 취소) — 계획과 달리 저장 버튼 없이 즉시 반영된다 ──
function workMsg(text, bad) {
  const el = $('#w_msg')
  if (!el) return
  el.textContent = text
  el.style.color = bad ? 'var(--bad)' : ''
  clearTimeout(workMsg.t)
  workMsg.t = setTimeout(() => { el.textContent = '' }, 6000)
}
function workResultText(r, en, action) {
  const parts = [`#${en.orderNo} ${en.task ? en.task + ' ' : ''}${{ start: '작업 시작', complete: '완료 처리', undo: '완료 취소', reset: '지시로 되돌림' }[action]}`]
  for (const c of r.statusChanged || []) parts.push(`주문 ${c.from} → ${c.to}`)
  if (r.stock?.moves) parts.push(`수모 ${Math.abs(r.stock.delta)}장 ${r.stock.delta > 0 ? '재고 차감' : '재고 복원'}`)
  if (r.stock?.unmatched) parts.push(`⚠ 수모 옵션을 찾지 못해 ${r.stock.unmatched}장은 재고에 반영되지 않았습니다`)
  if (r.carried) parts.push(`남은 ${won(r.carried.qty)}장 → ${Number(r.carried.date.slice(5, 7))}/${Number(r.carried.date.slice(8, 10))} 배정에 합침`)
  if (r.reduced?.length) parts.push(`초과분 ${won(r.reduced.reduce((t, x) => t + x.take, 0))}장을 이후 배정에서 차감`)
  return parts.join(' · ')
}
// 작업 상태 버튼(지시 · 진행 · 완료) — 누르면 바로 처리된다 (저장 불필요)
const statusButtons = (en) => WORK_ST.map((st) =>
  `<button type="button" class="${en.status === st ? 'on' : ''}" data-wkst="${st}" data-eid="${en._id}" ${en.status === st ? 'aria-pressed="true"' : ''}>${st}</button>`).join('')
function setWorkStatus(en, to) {
  if (!en || en.status === to) return
  if (to === '완료') return workAction(en, 'complete')                    // 수량 입력창
  if (en.status === '완료') return workAction(en, 'undo', undefined, undefined, to)   // 완료 → 진행/지시
  if (to === '진행') return workAction(en, 'start')
  return workAction(en, 'reset')                                           // 진행 → 지시
}

async function workAction(en, action, qty, carry, to) {
  if (!en) return
  if (draftCount()) { alert('저장하지 않은 배정 변경이 있습니다. 먼저 저장하거나 변경을 취소한 뒤 처리하세요.'); return }
  if (action === 'complete' && qty === undefined) return openComplete(en)
  if ((action === 'start' || action === 'complete') && ['none', 'working'].includes(en.order?.designState)) {
    const why = en.order.designState === 'none' ? '디자인이 연결되지 않았습니다' : '연결된 디자인이 아직 확정되지 않았습니다'
    if (!confirm(`#${en.orderNo} ${why}.\n그래도 ${action === 'start' ? '작업을 시작' : '완료 처리'}할까요?`)) return
  }
  if (action === 'undo' && !confirm(`#${en.orderNo} ${en.task || ''} ${won(en.qty)}장의 완료를 취소할까요? (사용한 수모 재고는 되돌려집니다)`)) return
  try {
    const r = await api(`/schedule/${en._id}/work`, { method: 'POST', body: { action, qty, carry, to } })
    await SCH.reload()
    workMsg(workResultText(r, en, action), !!r.stock?.unmatched)
  } catch (e) { alert(e.message) }
}
const mdText = (d) => `${Number(d.slice(5, 7))}/${Number(d.slice(8, 10))}`
// 다음 작업일 추정: 같은 주문·공정의 다음 배정 날짜, 없으면 다음 평일 (서버도 같은 규칙으로 정한다)
function nextWorkDate(en) {
  const nxt = knownEntries().filter((e) => String(e.orderId) === String(en.orderId) && e._id !== en._id && e.status !== '완료'
    && (e.task || '') === (en.task || '') && e.date > en.date).sort((a, b) => a.date.localeCompare(b.date))[0]
  if (nxt) return nxt.date
  let d = addDays(new Date(`${en.date}T12:00:00`), 1)
  while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d, 1)
  return ymd(d)
}

// 완료 수량 입력
//   · 계획보다 적게 → 남은 수량을 다음 작업일에 합칠지(기본) / 같은 날 지시로 남길지 / 날짜를 고를지 묻는다
//   · 계획보다 많이 → 초과분은 이후 배정에서 자동 차감된다
function openComplete(en) {
  const nextD = nextWorkDate(en)
  const body = `<div class="drawer-note" style="grid-column:1/-1"><b>#${en.orderNo}</b> ${esc(en.order?.title || '')}${en.task ? ` · <b>${esc(en.task)}</b>` : ''} · ${esc(en.date)} · 계획 ${won(en.qty)}장</div>`
    + fieldHtml('완료 수량(장)', `<input class="field-input" id="c_qty" type="number" min="1" value="${en.qty}" inputmode="numeric" style="font-size:20px;padding:14px">`, true)
    + '<div id="c_more" style="grid-column:1/-1"></div>'
  const dlg = shell(`완료 처리 · #${en.orderNo}`, body, closeFoot('<button type="button" class="btn btn-primary" id="c_ok">완료 처리</button>'))
  const more = () => {
    const n = Math.round(Number($('#c_qty').value))
    const box = $('#c_more')
    if (n > 0 && n < en.qty) {
      box.innerHTML = `<div class="field-label" style="margin-bottom:4px">남은 ${won(en.qty - n)}장은?</div>
        <label class="c-opt"><input type="radio" name="c_carry" value="next" checked> 다음 작업일(${mdText(nextD)})에 합치기</label>
        <label class="c-opt"><input type="radio" name="c_carry" value="same"> 같은 날(${mdText(en.date)}) 지시로 남기기</label>
        <label class="c-opt"><input type="radio" name="c_carry" value="date"> 날짜 선택 <input class="field-input" id="c_date" type="date" value="${nextD}" style="width:auto"></label>`
    } else if (n > en.qty) {
      box.innerHTML = `<div class="drawer-note">계획(${won(en.qty)}장)보다 <b>${won(n - en.qty)}장</b> 더 했습니다. 초과분은 같은 주문·공정의 이후 배정에서 빠른 날짜부터 차감됩니다.</div>`
    } else box.innerHTML = ''
  }
  $('#c_qty').addEventListener('input', more)
  $('#c_qty').select()
  $('#c_ok').onclick = () => {
    const n = Math.round(Number($('#c_qty').value))
    if (!(n > 0)) return setErr('완료 수량은 1 이상이어야 합니다.')
    let carry
    if (n < en.qty) {
      const v = document.querySelector('input[name=c_carry]:checked')?.value
      carry = v === 'next' ? 'next' : v === 'date' ? ($('#c_date').value || nextD) : undefined
    }
    dlg.close()
    workAction(en, 'complete', n, carry)
  }
}

// ── 디자인 라이브러리 ─────────────────────────────────────
// 주문 이미지를 자수 파일로 변환·디자인한 결과를 버전별로 보관하고 재주문에서 다시 쓴다.
// 버전은 덮어쓰지 않으며 확정(디자인 중 → 확정)된 버전은 수정할 수 없다. 컬러는 자수사 번호(재고관리의 자수사 물품 옵션).
const DS_BADGE = { 확정: 'b-good', '디자인 중': 'b-warn', 삭제됨: 'b-bad' }
const fileUrl = (p) => `/api/files/${String(p).split('/').map(encodeURIComponent).join('/')}`
const fmtSize = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(n / 1024))}KB`)

async function viewDesigns() {
  const canW = me.can.includes('design')
  pageShell({
    en: 'Designs', title: '디자인', addLabel: canW ? '디자인 등록' : '',
    tools: `<input id="q" class="table-search" placeholder="이름·코드·거래처·태그 검색…" type="search">
      <select id="f" class="table-select"><option value="">상태 전체</option><option>디자인 중</option><option>확정</option></select>`,
  })
  const load = async () => {
    try {
      const p = new URLSearchParams({ limit: '300' })
      if ($('#q').value) p.set('q', $('#q').value)
      if ($('#f').value) p.set('status', $('#f').value)
      const { items } = await api(`/designs?${p}`)
      paintTable(items, [
        ['img', '', (d) => thumb(d.preview)], ['code', '코드', (d) => `<span class="mono">${esc(d.code)}</span>`],
        ['name', '디자인', (d) => `<b>${esc(d.name)}</b>${d.active === false ? ` ${badge('중지', 'b-mute')}` : ''}`],
        ['partner', '거래처', (d) => esc(d.partnerName)],
        ['ver', '최신 버전', (d) => `v${d.latestVersion} ${badge(d.latestStatus, DS_BADGE[d.latestStatus] || 'b-mute')}`],
        ['col', '컬러', (d) => `${d.colorCount}색`, 'r'], ['files', '자수 파일', (d) => `${d.fileCount}개`, 'r'],
        ['upd', '수정', (d) => day(d.updatedAt)],
      ], (d) => openDesign(d._id, load), '등록된 디자인이 없습니다. "디자인 등록"으로 시작하세요.')
      $('#ft').textContent = `${items.length}건`
    } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }
  $('#q').addEventListener('input', debounce(load))
  $('#f').onchange = load
  $('#add')?.addEventListener('click', () => openDesign(null, load))
  load()
}

// 디자인 드로어: id 가 없으면 새로 만든다. prefill: { name, partnerId } (주문 화면에서 만들 때)
async function openDesign(id, done, prefill = {}, onCreated) {
  const canW = me.can.includes('design'), canD = me.can.includes('delete')
  if (!cache.partners) await refs().catch(() => {})
  const partnerOpts = (cur) => `<option value="">(미지정)</option>${(cache.partners || []).map((p) => `<option value="${p._id}" ${p._id === cur ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}`

  // 새 디자인 — 이름·거래처만 받고 만들면 버전 1(디자인 중)이 생긴다. 파일은 만든 뒤 올린다.
  if (!id) {
    const body = fieldHtml('디자인 이름', `<input class="field-input" id="n_name" value="${esc(prefill.name || '')}" placeholder="예: CRS 로고">`, true)
      + fieldHtml('거래처', `<select class="field-input" id="n_partner">${partnerOpts(prefill.partnerId || '')}</select>`)
      + fieldHtml('태그 (쉼표)', '<input class="field-input" id="n_tags" placeholder="로고, 이니셜 …">')
      + '<div class="drawer-note" style="grid-column:1/-1">만든 뒤 시안 이미지·자수 파일·컬러를 올리고 확정합니다. 같은 이름의 디자인을 두 번 만들지 말고, 수정은 새 버전으로 하세요.</div>'
    const dlg = shell('디자인 등록', body, closeFoot('<button type="button" class="btn btn-primary" id="save">만들기</button>'))
    $('#save').onclick = async () => {
      try {
        const d = await api('/designs', { method: 'POST', body: { name: $('#n_name').value, partnerId: $('#n_partner').value || null, tags: textToTags($('#n_tags').value) } })
        dlg.close()
        if (onCreated) onCreated(d)
        else { done && done(); openDesign(d._id, done) }
      } catch (e) { setErr(e.message) }
    }
    return
  }

  let design = await api(`/designs/${id}`)
  const threads = (await api('/designs/thread-options').catch(() => ({ items: [], keyword: '자수사' })))
  let curNo = Math.max(...design.versions.map((v) => v.no))
  let colors = []

  const ver = () => design.versions.find((v) => v.no === curNo)
  const editable = () => canW && ver().status === '디자인 중'
  const readVersionFields = () => ({
    note: $('#v_note')?.value ?? '', widthMm: $('#v_w')?.value ?? '', heightMm: $('#v_h')?.value ?? '', stitches: $('#v_s')?.value ?? '', colors,
  })

  const render = () => {
    const v = ver()
    const ed = editable()
    colors = v.colors.map((c) => ({ ...c }))
    const dis = ed ? '' : 'disabled'
    const body = `
      <div class="drawer-note" style="grid-column:1/-1"><b>${esc(design.code)}</b> · 버전 ${design.versions.length}개 · 사용 주문 ${design.usedBy.length ? design.usedBy.map((u) => `#${u.orderNo}(v${u.version})`).join(', ') : '없음'}</div>
      ${fieldHtml('디자인 이름', `<input class="field-input" id="d_name" value="${esc(design.name)}" ${canW ? '' : 'disabled'}>`, true)}
      ${fieldHtml('거래처', `<select class="field-input" id="d_partner" ${canW ? '' : 'disabled'}>${partnerOpts(design.partnerId ? String(design.partnerId) : '')}</select>`)}
      ${fieldHtml('태그 (쉼표)', `<input class="field-input" id="d_tags" value="${esc((design.tags || []).join(', '))}" ${canW ? '' : 'disabled'}>`)}
      ${fieldHtml('메모', `<textarea class="field-input" id="d_memo" ${canW ? '' : 'disabled'}>${esc(design.memo || '')}</textarea>`, true)}
      <div class="field full" style="border-top:1px solid var(--line);padding-top:14px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="field-label" style="margin:0">버전</span>
          <select class="field-input" id="v_sel" style="width:auto">${design.versions.slice().sort((a, b) => b.no - a.no).map((x) => `<option value="${x.no}" ${x.no === curNo ? 'selected' : ''}>v${x.no} · ${esc(x.status)}</option>`).join('')}</select>
          ${badge(v.status, DS_BADGE[v.status])}
          <span class="field-hint">${v.status === '확정' ? `확정 ${day(v.confirmedAt)} — 확정된 버전은 수정할 수 없습니다. 고치려면 새 버전을 만드세요.` : '디자인 중 — 파일을 올리고 컬러를 정한 뒤 확정하세요.'}</span>
        </div>
      </div>
      <div class="field full"><span class="field-label">시안 이미지</span>
        <div class="img-field"><span>${thumb(v.previewImage)}</span><div class="img-side">
          ${v.previewImage ? `<a href="${esc(fileUrl(v.previewImage))}" target="_blank" rel="noopener" class="field-hint">원본 열기</a>` : ''}
          ${ed ? `<input type="file" id="up_img" accept="image/png,image/jpeg,image/webp,image/gif">${v.previewImage ? '<button type="button" class="btn btn-ghost" id="rm_img" style="align-self:flex-start">시안 제거</button>' : ''}` : ''}
        </div></div></div>
      <div class="field full"><span class="field-label">자수 파일 (.dst .pes .jef .exp .emb … · 50MB 이하)</span>
        ${(v.files || []).length ? `<div>${v.files.map((f) => `<div class="cp-row"><a href="${esc(fileUrl(f.path))}" download>${esc(f.name)}</a>
          <span class="field-hint">${esc(f.ext)} · ${fmtSize(f.size || 0)}</span><span class="sp"></span>${ed ? `<button type="button" class="tb-logout" data-rmf="${esc(f.path)}">삭제</button>` : ''}</div>`).join('')}</div>`
          : '<div class="field-hint">올린 자수 파일이 없습니다.</div>'}
        ${ed ? '<input type="file" id="up_file" style="margin-top:8px">' : ''}
      </div>
      <div class="field full"><span class="field-label">컬러 — 자수사 번호 (재고관리 &gt; ${esc(threads.keyword)} 물품의 옵션)</span>
        <div id="d_colors"></div>
        ${ed ? `<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><select class="field-input" id="th_sel" style="flex:1;min-width:200px"><option value="">자수사 선택…</option>${
          threads.items.map((t) => `<option value="${esc(t.code)}">${esc(t.label)}</option>`).join('')}</select>
          <input class="field-input" id="th_part" placeholder="사용 부위 (예: 외곽, 글자)" style="flex:1;min-width:140px"><button type="button" class="btn btn-ghost" id="th_add">컬러 추가</button></div>
          ${threads.items.length ? '' : `<span class="field-hint" style="color:var(--bad)">"${esc(threads.keyword)}"이(가) 들어간 물품이 없습니다. 재고관리에서 자수사를 등록하거나 설정의 키워드를 확인하세요.</span>`}` : ''}
      </div>
      ${fieldHtml('가로(mm)', `<input class="field-input" id="v_w" type="number" min="0" step="any" value="${v.widthMm ?? ''}" ${dis}>`)}
      ${fieldHtml('세로(mm)', `<input class="field-input" id="v_h" type="number" min="0" step="any" value="${v.heightMm ?? ''}" ${dis}>`)}
      ${fieldHtml('스티치 수', `<input class="field-input" id="v_s" type="number" min="0" value="${v.stitches ?? ''}" ${dis}>`)}
      ${fieldHtml('버전 메모 (변경 내용 등)', `<textarea class="field-input" id="v_note" ${dis}>${esc(v.note || '')}</textarea>`, true)}`
    const latest = Math.max(...design.versions.map((x) => x.no))
    const foot = `${canD ? '<button type="button" class="btn btn-danger" id="d_del">디자인 삭제</button>' : ''}${
      canW && ver().status === '확정' && curNo === latest ? '<button type="button" class="btn btn-ghost" id="d_newver">새 버전 만들기</button>' : ''}${
      closeFoot(canW ? `<button type="button" class="btn btn-ghost" id="save">저장</button>${ed ? '<button type="button" class="btn btn-primary" id="d_confirm">확정</button>' : ''}` : '')}`
    const dlg = shell(`디자인 · ${esc(design.name)}`, body, foot)
    wire(dlg)
    paintColors()
  }

  const paintColors = () => {
    const box = $('#d_colors')
    if (!box) return
    const ed = editable()
    box.innerHTML = colors.length ? colors.map((c, i) => `<div class="cp-row"><b>${i + 1}</b><span>${esc(c.label || c.code)}</span>
      <span class="field-hint">${esc(c.part || '')}</span><span class="sp"></span>${ed ? `<button type="button" class="tb-logout" data-rmc="${i}">삭제</button>` : ''}</div>`).join('')
      : '<div class="field-hint">지정된 컬러가 없습니다.</div>'
    box.querySelectorAll('[data-rmc]').forEach((b) => { b.onclick = () => { colors.splice(Number(b.dataset.rmc), 1); paintColors() } })
  }

  const reload = async (keepNo) => {
    design = await api(`/designs/${id}`)
    if (keepNo) curNo = keepNo
    render()
  }
  const saveAll = async () => {
    await api(`/designs/${id}`, { method: 'PATCH', body: { name: $('#d_name').value, partnerId: $('#d_partner').value || null, tags: textToTags($('#d_tags').value), memo: $('#d_memo').value } })
    if (editable()) await api(`/designs/${id}/versions/${curNo}`, { method: 'PATCH', body: readVersionFields() })
  }
  const upload = async (inputEl) => {
    const f = inputEl.files[0]
    if (!f) return
    setErr('')
    try {
      await saveAll()                                              // 입력 중이던 컬러·메모를 잃지 않게 먼저 저장
      const fd = new FormData(); fd.append('file', f)
      const r = await fetch(`/api/designs/${id}/versions/${curNo}/files`, { method: 'POST', body: fd, credentials: 'same-origin' })
      const j = await r.json().catch(() => ({}))
      if (!r.ok) throw new Error(j.error || r.statusText)
      await reload(curNo)
    } catch (e) { setErr(e.message); inputEl.value = '' }
  }

  const wire = (dlg) => {
    $('#v_sel').onchange = async () => { if (editable()) { try { await saveAll() } catch (e) { return setErr(e.message) } } await reload(Number($('#v_sel').value)) }
    $('#up_img')?.addEventListener('change', (e) => upload(e.target))
    $('#up_file')?.addEventListener('change', (e) => upload(e.target))
    $('#rm_img')?.addEventListener('click', async () => {
      try { await api(`/designs/${id}/versions/${curNo}/files?path=${encodeURIComponent(ver().previewImage)}`, { method: 'DELETE' }); await reload(curNo) } catch (e) { setErr(e.message) }
    })
    dlg.querySelectorAll('[data-rmf]').forEach((b) => b.addEventListener('click', async () => {
      if (!confirm('이 파일을 지울까요?')) return
      try { await api(`/designs/${id}/versions/${curNo}/files?path=${encodeURIComponent(b.dataset.rmf)}`, { method: 'DELETE' }); await reload(curNo) } catch (e) { setErr(e.message) }
    }))
    $('#th_add')?.addEventListener('click', () => {
      const code = $('#th_sel').value
      if (!code) return setErr('자수사를 선택하세요.')
      const t = threads.items.find((x) => x.code === code)
      colors.push({ code, label: t?.label || code, part: $('#th_part').value.trim() })
      $('#th_sel').value = ''; $('#th_part').value = ''
      setErr(''); paintColors()
    })
    $('#save')?.addEventListener('click', async () => {
      try { await saveAll(); await reload(curNo); done && done() } catch (e) { setErr(e.message) }
    })
    $('#d_confirm')?.addEventListener('click', async () => {
      if (!confirm(`v${curNo}을(를) 확정할까요? 확정하면 수정할 수 없고, 고치려면 새 버전을 만들어야 합니다.`)) return
      try { await saveAll(); await api(`/designs/${id}/versions/${curNo}/confirm`, { method: 'POST' }); await reload(curNo); done && done() } catch (e) { setErr(e.message) }
    })
    $('#d_newver')?.addEventListener('click', async () => {
      try { const v = await api(`/designs/${id}/versions`, { method: 'POST' }); await reload(v.no); done && done() } catch (e) { setErr(e.message) }
    })
    $('#d_del')?.addEventListener('click', async () => {
      if (!confirm('이 디자인을 삭제할까요? 되돌릴 수 없습니다.')) return
      try { await api(`/designs/${id}`, { method: 'DELETE' }); dlg.close(); done && done() } catch (e) { setErr(e.message) }
    })
  }
  render()
}

// ── 주문 화면의 '디자인' 영역 ──────────────────────────────
// 한 주문에 디자인을 여러 개 연결할 수 있다(로고 + 이니셜 등). 연결은 '쓰는 버전'에 고정된다.
function wireDesigns(initial, canW, partnerOf) {
  const box = $('#dz_box')
  let list = initial.map((x) => ({ designId: String(x.designId), version: x.version, role: x.role || '', note: x.note || '', code: x.code, name: x.name, versions: null }))
  const info = new Map(initial.map((x) => [String(x.designId), x]))

  const ensure = async (l) => {
    if (l.versions) return
    try { l.versions = (await api(`/designs/${l.designId}`)).versions } catch (e) { l.versions = [] }
  }
  const verOf = (l) => (l.versions || []).find((v) => v.no === l.version)
  const paint = async () => {
    await Promise.all(list.map(ensure))
    box.innerHTML = `${list.length ? list.map((l, i) => {
      const v = verOf(l)
      const latest = (l.versions || []).reduce((m, x) => (!m || x.no > m.no ? x : m), null)
      const newer = latest && latest.no > l.version
      return `<div class="dz-row">
        <span>${thumb(v?.previewImage || info.get(l.designId)?.preview)}</span>
        <div class="dz-main">
          <div><b>${esc(l.code || '')}</b> ${esc(l.name || '')} ${v ? badge(`v${l.version} ${v.status}`, DS_BADGE[v.status]) : badge('삭제됨', 'b-bad')}
            ${newer ? `<span class="field-hint">· 새 버전 v${latest.no}(${esc(latest.status)})이 있습니다</span>` : ''}</div>
          <div class="field-hint">${(v?.colors || []).map((c) => esc(`${c.label || c.code}${c.part ? '(' + c.part + ')' : ''}`)).join(' · ') || '컬러 미지정'}
            ${(v?.files || []).map((f) => ` · <a href="${esc(fileUrl(f.path))}" download>${esc(f.name)}</a>`).join('')}</div>
        </div>
        <div class="dz-ctl">
          <select class="field-input" data-dz-role="${i}" ${canW ? '' : 'disabled'}>${[['', '용도 없음'], ['로고', '로고'], ['이니셜', '이니셜']].map(([k, t]) => `<option value="${k}" ${k === l.role ? 'selected' : ''}>${t}</option>`).join('')}</select>
          <select class="field-input" data-dz-ver="${i}" ${canW ? '' : 'disabled'}>${(l.versions || []).slice().sort((a, b) => b.no - a.no).map((x) => `<option value="${x.no}" ${x.no === l.version ? 'selected' : ''}>v${x.no} ${esc(x.status)}</option>`).join('')}</select>
          ${canW ? `<button type="button" class="tb-logout" data-dz-rm="${i}">제거</button>` : ''}
        </div></div>`
    }).join('') : '<div class="field-hint">연결된 디자인이 없습니다.</div>'}
      ${canW ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <input class="field-input" id="dz_q" placeholder="디자인 검색 (이름·코드·거래처)" style="flex:1;min-width:180px">
        <select class="field-input" id="dz_sel" style="flex:1;min-width:200px"><option value="">검색 결과…</option></select>
        <button type="button" class="btn btn-ghost" id="dz_add">연결</button>
        ${me.can.includes('design') ? '<button type="button" class="btn btn-ghost" id="dz_new">새 디자인</button>' : ''}</div>` : ''}`
    box.querySelectorAll('[data-dz-role]').forEach((s) => { s.onchange = () => { list[s.dataset.dzRole].role = s.value } })
    box.querySelectorAll('[data-dz-ver]').forEach((s) => { s.onchange = () => { list[s.dataset.dzVer].version = Number(s.value); paint() } })
    box.querySelectorAll('[data-dz-rm]').forEach((b) => { b.onclick = () => { list.splice(Number(b.dataset.dzRm), 1); paint() } })
    const search = debounce(async () => {
      const q = $('#dz_q').value.trim()
      const sel = $('#dz_sel')
      try {
        const r = await api(`/designs?active=1&limit=30${q ? `&q=${encodeURIComponent(q)}` : ''}${!q && partnerOf() ? `&partnerId=${partnerOf()}` : ''}`)
        sel.innerHTML = '<option value="">검색 결과…</option>' + r.items.map((d) => `<option value="${d._id}" data-code="${esc(d.code)}" data-name="${esc(d.name)}">${esc(d.code)} ${esc(d.name)}${d.partnerName ? ` · ${esc(d.partnerName)}` : ''} (v${d.latestVersion} ${esc(d.latestStatus)})</option>`).join('')
      } catch (e) { /* 무시 */ }
    }, 250)
    $('#dz_q')?.addEventListener('input', search)
    search()
    $('#dz_add')?.addEventListener('click', async () => {
      const o = $('#dz_sel').selectedOptions[0]
      if (!o || !o.value) return setErr('연결할 디자인을 고르세요.')
      try {
        const d = await api(`/designs/${o.value}`)
        const best = d.versions.filter((v) => v.status === '확정').sort((a, b) => b.no - a.no)[0] || d.versions.slice().sort((a, b) => b.no - a.no)[0]
        list.push({ designId: String(d._id), version: best.no, role: '', note: '', code: d.code, name: d.name, versions: d.versions })
        info.set(String(d._id), { preview: best.previewImage })
        setErr(''); paint()
      } catch (e) { setErr(e.message) }
    })
    $('#dz_new')?.addEventListener('click', () => {
      // 새 디자인은 별도 드로어에서 만든다 — 주문 입력 중인 내용이 사라지지 않도록 이름만 받아 바로 만든다
      const name = prompt('새 디자인 이름 (예: CRS 로고)\n거래처는 이 주문의 거래처로 들어갑니다. 파일·컬러는 디자인 메뉴에서 올리세요.')
      if (!name || !name.trim()) return
      api('/designs', { method: 'POST', body: { name: name.trim(), partnerId: partnerOf() || null } }).then((d) => {
        list.push({ designId: String(d._id), version: 1, role: '', note: '', code: d.code, name: d.name, versions: d.versions })
        setErr(''); paint()
      }).catch((e) => setErr(e.message))
    })
  }
  paint()
  return () => list.map((l) => ({ designId: l.designId, version: l.version, role: l.role, note: l.note }))
}

// ── 작업지시서 (A4 한 장에 2개, PDF) ─────────────────────────────
// 작업일자 기준으로 배정된 주문을 보여 주고, 체크한 주문의 작업지시서를 만든다.
// 양식: 왼쪽 표(주문번호·주문명·작업일자, 수모 컬러/사이즈, 이니셜 좌/우, 로고 침·색상, 작업자) + 오른쪽 디자인 이미지·메모.
// 제작 명세가 여러 줄인 주문은 지시서에 색상×사이즈 합계를 싣고, 개별 내역은 별지(표)로 뒤에 붙인다.
const WS = { date: '', all: false, rows: [], sel: new Set() }
const WS_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
]
const loadScript = (src) => new Promise((res, rej) => {
  if (document.querySelector(`script[data-lib="${src}"]`)) return res()
  const el = document.createElement('script')
  el.src = src; el.dataset.lib = src
  el.onload = res
  el.onerror = () => rej(new Error('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하거나 [인쇄]를 사용하세요.'))
  document.head.appendChild(el)
})

async function viewWorksheets() {
  if (!WS.date) WS.date = ymd(new Date())
  pageShell({
    en: 'Worksheets', title: '작업지시서', addLabel: '',
    tools: `<input id="ws_date" class="table-select" type="date" value="${WS.date}">
      <button class="btn btn-ghost" id="ws_today" type="button">오늘</button><button class="btn btn-ghost" id="ws_tom" type="button">내일</button>
      <label class="table-check"><input type="checkbox" id="ws_all" ${WS.all ? 'checked' : ''}> 미완료 배정 전체(오늘부터 30일)</label>
      <span style="flex:1"></span>
      <span id="ws_cnt" class="field-hint"></span>
      <button class="btn btn-ghost" id="ws_print" type="button">인쇄</button>
      <button class="btn btn-primary" id="ws_pdf" type="button">작업지시서 PDF</button>`,
  })
  const keyOf = (r) => `${r.orderId}|${r.date}`
  const count = () => { $('#ws_cnt').textContent = WS.sel.size ? `${WS.sel.size}건 선택` : '' }

  const paint = () => {
    paintTable(WS.rows, [
      ['chk', '<input type="checkbox" id="ws_chk_all" title="전체 선택">', (r) => `<input type="checkbox" data-ws="${esc(keyOf(r))}" ${WS.sel.has(keyOf(r)) ? 'checked' : ''}>`],
      ['no', '#', (r) => `<b>#${r.orderNo}</b>`],
      ['title', '주문명', (r) => esc(r.title)],
      ['partner', '거래처', (r) => esc(r.partnerName)],
      ['date', '작업일자', (r) => esc(r.date)],
      ['tasks', '공정 · 수량', (r) => r.tasks.map((t) => `${esc(t.task || '전체')} ${won(t.qty)}장`).join(' · ')],
      ['st', '상태', (r) => badge(r.status, r.status === '완료' ? 'b-good' : r.status === '진행' ? 'b-info' : 'b-warn')],
      ['dz', '디자인', (r) => { const m = { ready: ['확정', 'b-good'], working: ['작업 중', 'b-warn'], none: ['없음', 'b-bad'], na: ['불필요', 'b-mute'] }[r.designState] || ['없음', 'b-bad']; return badge(m[0], m[1]) }],
    ], null, '이 날짜에 배정된 주문이 없습니다.')
    $('#ft').textContent = `${WS.rows.length}건`
    const all = $('#ws_chk_all')
    if (all) {
      all.checked = WS.rows.length > 0 && WS.rows.every((r) => WS.sel.has(keyOf(r)))
      all.onchange = () => { WS.rows.forEach((r) => (all.checked ? WS.sel.add(keyOf(r)) : WS.sel.delete(keyOf(r)))); paint() }
    }
    document.querySelectorAll('[data-ws]').forEach((c) => {
      c.onchange = () => { c.checked ? WS.sel.add(c.dataset.ws) : WS.sel.delete(c.dataset.ws); count(); if (all) all.checked = WS.rows.every((r) => WS.sel.has(keyOf(r))) }
    })
    count()
  }

  const load = async () => {
    try {
      const all = $('#ws_all').checked
      WS.all = all; WS.date = $('#ws_date').value || ymd(new Date())
      const from = all ? ymd(new Date()) : WS.date
      const to = all ? ymd(addDays(new Date(), 30)) : WS.date
      const r = await api(`/schedule?from=${from}&to=${to}`)
      const map = new Map()
      for (const e of r.entries) {
        if (all && e.status === '완료') continue
        const k = `${e.orderId}|${e.date}`
        if (!map.has(k)) map.set(k, { orderId: String(e.orderId), orderNo: e.orderNo, title: e.order?.title || '', partnerName: e.order?.partnerName || '', date: e.date, tasks: [], notes: [], statuses: [], designState: e.order?.designState || 'none' })
        const row = map.get(k)
        const t = row.tasks.find((x) => x.task === (e.task || ''))
        if (t) t.qty += e.qty; else row.tasks.push({ task: e.task || '', qty: e.qty })
        row.statuses.push(e.status)
        if (e.note) row.notes.push(e.note)
      }
      WS.rows = [...map.values()].map((r) => ({ ...r, status: r.statuses.every((s) => s === '완료') ? '완료' : r.statuses.some((s) => s !== '지시') ? '진행' : '지시' }))
        .sort((a, b) => a.date.localeCompare(b.date) || a.orderNo - b.orderNo)
      // 목록에서 사라진 행은 선택에서 뺀다
      const keys = new Set(WS.rows.map(keyOf))
      for (const k of [...WS.sel]) if (!keys.has(k)) WS.sel.delete(k)
      paint()
    } catch (e) { $('#tbl').innerHTML = emptyTable(e.message) }
  }

  $('#ws_date').addEventListener('change', load)
  $('#ws_all').addEventListener('change', load)
  $('#ws_today').onclick = () => { $('#ws_date').value = ymd(new Date()); $('#ws_all').checked = false; load() }
  $('#ws_tom').onclick = () => { $('#ws_date').value = ymd(addDays(new Date(), 1)); $('#ws_all').checked = false; load() }
  $('#ws_pdf').onclick = () => makeWorksheets('pdf')
  $('#ws_print').onclick = () => makeWorksheets('print')
  load()
}

// ── 지시서 HTML ─────────────────────────────────────────
const wsGroups = (o) => {
  const m = new Map()
  const ps = o.pieces || []
  if (ps.length) ps.forEach((p) => { const k = `${p.color || ''}\u0000${p.size || ''}`; m.set(k, (m.get(k) || 0) + 1) })
  else (o.items || []).forEach((i) => { const k = `${i.color || ''}\u0000${i.size || ''}`; m.set(k, (m.get(k) || 0) + (Number(i.qty) || 1)) })
  return [...m].map(([k, n]) => { const [color, size] = k.split('\u0000'); return { color, size, n } })
}

function wsSheet(row, o, pos) {
  const ps = o.pieces || []
  const one = ps.length === 1 ? ps[0] : null
  const many = ps.length > 1
  const groups = wsGroups(o)
  const shown = groups.slice(0, 4)
  const designs = o.designsState || []
  const logo = designs.find((d) => d.role === '로고') || designs.find((d) => d.role !== '이니셜') || designs[0] || null
  const initDesign = designs.find((d) => d.role === '이니셜')
  const colors = (logo?.colors || [])
  const colorText = (c) => `${c.label || c.code}${c.part ? ` (${c.part})` : ''}`
  const img = logo?.preview || initDesign?.preview || (o.attachments || [])[0] || ''
  const memo = [o.content, o.request, ...(row.notes || [])].filter((x) => x && String(x).trim()).join('\n')
  const taskTxt = row.tasks.map((t) => `${t.task || '전체'} ${won(t.qty)}장`).join(' · ')
  const tr = (cells) => `<tr>${cells.join('')}</tr>`

  const capRows = shown.map((g, i) => tr([`<td class="l">${i === 0 ? '컬러' : ''}</td>`, `<td>${esc(g.color)}</td>`, `<td>${esc(g.size)}${groups.length > 1 || g.n > 1 ? ` ×${g.n}` : ''}</td>`])).join('')
    + (groups.length > shown.length ? tr(['<td class="l"></td>', `<td colspan="2">외 ${groups.length - shown.length}종 — 별지 참조</td>`]) : '')
  const initRows = many
    ? tr(['<td class="l">좌측</td>', `<td colspan="2">개별 ${ps.length}건 — 별지 참조</td>`]) + tr(['<td class="l">우측</td>', '<td></td><td></td>'])
    : tr(['<td class="l">좌측</td>', `<td>${esc(one?.initials || '')}</td>`, `<td>${esc(one?.initialColor || '')}</td>`])
      + tr(['<td class="l">우측</td>', `<td>${esc(one?.initialsRight || '')}</td>`, `<td>${esc(one?.initialsRight ? (one?.initialColor || '') : '')}</td>`])
  const logoRows = [0, 1, 2, 3, 4, 5].map((i) => tr([`<td class="n">${i + 1}</td>`, '<td></td>', `<td>${colors[i] ? esc(colorText(colors[i])) : ''}</td>`])).join('')
    + tr(['<td class="n"></td>', '<td></td>', `<td>${colors.length > 6 ? `외 ${colors.length - 6}색` : ''}</td>`])

  return `<div class="ws-sheet ${pos}">
    <div class="ws-left">
      <table class="ws-t ws-head"><tbody>
        <tr><td class="no">#${row.orderNo}</td><td colspan="2" class="ti">${esc(row.title)}</td></tr>
        <tr><td class="l2">작업일자</td><td>${esc(row.date)}</td><td class="sub">${esc(taskTxt)}</td></tr>
      </tbody></table>
      <table class="ws-t"><thead><tr><th>수모</th><th>컬러</th><th>사이즈</th></tr></thead><tbody>${capRows || tr(['<td class="l">컬러</td>', '<td></td>', '<td></td>'])}</tbody></table>
      <table class="ws-t"><thead><tr><th>이니셜</th><th>이니셜</th><th>컬러</th></tr></thead><tbody>${initRows}</tbody></table>
      <table class="ws-t"><thead><tr><th>로고</th><th>침</th><th>색상</th></tr></thead><tbody>${logoRows}</tbody></table>
      <table class="ws-t"><tbody><tr><td class="l">작업자</td><td></td><td></td></tr></tbody></table>
    </div>
    <div class="ws-right">
      <div class="ws-img">${img ? `<img src="${esc(imgSrc(img))}" alt="">` : '<span>디자인 이미지 없음</span>'}</div>
      <div class="ws-cap">${logo ? `${esc(logo.code)} ${esc(logo.name)} v${logo.version}${logo.status ? ` (${esc(logo.status)})` : ''}` : ''}</div>
      <div class="ws-memo-l">메모</div>
      <div class="ws-memo">${esc(memo)}</div>
    </div>
  </div>`
}

// 별지: 제작 명세가 여러 줄인 주문의 개별 내역 (한 장에 40줄씩)
function wsDetailPages(row, o) {
  const ps = o.pieces || []
  if (ps.length <= 1) return []
  const PER = 32
  const pages = []
  const total = Math.ceil(ps.length / PER)
  for (let p = 0; p < total; p++) {
    const part = ps.slice(p * PER, (p + 1) * PER)
    pages.push(`<div class="ws-page ws-detail">
      <div class="ws-dh"><b>#${row.orderNo}</b> ${esc(row.title)} <span>· 작업일자 ${esc(row.date)} · 개별 주문내역 ${ps.length}건 (${p + 1}/${total})</span></div>
      <table class="ws-t ws-dt"><thead><tr><th>#</th>${PC_COLS.map((c) => `<th>${c[1]}</th>`).join('')}<th>확인</th></tr></thead><tbody>${
        part.map((x, i) => `<tr><td>${x.no || p * PER + i + 1}</td>${PC_COLS.map(([k]) => `<td>${esc(x[k] ?? '')}</td>`).join('')}<td></td></tr>`).join('')}</tbody></table>
    </div>`)
  }
  return pages
}

async function makeWorksheets(mode) {
  const picked = WS.rows.filter((r) => WS.sel.has(`${r.orderId}|${r.date}`))
  if (!picked.length) return alert('작업지시서를 만들 주문을 체크하세요.')
  const btn = $(mode === 'pdf' ? '#ws_pdf' : '#ws_print')
  const label = btn.textContent
  btn.disabled = true; btn.textContent = '준비 중…'
  try {
    // 주문 상세(제작 명세·디자인·메모)
    const details = await Promise.all(picked.map((r) => api(`/orders/${r.orderId}`)))
    const sheets = picked.map((r, i) => wsSheet(r, details[i], ''))
    const pages = []
    for (let i = 0; i < sheets.length; i += 2) {
      pages.push(`<div class="ws-page">${sheets[i].replace('class="ws-sheet "', 'class="ws-sheet top"')}${sheets[i + 1] ? sheets[i + 1].replace('class="ws-sheet "', 'class="ws-sheet bottom"') : ''}<div class="ws-cut"></div></div>`)
    }
    picked.forEach((r, i) => pages.push(...wsDetailPages(r, details[i])))

    let host = document.getElementById('ws_render')
    if (!host) { host = document.createElement('div'); host.id = 'ws_render'; document.body.appendChild(host) }
    host.innerHTML = pages.join('')
    // 이미지·글꼴이 준비될 때까지
    await Promise.all([...host.querySelectorAll('img')].map((im) => (im.complete ? 1 : new Promise((res) => { im.onload = im.onerror = res }))))
    if (document.fonts?.ready) await document.fonts.ready

    if (mode === 'print') { window.print(); return }

    await Promise.all(WS_LIBS.map(loadScript))
    host.classList.add('pdfmode')                  // 캡처 중에만 글자 위치 보정 (admin.css 참고)
    const { jsPDF } = window.jspdf
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' })
    const els = [...host.querySelectorAll('.ws-page')]
    for (let i = 0; i < els.length; i++) {
      btn.textContent = `PDF 만드는 중 ${i + 1}/${els.length}`
      const canvas = await window.html2canvas(els[i], { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false })
      if (i) pdf.addPage()
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297)
    }
    pdf.save(`작업지시서_${WS.all ? ymd(new Date()) : WS.date}.pdf`)
  } catch (e) { alert(e.message) } finally { document.getElementById('ws_render')?.classList.remove('pdfmode'); btn.disabled = false; btn.textContent = label }
}
